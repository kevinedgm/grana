<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GbOfferDetail · banco de Booking (bruno)</title>
<!-- Banco de GbOfferDetail con los bloques REALES (packages/blocks/dist/booking.js) y el banco único de la sección
     (src/blocks/GbOfferDetail/offer-detail.bank.js). Requiere `npm run build` en packages/vue y packages/blocks.
     Desde la raíz del repo: python3 -m http.server 4214 → /packages/blocks/playground/booking/offer-detail.html
     Parámetros: ?tema=defecto|rustico|lujo · ?dark=1 · ?v=01|02|03 · ?zoom=2 · ?anidado=1 · ?estado=… -->
<link rel="stylesheet" href="/packages/vue/dist/fonts.css">
<link rel="stylesheet" href="/packages/vue/dist/grana.css">
<link rel="stylesheet" id="tema" href="data:text/css,">
<style>
  /* Andamio del banco (no es de Grana ni del bloque) */
  body{margin:0;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  .pg-label{margin:var(--g-space-6) 0 var(--g-space-2);font-size:13px;color:var(--g-color-text-muted)}
  .pg-stage{padding-block-end:var(--g-space-8)}
  .pg-tall{block-size:300vh}
</style>
<script>
  // Activa los avisos de desarrollo de Grana en el navegador (sin empaquetador `process` no existe, #653)
  window.process = { env: { NODE_ENV: 'development' } }
</script>
<script type="importmap">
{ "imports": {
  "vue": "/node_modules/vue/dist/vue.esm-browser.js",
  "@grana/vue": "/packages/vue/dist/grana.js",
  "@grana/vue/booking": "/packages/vue/dist/booking.js",
  "@grana/vue/gallery": "/packages/vue/dist/gallery.js",
  "@grana/vue/price": "/packages/vue/dist/price.js",
  "@grana/vue/hero": "/packages/vue/dist/hero.js",
  "@grana/vue/tag": "/packages/vue/dist/tag.js",
  "@grana/blocks/booking": "/packages/blocks/dist/booking.js"
} }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  // De una en una por defecto (?v=01|02|03): las tres repetirían las anclas de los espacios (#fotos-bano) y de los
  // apartados. ?consult=1 pone un GbSearch01 (banco de Search) en el slot `consult` en lugar de «Reservar».
  import { h } from 'vue'
  import { GbSearch01 } from '@grana/blocks/booking'
  import { mountBank } from './app.js'
  import * as base from '/packages/blocks/src/blocks/GbOfferDetail/offer-detail.bank.js'
  import * as search from '/packages/blocks/src/blocks/GbSearch/search.bank.js'
  const q = new URLSearchParams(location.search)
  const bank = q.has('consult') ? { ...base, slots: { consult: () => h(GbSearch01, { ...search.props, onSubmit: (p) => p.preventDefault() }) } } : base
  mountBank('OfferDetail', bank, { concepts: { '01': 'Espacios + ficha', '02': 'Tira + pestañas', '03': 'Lectura larga' }, only: ['01'] })
</script>
</body>
</html>
