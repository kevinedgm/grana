<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GbItinerary · banco de Booking (bruno)</title>
<!-- Banco de GbItinerary con los bloques REALES (packages/blocks/dist/booking.js) y el banco único de la sección
     (src/blocks/GbItinerary/itinerary.bank.js). Requiere `npm run build` en packages/vue y packages/blocks.
     Desde la raíz del repo: python3 -m http.server 4214 → /packages/blocks/playground/booking/itinerary.html
     Parámetros: ?tema=defecto|rustico|lujo · ?dark=1 · ?v=01|02|03 · ?zoom=2 · ?anidado=1 · ?estado=… -->
<link rel="stylesheet" href="/packages/vue/dist/fonts.css">
<link rel="stylesheet" href="/packages/vue/dist/grana.css">
<link rel="stylesheet" id="tema" href="data:text/css,">
<style>
  /* Andamio del banco (no es de Grana ni del bloque) */
  body{margin:0;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  .pg-label{margin:var(--g-space-6) 0 var(--g-space-2);font-size:13px;color:var(--g-color-text-muted)}
  .pg-stage{padding-block-end:var(--g-space-8)}
  .pg-tall{block-size:300vh}
</style>
<script>
  // Activa los avisos de desarrollo de Grana en el navegador (sin empaquetador `process` no existe, #653)
  window.process = { env: { NODE_ENV: 'development' } }
</script>
<script type="importmap">
{ "imports": {
  "vue": "/node_modules/vue/dist/vue.esm-browser.js",
  "@grana/vue": "/packages/vue/dist/grana.js",
  "@grana/vue/booking": "/packages/vue/dist/booking.js",
  "@grana/vue/gallery": "/packages/vue/dist/gallery.js",
  "@grana/vue/price": "/packages/vue/dist/price.js",
  "@grana/vue/hero": "/packages/vue/dist/hero.js",
  "@grana/vue/tag": "/packages/vue/dist/tag.js",
  "@grana/blocks/booking": "/packages/blocks/dist/booking.js"
} }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  // De una en una por defecto (?v=01|02|03): 01 y 02 repetirían las anclas de los días. ?hoy=1 pone el primer día del
  // banco en la fecha de hoy en America/Mexico_City (para ver «Ahora» y «Siguiente»).
  import { mountBank } from './app.js'
  import * as base from '/packages/blocks/src/blocks/GbItinerary/itinerary.bank.js'
  const q = new URLSearchParams(location.search)
  let bank = base
  if (q.has('hoy')) {
    const today = new Intl.DateTimeFormat('en-CA', { timeZone: base.props.timeZone, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date())
    bank = { ...base, props: { ...base.props, days: base.props.days.map((d, i) => (i ? d : { ...d, date: today })) } }
  }
  mountBank('Itinerary', bank, { concepts: { '01': 'Lista con hora', '02': 'Por días', '03': 'Tabla' }, only: ['01'] })
</script>
</body>
</html>
