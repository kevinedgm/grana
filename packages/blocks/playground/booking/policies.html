<title>GbPolicies · banco de Booking (bruno)</title>
<!-- Banco de GbPolicies con los bloques REALES (packages/blocks/dist/booking.js) y el banco único de la sección
     (src/blocks/GbPolicies/policies.bank.js). Requiere `npm run build` en packages/vue y packages/blocks.
     Desde la raíz del repo: python3 -m http.server 4214 → /packages/blocks/playground/booking/policies.html
     Parámetros: ?tema=defecto|rustico|lujo · ?dark=1 · ?v=01|02|03 · ?zoom=2 · ?anidado=1 · ?estado=… -->
<link rel="stylesheet" href="/packages/vue/dist/fonts.css">
<link rel="stylesheet" href="/packages/vue/dist/grana.css">
<link rel="stylesheet" id="tema" href="data:text/css,">
<style>
  /* Andamio del banco (no es de Grana ni del bloque) */
  body{margin:0;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  .pg-label{margin:var(--g-space-6) 0 var(--g-space-2);font-size:13px;color:var(--g-color-text-muted)}
  .pg-stage{padding-block-end:var(--g-space-8)}
  .pg-tall{block-size:300vh}
</style>
<script>
  // Activa los avisos de desarrollo de Grana en el navegador (sin empaquetador `process` no existe, #653)
  window.process = { env: { NODE_ENV: 'development' } }
</script>
<script type="importmap">
{ "imports": {
  "vue": "/node_modules/vue/dist/vue.esm-browser.js",
  "@grana/vue": "/packages/vue/dist/grana.js",
  "@grana/vue/booking": "/packages/vue/dist/booking.js",

} }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  // De una en una por defecto (?v=01|02|03): las tres repetirían las anclas (#cancelacion)
  import { mountBank } from './app.js'
  import * as bank from '/packages/blocks/src/blocks/GbPolicies/policies.bank.js'
  mountBank('Policies', bank, { concepts: { '01': 'Avance', '02': 'Todo a la vista', '03': 'Tarjetas' }, only: ['01'] })
