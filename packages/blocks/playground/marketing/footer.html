<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GbFooter · banco de Marketing (bruno)</title>
<!-- Banco de GbStats con los bloques REALES (packages/blocks/dist/marketing.js) y el banco único de la sección
     (src/blocks/GbFooter/footer.bank.js). Las tres variantes una debajo de otra. Requiere `npm run build` en packages/vue y packages/blocks.
     Desde la raíz del repo: python3 -m http.server 4213 → /packages/blocks/playground/marketing/footer.html
     Parámetros: ?tema=defecto|rustico|lujo (temas de @grana/cli en ./temas/) · ?dark=1 · ?v=01|02|03 · ?zoom=2 · ?anidado=1 -->
<link rel="stylesheet" href="/packages/vue/dist/fonts.css">
<link rel="stylesheet" href="/packages/vue/dist/grana.css">
<link rel="stylesheet" id="tema" href="data:text/css,">
<style>
  /* Andamio del banco (no es de Grana ni del bloque) */
  body{margin:0;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  .pg-label{margin:var(--g-space-6) 0 var(--g-space-2);font-size:13px;color:var(--g-color-text-muted)}
  .pg-stage{padding-block-end:var(--g-space-8)}
</style>
<script>
  // Activa los avisos de desarrollo de Grana en el navegador (sin empaquetador `process` no existe, #653)
  window.process = { env: { NODE_ENV: 'development' } }
  
</script>
<script type="importmap">
{ "imports": {
  "vue": "/node_modules/vue/dist/vue.esm-browser.js",
  "@grana/vue": "/packages/vue/dist/grana.js",
  "@grana/vue/hero": "/packages/vue/dist/hero.js",
  "@grana/vue/booking": "/packages/vue/dist/booking.js",
  "@grana/vue/tag": "/packages/vue/dist/tag.js",
  "@grana/vue/app-shell": "/packages/vue/dist/app-shell.js",
  "/packages/blocks/src/blocks/GbNewsletter/GbNewsletter01.vue": "/packages/blocks/playground/marketing/newsletter01.shim.js",
  "@grana/blocks/marketing": "/packages/blocks/dist/marketing.js"
} }
</script>
</head>
<body>
<div id="app"></div>
<script type="module">
  import { mountBank } from './app.js'
  import * as bank from '/packages/blocks/src/blocks/GbFooter/footer.bank.js'
  const q = new URLSearchParams(location.search)
  if (q.has('shell')) {
    // ?shell=1: GbFooter01 dentro del slot footer de GAppShell con as="div" (el chasis ya da el contentinfo, footer.md)
    const { createApp, h } = await import('vue')
    const { default: Grana, GContainer, GSection, createIcons } = await import('@grana/vue')
    const { GAppShell } = await import('@grana/vue/app-shell')
    const { marketing, GbFooter01 } = await import('@grana/blocks/marketing')
    const icons = await Promise.all((bank.appIcons || []).map((n) => import(`/node_modules/lucide-static/dist/esm/icons/${n}.mjs`).then((m) => m.default)))
    const events = []
    window.blockEvents = events
    const app = createApp({ render: () => h(GAppShell, { labels: { skip: 'Saltar al contenido' } }, {
      default: () => h(GContainer, { as: 'div' }, () => h(GSection, { title: 'Página de prueba del chasis' }, () => h('p', 'Contenido de la página.'))),
      footer: () => h(GContainer, { as: 'div' }, () => h(GbFooter01, { ...bank.props, as: 'div', onNavigate: (p) => { p.event.preventDefault(); events.push(['navigate', '01', p.href]) } }))
    }) })
    app.use(Grana).use(marketing).use(createIcons(icons))
    app.config.warnHandler = (msg) => console.warn(`[Vue warn] ${msg}`)
    app.mount('#app')
    document.documentElement.dataset.ready = '1'
  } else {
    mountBank('Footer', bank, { concepts: { '01': 'Columnas', '02': 'Una línea', '03': 'Con suscripción' } })
  }
</script>
</body>
</html>
