<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GbCart · banco de Ecommerce (bruno)</title>
<!-- Banco de GbCart con los bloques REALES (packages/blocks/dist/ecommerce.js) y el banco único de la sección
     (src/blocks/GbCart/cart.bank.js). Requiere `npm run build` en packages/vue y packages/blocks.
     Desde la raíz del repo: python3 -m http.server 4219 → /packages/blocks/playground/ecommerce/cart.html
     Parámetros: ?tema=defecto|rustico|lujo · ?dark=1 · ?v=01|02|03 · ?zoom=2 · ?anidado=1 · ?estado=… -->
<link rel="stylesheet" href="/packages/vue/dist/fonts.css">
<link rel="stylesheet" href="/packages/vue/dist/grana.css">
<link rel="stylesheet" id="tema" href="data:text/css,">
<style>
  /* Andamio del banco (no es de Grana ni del bloque) */
  body{margin:0;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  .pg-label{margin:var(--g-space-6) 0 var(--g-space-2);font-size:13px;color:var(--g-color-text-muted)}
  .pg-stage{padding-block-end:var(--g-space-8)}
  .pg-trigger{margin:var(--g-space-4)}
</style>
<script>
  // Activa los avisos de desarrollo de Grana en el navegador (sin empaquetador `process` no existe, #653)
  window.process = { env: { NODE_ENV: 'development' } }
</script>
<script type="importmap">
{ "imports": {
  "vue": "/node_modules/vue/dist/vue.esm-browser.js",
  "@grana/vue": "/packages/vue/dist/grana.js",
  "@grana/vue/price": "/packages/vue/dist/price.js",
  "@grana/vue/gallery": "/packages/vue/dist/gallery.js",
  "@grana/vue/tag": "/packages/vue/dist/tag.js",
  "@grana/vue/load-region": "/packages/vue/dist/load-region.js",
  "@grana/blocks/ecommerce": "/packages/blocks/dist/ecommerce.js"
} }
</script>
</head>
<body>
<!-- El disparador del cajón (03): es de la aplicación; el bloque solo lleva el GDialog (from = su id) -->
<p class="pg-trigger"><button type="button" id="abrir-carrito">Abrir el carrito (03)</button></p>
<div id="app"></div>
<script type="module">
  import { mountBank } from './app.js'
  import * as bank from '/packages/blocks/src/blocks/GbCart/cart.bank.js'
  await mountBank('Cart', bank, { concepts: { '01': 'Lista + resumen al lado', '02': 'Resumen al pie', '03': 'Cajón' } })
  document.getElementById('abrir-carrito').addEventListener('click', () => { const v = window.blockViews && window.blockViews['03']; if (v) { v.from = 'abrir-carrito'; v.open = true } })
</script>
</body>
</html>
