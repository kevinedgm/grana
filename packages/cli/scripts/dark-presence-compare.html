<!doctype html><meta charset="utf-8"><title>dpres</title>
<style>body{margin:0;background:#111;color:#eee;font:12px system-ui}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:6px}figure{margin:0}iframe{width:100%;height:330px;border:0;background:#000}figcaption{padding:2px 4px}</style>
<div class="g" id="g"></div>
<script>
const q=new URLSearchParams(location.search);const theme=q.get('t')||'crimson';const y=+q.get('y')||0;const floors=['base','0.66','0.7','0.74'];
for(const f of floors){const fig=document.createElement('figure');fig.innerHTML='<figcaption>'+theme+' · '+(f==='base'?'actual (mínimo 4.5:1)':'piso L ≥ '+f)+'</figcaption><iframe></iframe>';document.getElementById('g').append(fig);
const fr=fig.querySelector('iframe');fr.src='../index.html?x='+f;fr.onload=async()=>{const d=fr.contentDocument;const css=await (await fetch(theme+'-'+f+'.css',{cache:'reload'})).text();d.getElementById('theme').textContent=css;d.documentElement.dataset.theme='dark';await new Promise(r=>setTimeout(r,500));d.getAnimations().forEach(a=>{try{a.finish()}catch(e){}});fr.contentWindow.scrollTo(0,y)}}
</script>
