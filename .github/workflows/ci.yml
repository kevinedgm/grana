name: CI

# Verificación en cada push y pull request a main:
#   verify        pruebas (vitest), build, vigilante de iconos y compuertas del dist
#   e2e-chromium  subconjunto rápido de Playwright en Chromium (design/lab/theme-playground)
#   audit         npm audit, solo informativo
# La pasada completa en Chromium, Firefox y WebKit está en e2e-full.yml (nocturna y manual).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Pruebas, build y compuertas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # Node >= 22 (el mismo que usa el desarrollo local)
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas (vitest de @grana/vue y @grana/cli)
        run: npm test

      - name: Build (vite build de todas las entradas + fuentes)
        run: npm run build

      - name: Vigilante de iconos (Lucide es la única fuente)
        run: node packages/vue/scripts/check-icons.mjs

      - name: README al día con los meta.json (props)
        run: node packages/vue/scripts/check-readme-props.mjs

      - name: README con ejemplos montables o marcados como fragmento
        run: node packages/vue/scripts/check-readme-fragments.mjs

      - name: Compuertas del dist (lo que debe estar y lo que no)
        run: bash .github/scripts/gates.sh

      - name: Guardar dist para las pruebas de navegador
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/vue/dist
          retention-days: 1
          if-no-files-found: error

  e2e-chromium:
    name: Playwright (Chromium, subconjunto)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRANA_PW_PORT: "4208"
      PLAYWRIGHT_HTML_OPEN: never
    defaults:
      run:
        working-directory: design/lab/theme-playground
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design/lab/theme-playground/package-lock.json
            design/lab/avisos-dev/package-lock.json

      # Las pruebas cargan /node_modules/vue de la raíz y el dist ya construido.
      - name: Instalar dependencias de la raíz
        run: npm ci
        working-directory: .

      - name: Recuperar dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages/vue/dist

      - name: Instalar dependencias del laboratorio
        run: npm ci

      - name: Fuentes del laboratorio (scripts/setup-fonts.mjs)
        run: npm run setup

      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('design/lab/theme-playground/package-lock.json') }}

      - name: Instalar Chromium (con dependencias del sistema)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar solo dependencias del sistema (navegador en caché)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Varias pruebas miden tiempos (tooltip 500/700 ms, cuadros de animación, Δ0px con movimiento):
      # con --workers=2 y reintentos se evita el ruido por carga, como en la pasada completa.
      # Subconjunto representativo: biblioteca, playground, distribución de formularios,
      # paneles anclados, tooltip y los componentes de formulario, más la Fase C (slider, tag,
      # acordeón, migas, vacío, región de carga y carga de la tabla; las pruebas de «rendimiento» de
      # bd888df viven en slider y breadcrumbs y son relativas, fiables con 2 workers), y los niveles de
      # GDialog y GFormFold (17 pruebas, ~10 s; sus medidas de movimiento toleran cuadros perdidos), y GFab
      # (#656: forma, teclado, confirmación, acuse, bordes, se aparta y velo; 17 pruebas, ~1 min). Los
      # personalidad-* (cuadros de animación), los -perf (un worker), el combobox y la voz
      # quedan para la pasada nocturna. Archivos explícitos: el filtro de Playwright es una
      # expresión regular sobre la ruta y «playground» coincidiría con todo el directorio.
      - name: Playwright (Chromium)
        run: |
          npx playwright test --project=chromium --workers=2 --retries=2 \
            --reporter=list,html --trace=retain-on-failure \
            tests/library.spec.mjs \
            tests/playground.spec.mjs \
            tests/form-distribution.spec.mjs \
            tests/panel-estable.spec.mjs \
            tests/tooltip.spec.mjs \
            tests/form-section.spec.mjs \
            tests/form-reveal.spec.mjs \
            tests/form-blur-click.spec.mjs \
            tests/number-field.spec.mjs \
            tests/time-field.spec.mjs \
            tests/radio-group.spec.mjs \
            tests/key-focus.spec.mjs \
            tests/dialog-focus.spec.mjs \
            tests/dialog-levels.spec.mjs \
            tests/form-fold.spec.mjs \
            tests/slider.spec.mjs \
            tests/tag.spec.mjs \
            tests/accordion.spec.mjs \
            tests/breadcrumbs.spec.mjs \
            tests/empty.spec.mjs \
            tests/load-region.spec.mjs \
            tests/table-load.spec.mjs \
            tests/sidebar-activo.spec.mjs \
            tests/fab.spec.mjs

      # Contención de tamaño en padres que se ajustan (hallazgo 3 de la integración real): 3 s en Chromium;
      # los tres motores van en la pasada completa.
      - name: Contención de tamaño (Chromium)
        working-directory: .
        run: node design/lab/contencion/verificar.mjs --engines=chromium

      # Avisos de desarrollo (#636, #653): R1 (ninguno en producción con Vite y webpack 5), R2 (salen en desarrollo)
      # y R3 (ESM sin empaquetar y UMD sin error) sobre el dist del artefacto, 13 comprobaciones en ~33 s.
      # Vite, webpack 5 y vue del banco están en su propio package.json (lockfile propio). Usa el `playwright`
      # de la raíz (1.63.0, la misma versión que el laboratorio) y, por tanto, el Chromium ya instalado arriba.
      # Puertos propios 5393 a 5395, sin choque con los 4208 de Playwright.
      - name: Instalar dependencias del banco de avisos
        working-directory: design/lab/avisos-dev
        run: npm ci

      - name: Avisos de desarrollo (#636, #653)
        working-directory: .
        run: node design/lab/avisos-dev/verificar.mjs

      - name: Informe de Playwright (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            design/lab/theme-playground/playwright-report
            design/lab/theme-playground/test-results
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: npm audit (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true # no bloquea: avisa. Un fallo aquí no pone en rojo el flujo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: npm audit de la raíz (@grana/vue y @grana/cli)
        run: npm audit --audit-level=high

      - name: npm audit (laboratorio de Playwright)
        if: always()
        run: npm audit --audit-level=high
        working-directory: design/lab/theme-playground
