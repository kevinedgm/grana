<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Grana" class="grana-a5 grana-mov">
  <style>.grana-mov{--grana-mov-ease:cubic-bezier(.2,1.5,.45,1)}.grana-mov .grana__armazon>path{stroke-dasharray:1 1.1;animation:grana-trazar 420ms cubic-bezier(.3,.6,.3,1) both}.grana-mov .grana__armazon>path:nth-child(2){animation-delay:240ms}.grana-mov .grana__armazon>path:nth-child(3){animation-delay:360ms;animation-duration:200ms}.grana-mov .grana__tinte{animation:grana-tenir 260ms ease-out 420ms both,grana-registro 520ms var(--grana-mov-ease) 620ms both}@keyframes grana-trazar{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}@keyframes grana-tenir{from{opacity:0}to{opacity:1}}@keyframes grana-registro{from{translate:-3px -3px}to{translate:0 0}}@media (prefers-reduced-motion:reduce){.grana-mov *{animation:none!important}}</style>
  <!-- Grana · armazón: tinte sólido del tema desplazado detrás; estructura en tinta (proporción intermedia, antenas cortas) -->
  <path class="grana__tinte" d="M23.2 10C29.16 10 36.70 16.72 36.70 25.00C36.70 33.28 30.66 40 23.2 40C15.74 40 9.70 33.28 9.70 25.00C9.70 16.72 17.24 10 23.2 10Z" transform="translate(3 3)" fill="var(--g-color-brand,#a3123a)"/>
  <g class="grana__armazon" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M23.2 10C29.16 10 36.70 16.72 36.70 25.00C36.70 33.28 30.66 40 23.2 40C15.74 40 9.70 33.28 9.70 25.00C9.70 16.72 17.24 10 23.2 10Z"/><path pathLength="1" d="M10.62 20.50Q23.2 22.90 35.78 20.50M10.19 27.50Q23.2 29.90 36.21 27.50M12.57 33.80Q23.2 36.20 33.83 33.80" stroke-width="2.6"/><path pathLength="1" d="M20.4 10.8 18.6 7.2M26 10.8 27.8 7.2"/></g>
</svg>
