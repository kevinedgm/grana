/* ---------- Popover u hoja, anclado a un campo o una barra ---------- */
class Pop{
  constructor(picker,{triggers,anchor,root,title='Elegir fechas'}){
    this.p=picker;this.triggers=triggers;this.anchor=anchor||triggers[0]
    const pop=this.pop=document.createElement('div');pop.className='g-datepicker__pop';pop.setAttribute('popover','manual');pop.setAttribute('role','dialog');pop.setAttribute('aria-label',title)
    pop.innerHTML=`<div class="g-datepicker__sheet-head"><button type="button" class="g-datepicker__sheet-close" aria-label="Cerrar"></button></div>`
    pop.append(picker.el.parentElement);root.append(pop)
    triggers.forEach(t=>{t.setAttribute('aria-haspopup','dialog');t.setAttribute('aria-expanded','false');t.addEventListener('click',()=>this.pop.matches(':popover-open')?this.close(true):this.open(t))})
    pop.querySelector('.g-datepicker__sheet-close').addEventListener('click',()=>this.close(true))
    pop.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();this.close(true)}})
    pop.addEventListener('focusout',e=>{const r=e.relatedTarget;if(r&&!pop.contains(r)&&!triggers.some(t=>t.contains(r)))this.close(false)})
    document.addEventListener('pointerdown',e=>{if(pop.matches(':popover-open')&&!pop.contains(e.target)&&!triggers.some(t=>t.contains(e.target)))this.close(false)})
    addEventListener('resize',()=>{if(pop.matches(':popover-open'))this.place()})
  }
  open(t){
    this.cur=t;this.triggers.forEach(x=>x.setAttribute('aria-expanded',String(x===t)))
    this.pop.showPopover();this.p.fit();this.place()
    this.p.focus=this.p.start||TODAY;this.p.ensureVisible(this.p.focus);this.p.paint();this.p.focusDay()
  }
  place(){
    const r=this.anchor.getBoundingClientRect(),pop=this.pop
    if(matchMedia('(max-width:520px)').matches){pop.style.cssText='';return}
    pop.style.setProperty('--_max','none');const w=pop.offsetWidth,h=pop.offsetHeight
    let left=Math.max(8,Math.min(r.left,innerWidth-w-8)),top=r.bottom+8,up=false
    if(top+h>innerHeight-8&&r.top-h-8>8){up=true}
    pop.classList.toggle('is-up',up);pop.style.setProperty('--_x',left+'px')
    if(up){pop.style.setProperty('--_top','auto');pop.style.setProperty('--_bottom',(innerHeight-r.top+8)+'px')}else{pop.style.setProperty('--_top',top+'px');pop.style.setProperty('--_bottom','auto')}
    pop.style.setProperty('--_max',(up?r.top-16:innerHeight-r.bottom-16)+'px')
  }
  close(ret){
    if(!this.pop.matches(':popover-open'))return
    this.pop.hidePopover();this.triggers.forEach(x=>x.setAttribute('aria-expanded','false'))
    if(ret)(this.cur||this.triggers[0]).focus()
  }
}

  host.className=cls(o)
  const req=o.required?'<span class="g-datepicker__required" aria-hidden="true">*</span>':''
  const btn=(bid,lab,ph)=>`<button class="g-datepicker__field" id="${bid}" type="button" ${o.disabled?'disabled':''} ${o.readonly?'aria-readonly="true"':''} aria-labelledby="${bid}-l ${bid}-v"><span class="g-datepicker__icon" aria-hidden="true"></span><span class="g-datepicker__value g-datepicker__value--placeholder" id="${bid}-v">${ph}</span></button>`
  let h=''
  if(o.split)h=`<span class="g-datepicker__label">${o.label}</span><div class="g-datepicker__fields" role="group"><div class="g-datepicker__item"><span class="g-datepicker__label" id="${id}a-l">Desde</span>${btn(id+'a','Desde','Fecha de inicio')}</div><div class="g-datepicker__item"><span class="g-datepicker__label" id="${id}b-l">Hasta</span>${btn(id+'b','Hasta','Fecha de fin')}</div></div>`
  else h=`<span class="g-datepicker__label" id="${id}-l">${o.label}${req}</span>${btn(id,o.label,o.placeholder||'Elige fechas')}`
  if(o.hint)h+=`<div class="g-datepicker__hint">${o.hint}</div>`
  h+=`<div class="g-datepicker__error" aria-live="polite">${o.error||''}</div>`
  host.innerHTML=h
  return host
}
function mount(o){
  const host=fieldHost(o);document.getElementById('fields').append(host)
  if(o.disabled||o.readonly)return host
  const triggers=[...host.querySelectorAll('.g-datepicker__field')],holder=document.createElement('div')
  const setv=(b,t,ph)=>{const v=b.querySelector('.g-datepicker__value');v.textContent=t||ph;v.classList.toggle('g-datepicker__value--placeholder',!t)}
  const pk=new Picker(holder,{mode:o.mode||'range',proximity:o.proximity||[],min:TODAY,disabled:s=>hol.includes(s),avail:()=>innerWidth-32,done:()=>pop.close(true),
    onChange:v=>{if(o.split){setv(triggers[0],v.start&&fmt(v.start),'Fecha de inicio');setv(triggers[1],v.end&&fmt(v.end),'Fecha de fin')}else setv(triggers[0],v.start&&(o.mode==='single'||!v.end?fmt(v.start):`${fmt(v.start,'short')} – ${fmt(v.end)}`),'Elige fechas')},
    onComplete:o.mode==='single'?()=>setTimeout(()=>pop.close(true),120):null})
  const pop=new Pop(pk,{triggers,anchor:host,root:host})
  host.addEventListener('click',e=>{host.classList.toggle('is-open',pop.pop.matches(':popover-open'))})
  new MutationObserver(()=>host.classList.toggle('is-open',pop.pop.matches(':popover-open'))).observe(pop.pop,{attributes:true})
  return host
}
mount({label:'Fechas',proximity:[1,3,7],hint:'Con proximidad'})
mount({label:'Fecha',mode:'single',placeholder:'Elige una fecha'})
mount({label:'Estancia',split:true})
mount({label:'Fechas (soft)',variant:'soft'})
mount({label:'Fechas (xs)',size:'xs'}); mount({label:'Fechas (sm)',size:'sm'}); mount({label:'Fechas (lg)',size:'lg'}); mount({label:'Fechas (xl)',size:'xl'})
mount({label:'Con error',error:'Elige un rango válido',required:true})
mount({label:'Deshabilitado',disabled:true}); mount({label:'Solo lectura',readonly:true})
