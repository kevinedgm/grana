<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grana · Motion Demo</title>
<style>
:root{
  --brand:#9D1635; --accent:#D85A70; --bg:#f7f5f5; --surface:#fff;
  --text:#241f20; --muted:#746a6c; --border:#e8dfe1;
}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:grid; place-items:center;
  background:var(--bg); color:var(--text);
  font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.card{
  width:min(92vw,440px); padding:32px; border:1px solid var(--border);
  border-radius:24px; background:var(--surface);
  box-shadow:0 18px 55px rgb(70 25 36 / .08); text-align:center;
}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
h1{margin:8px 0 6px;font-size:24px}
p{margin:0 0 24px;color:var(--muted)}
.stage{height:190px;display:grid;place-items:center}
.avatar{
  width:150px;height:150px;overflow:visible;cursor:pointer;
  filter:drop-shadow(0 12px 16px rgb(92 18 44 / .14));
}
.body,.antenna,.eyes,.leg{transform-box:fill-box;transform-origin:center}
.avatar[data-state="idle"] .body{animation:breathe 3s ease-in-out infinite}
.avatar[data-state="idle"] .eyes{animation:blink 4.2s ease-in-out infinite}
.avatar[data-state="thinking"] .body{animation:thinkBody .62s ease-in-out infinite alternate}
.avatar[data-state="thinking"] .antenna-left{animation:antL .45s ease-in-out infinite alternate}
.avatar[data-state="thinking"] .antenna-right{animation:antR .45s ease-in-out infinite alternate}
.avatar[data-state="thinking"] .eyes{animation:look .72s ease-in-out infinite alternate}
.avatar[data-state="thinking"] .leg-left{animation:legL .55s ease-in-out infinite alternate}
.avatar[data-state="thinking"] .leg-right{animation:legR .55s ease-in-out infinite alternate}
.avatar[data-state="success"]{animation:success .7s cubic-bezier(.23,1,.32,1)}
.avatar[data-state="success"] .eyes{transform:scaleY(.35)}
.avatar[data-state="error"]{animation:error .45s ease-in-out}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
@keyframes thinkBody{from{transform:translateY(-3px) rotate(-1deg)}to{transform:translateY(4px) rotate(1deg)}}
@keyframes antL{from{transform:rotate(0)}to{transform:rotate(-14deg)}}
@keyframes antR{from{transform:rotate(0)}to{transform:rotate(14deg)}}
@keyframes look{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
@keyframes legL{from{transform:rotate(0)}to{transform:rotate(-7deg)}}
@keyframes legR{from{transform:rotate(0)}to{transform:rotate(7deg)}}
@keyframes success{0%{transform:scale(1)}35%{transform:scale(.88,1.12) translateY(5px)}65%{transform:scale(1.1,.92) translateY(-7px)}100%{transform:scale(1)}}
@keyframes error{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px) rotate(-3deg)}40%{transform:translateX(7px) rotate(3deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:8px}
button{
  appearance:none;border:1px solid var(--border);background:#fff;color:var(--text);
  border-radius:12px;padding:9px 13px;font:inherit;font-weight:650;cursor:pointer;
  transition:120ms ease;
}
button:hover{border-color:#c9b9bd;background:#fcf8f9}
button[data-active="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.status{margin-top:18px;font-size:13px;color:var(--muted)}
.status strong{color:var(--brand)}
@media(prefers-reduced-motion:reduce){.avatar,.avatar *{animation:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">Grana Motion Lab</div>
  <h1>Avatar geométrico</h1>
  <p>Demo mínima para probar estados antes de meter Rive en la ecuación.</p>

  <div class="stage">
    <svg id="avatar" class="avatar" data-state="idle" viewBox="0 0 160 160" role="img" aria-label="Avatar Grana">
      <g class="antenna antenna-left">
        <path d="M67 45 Q54 20 42 29" fill="none" stroke="#9D1635" stroke-width="6" stroke-linecap="round"/>
        <circle cx="41" cy="29" r="4.5" fill="#D85A70"/>
      </g>
      <g class="antenna antenna-right">
        <path d="M93 45 Q106 20 118 29" fill="none" stroke="#9D1635" stroke-width="6" stroke-linecap="round"/>
        <circle cx="119" cy="29" r="4.5" fill="#D85A70"/>
      </g>

      <g class="leg leg-left" fill="none" stroke="#9D1635" stroke-width="6" stroke-linecap="round">
        <path d="M52 75 Q32 68 25 58"/><path d="M49 92 Q28 94 21 104"/><path d="M55 110 Q38 121 35 132"/>
      </g>
      <g class="leg leg-right" fill="none" stroke="#9D1635" stroke-width="6" stroke-linecap="round">
        <path d="M108 75 Q128 68 135 58"/><path d="M111 92 Q132 94 139 104"/><path d="M105 110 Q122 121 125 132"/>
      </g>

      <g class="body">
        <ellipse cx="80" cy="88" rx="39" ry="52" fill="#9D1635"/>
        <ellipse cx="80" cy="88" rx="31" ry="44" fill="#a91b3c"/>
        <path d="M51 67 Q80 76 109 67" fill="none" stroke="#D85A70" stroke-width="5" stroke-linecap="round" opacity=".9"/>
        <path d="M49 87 Q80 96 111 87" fill="none" stroke="#D85A70" stroke-width="5" stroke-linecap="round" opacity=".9"/>
        <path d="M52 107 Q80 116 108 107" fill="none" stroke="#D85A70" stroke-width="5" stroke-linecap="round" opacity=".9"/>
        <g class="eyes">
          <ellipse cx="68" cy="55" rx="5" ry="6" fill="white"/>
          <ellipse cx="92" cy="55" rx="5" ry="6" fill="white"/>
          <circle cx="69" cy="56" r="2" fill="#3a1620"/>
          <circle cx="93" cy="56" r="2" fill="#3a1620"/>
        </g>
      </g>
    </svg>
  </div>

  <div class="controls" aria-label="Estados del avatar">
    <button data-state="idle">Idle</button>
    <button data-state="thinking">Thinking</button>
    <button data-state="success">Success</button>
    <button data-state="error">Error</button>
  </div>
  <div class="status">Estado: <strong id="status">idle</strong></div>
</main>

<script>
const avatar = document.querySelector('#avatar');
const status = document.querySelector('#status');
const buttons = [...document.querySelectorAll('button[data-state]')];
let resetTimer;

function setState(state){
  clearTimeout(resetTimer);
  avatar.dataset.state = state;
  status.textContent = state;
  buttons.forEach(b => b.dataset.active = String(b.dataset.state === state));
  if(state === 'success' || state === 'error'){
    resetTimer = setTimeout(() => setState('idle'), state === 'success' ? 1050 : 800);
  }
}
buttons.forEach(b => b.addEventListener('click', () => setState(b.dataset.state)));
avatar.addEventListener('click', () => setState(avatar.dataset.state === 'thinking' ? 'idle' : 'thinking'));
setState('idle');
</script>
</body>
</html>
