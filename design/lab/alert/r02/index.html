<body>
<div id="app"></div>

<script src="../../../../node_modules/vue/dist/vue.global.js"></script>

<script>
const { createApp, defineComponent, ref, reactive, computed, watch, onMounted, onBeforeUnmount, nextTick } = Vue
const svg = (n) => window.lucide(n)
const ICON = { info: 'info', success: 'circle-check', warning: 'triangle-alert', error: 'circle-alert', neutral: 'info' }
const T = { info: 'Información', success: 'Correcto', warning: 'Advertencia', error: 'Error', neutral: 'Aviso' }
const SEV = { error: 4, warning: 3, info: 2, success: 1, neutral: 0 }
const wait = (ms) => new Promise((r) => setTimeout(r, window.__fast ? 20 : ms))
const clock = () => new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' })
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`
const inMin = (s) => (s > 60 ? `Se cerrará en ${Math.ceil(s / 60)} min.` : s > 0 ? `Se cerrará en ${s} s.` : 'La sesión se cerró.')

// ============================================================================================
// A · acción que se abre: el MISMO botón pasa de «Guardar» a «Reintentar»; el mensaje sale de él
// ============================================================================================
const XaAction = defineComponent({
  name: 'XaAction',
  props: { state: String, label: String, retryLabel: String, busyText: String },
  emits: ['close'],
  setup(props) {
    const root = ref(null)
    const open = computed(() => props.state === 'error' || props.state === 'retrying' || props.state === 'success')

const XbIsland = defineComponent({
  name: 'XbIsland',
  components: { XbList },
  props: { items: Array, now: Number },
  emits: ['ack'],
  setup(props, { emit }) {
    const root = ref(null), home = ref(null)
    const expanded = ref(false), sheet = ref(false)
    const mq = matchMedia('(max-width: 519.98px)') // umbral de hoja de GDialog (space × 130, #103)
    const mobile = ref(mq.matches)
    const onMq = () => { mobile.value = mq.matches; if (mobile.value) expanded.value = false; else sheet.value = false }
    const acked = reactive(new Set())
    const top = computed(() => props.items[0] || null)
    const dot = computed(() => !expanded.value && props.items.length > 0 && props.items.every((i) => acked.has(i.key)))
    const mode = computed(() => (expanded.value ? 'expanded' : dot.value ? 'dot' : 'compact'))
    const isOpen = computed(() => expanded.value || sheet.value)
    const name = computed(() => (props.items.length === 1 ? 'Estado: 1 aviso.' : `Estado: ${props.items.length} avisos.`))
    const left = (i) => (i.deadline ? Math.max(0, Math.ceil((i.deadline - props.now) / 1000)) : null)
    const summary = () => root.value && root.value.querySelector('.xb-island__summary')
    // Cambio de tamaño con continuidad (medir antes y después; curva y duración del tema)
    let before = null
    const snap = () => { before = root.value && !root.value.hidden ? root.value.getBoundingClientRect() : null }
    async function morph() {
      const el = root.value
      await nextTick()
      if (!el || !before || el.hidden || Base.reduced()) return
      const after = el.getBoundingClientRect()
      if (Math.abs(after.width - before.width) < 1 && Math.abs(after.height - before.height) < 1) return
      const t = Base.token('--g-duration-slow', '--g-ease-spring')
      const k = [{ width: before.width + 'px', height: before.height + 'px' }, { width: after.width + 'px', height: after.height + 'px' }]
      try { el.animate(k, { duration: t.ms * 1.6 * Base.slow(), easing: t.easing }) } catch { el.animate(k, { duration: t.ms * 1.6, easing: 'ease-out' }) }
    }
    watch(mode, snap, { flush: 'pre' })
    watch(mode, () => { morph() }, { flush: 'post' })
    // ¿Abrirse taparía lo que la persona está usando? (WCAG 2.4.11): entonces no se abre sola
    function wouldCover() {
      const a = Base.actor(), el = root.value
      if (!a || !el || el.contains(a)) return false
      const r = a.getBoundingClientRect(), i = el.getBoundingClientRect()
      const w = Math.min(416, innerWidth - 16), x0 = (innerWidth - w) / 2
      const h = Math.min(innerHeight - i.top, 56 + props.items.length * 104 + 56)
      return r.right > x0 && r.left < x0 + w && r.top < i.top + h && r.bottom > i.top
    }
    // Llega algo nuevo: lo grave abre la isla (sin tomar el foco, sin tapar lo que se usa, nunca en móvil); lo demás la despierta
    const nudge = ref(false)
    watch(() => props.items.map((i) => i.key).join('|'), (v, old) => {
      const prev = new Set((old || '').split('|'))
      const fresh = props.items.filter((i) => !prev.has(i.key))
      for (const k of [...acked]) if (!props.items.some((i) => i.key === k)) acked.delete(k)
      // Se vacía con el foco dentro: el foco vuelve a donde estaba antes del atajo, o al siguiente control
      if (!props.items.length && root.value && root.value.contains(document.activeElement)) {
        expanded.value = false
        const t = saved && saved.isConnected ? saved : Base.neighbour(root.value)
        if (t) t.focus({ preventScroll: true })
      }
      if (!props.items.length) { expanded.value = false; sheet.value = false }
      if (!fresh.length) return
      snap()
      if (fresh.some((i) => i.type === 'error') && !mobile.value && !wouldCover()) expanded.value = true
      else if (!expanded.value) { nudge.value = false; requestAnimationFrame(() => { nudge.value = true }) }
      morph()
    })
    function toggle() { if (mobile.value) sheet.value = !sheet.value; else expanded.value = !expanded.value }
    function ack() {
      const results = props.items.filter((i) => i.result).map((i) => i.id)
      props.items.forEach((i) => acked.add(i.key))
      expanded.value = false; sheet.value = false
      const s = summary(); if (s) s.focus({ preventScroll: true })
      if (results.length) emit('ack', results)
    }
    /** Descartar un aviso: el foco pasa al resumen de la isla (o, si era el último, sale de ella). */
    async function dismiss(i) {
      i.dismiss()
      await nextTick()
      const ae = document.activeElement
      if (props.items.length && (!ae || ae === document.body || !ae.isConnected)) { const t = (sheet.value && document.querySelector('#island-sheet button')) || summary(); if (t) t.focus({ preventScroll: true }) }
    }
    /** Abre la isla en un aviso y lleva el foco a su primera acción (lo llama la marca de origen). */
    async function openAt(id) {
      saved = document.activeElement
      if (mobile.value) sheet.value = true; else expanded.value = true
      await nextTick(); await nextTick()
      const li = document.getElementById('island-' + id)
      const t = li && (li.querySelector('.xb-ghost:not([aria-disabled])') || li.querySelector('button,a'))
      if (t) t.focus({ preventScroll: true }); else { const s = summary(); if (s) s.focus({ preventScroll: true }) }
    }
    /** «Ir a…»: repliega la isla y enfoca el origen del aviso. */
    async function goOrigin(i) {
      expanded.value = false; sheet.value = false
      await nextTick(); await new Promise((r) => setTimeout(r, sheetWas() ? 350 : 0))
      const el = document.querySelector(i.origin.target)
      if (!el) return
      if (!el.matches('a,button,input,[tabindex]')) { el.tabIndex = -1; el.addEventListener('blur', () => el.removeAttribute('tabindex'), { once: true }) }
      el.focus()
    }
    let hadSheet = false
    watch(sheet, (v) => { if (v) hadSheet = true })
    const sheetWas = () => { const h = hadSheet; hadSheet = false; return h }
    // Atajo Alt+F8: ida (resumen de la isla, abierta) y vuelta al elemento guardado. Sin avisos no se intercepta.
    let saved = null
    function onDocKey(e) {
      if (e.key !== 'F8' || !e.altKey || e.shiftKey || e.ctrlKey || e.metaKey || !props.items.length) return
      e.preventDefault()
      const el = root.value
      if (el.contains(document.activeElement)) { expanded.value = false; if (saved && saved.isConnected) saved.focus({ preventScroll: true }); return }
      saved = document.activeElement
      if (!mobile.value) expanded.value = true
      summary().focus({ preventScroll: true })
    }
    function onKey(e) {
      if (e.key === 'Escape' && expanded.value) { e.preventDefault(); e.stopPropagation(); expanded.value = false; summary().focus({ preventScroll: true }) }
    }
    const outside = (e) => { if (expanded.value && root.value && !root.value.contains(e.target) && !e.target.closest('.xb-mark')) expanded.value = false }
    // Dentro de un diálogo modal lo de fuera es inerte: la isla se traslada al modal superior (como GToaster, #141),
    // salvo a su propia hoja móvil
    let mo = null
    const place = () => {
      const el = root.value; if (!el) return
      const ds = [...document.querySelectorAll('dialog[open]')].filter((d) => !d.classList.contains('xb-sheet'))
      const to = ds[ds.length - 1] || home.value
      if (el.parentElement !== to) to.append(el)
    }
    // Reserva del borde superior: su alto replegado + margen (en Grana: edgeReserve.js; aquí, offset de GToaster)
    let ro = null
    const reserve = () => { const el = root.value; const s = summary(); const px = el && s && !el.hidden ? Math.round(s.getBoundingClientRect().height + 16) : 0; if (window.toaster) window.toaster.configure({ offset: { top: px } }) }
    onMounted(() => {
      islandApi.openAt = openAt
      document.addEventListener('pointerdown', outside, true)
      document.addEventListener('keydown', onDocKey)
      mq.addEventListener('change', onMq)
      mo = new MutationObserver(place); mo.observe(document.documentElement, { subtree: true, attributes: true, attributeFilter: ['open'] })
      ro = new ResizeObserver(reserve); ro.observe(root.value)
    })
    onBeforeUnmount(() => {
      islandApi.openAt = null
      document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', onDocKey); mq.removeEventListener('change', onMq)
      mo && mo.disconnect(); ro && ro.disconnect(); if (window.toaster) window.toaster.configure({ offset: { top: 0 } })
      if (root.value && home.value) home.value.append(root.value)
    })
    return { root, home, expanded, sheet, mobile, isOpen, mode, top, name, left, nudge, toggle, ack, onKey, goOrigin, dismiss, svg, ICON, T, mmss }
  },
  template: `
  <div ref="home" class="xb-home">
    <section ref="root" class="xb-island" :class="['is-' + mode, { 'is-nudge': nudge }]" aria-label="Estado de la aplicación" :hidden="items.length ? undefined : true" @keydown="onKey" @animationend="nudge = false">
      <button v-if="top" type="button" id="island" class="xb-island__summary" :aria-expanded="isOpen ? 'true' : 'false'" :aria-controls="mobile ? undefined : 'island-panel'" :aria-haspopup="mobile ? 'dialog' : undefined" aria-keyshortcuts="Alt+F8" @click="toggle">
        <span class="xb-badge" :class="{ 'is-busy': top.action && top.action.busy }" :data-type="top.type" aria-hidden="true" :key="top.type + (top.action && top.action.busy)" v-html="svg(top.action && top.action.busy ? 'loader-circle' : top.icon || ICON[top.type])"></span>
        <span class="sr">{{ name }} </span>
        <span class="xb-island__text"><span class="sr">{{ T[top.type] }}: </span>{{ top.title }}</span>
        <span v-if="left(top) !== null" class="xb-island__timer" role="timer" aria-live="off">{{ mmss(left(top)) }}</span>
        <span v-if="items.length > 1" class="xb-island__count"><span aria-hidden="true">+{{ items.length - 1 }}</span><span class="sr">y {{ items.length - 1 }} más</span></span>
      </button>
      <div v-if="!mobile" id="island-panel" class="xb-island__panel" :hidden="expanded ? undefined : true">
        <xb-list :items="items" :now="now" @origin="goOrigin" @dismiss="dismiss"></xb-list>
        <div class="xb-island__foot"><button type="button" class="xb-ghost" id="island-ack" @click="ack">Entendido</button></div>
      </div>
    </section>
    <!-- Móvil: abierta es una hoja inferior modal (GDialog real). Solo la abre la persona. -->
    <g-dialog v-if="mobile" v-model="sheet" id="island-sheet" class="xb-sheet" title="Estado de la aplicación" close-label="Cerrar">
      <xb-list :items="items" :now="now" @origin="goOrigin" @dismiss="dismiss"></xb-list>
      <template #footer><g-btn id="island-ack" variant="outline" color="neutral" @click="ack">Entendido</g-btn></template>
    </g-dialog>
  </div>`
})

const formLabels = { optional: '(opcional)', error: 'Error: ', warning: 'Advertencia: ', valid: 'Correcto: ' }
const tbColumns = [{ key: 'folio', label: 'Folio' }, { key: 'cliente', label: 'Cliente' }, { key: 'total', label: 'Total', align: 'end' }]
const tbLabels = { loading: 'Cargando facturas…', empty: 'Sin facturas que mostrar.', results: '{count} resultados' }
const ROWS = [{ id: 1, folio: 'F-0040', cliente: 'Clínica Norte', total: '$1,200' }, { id: 2, folio: 'F-0041', cliente: 'Laboratorio Sur', total: '$860' }]
const cardLabels = { retry: 'Reintentar' }

const Scene = defineComponent({
  name: 'Scene',
  components: { XaAction, XbIsland, XbMark, XcNote },
  props: { c: String },
  setup(props) {
    const S = reactive({
      save: 'idle', saveFails: true, sentAt: '', retriedAt: '',
      table: 'error', tableFails: false,
      offline: false, online: false, session: false, maint: true, deadline: 0,
      cardWarn: true, dlg: false, f: { nombre: 'Clínica Norte', rfc: 'CNO010203AB1' }
    })

    const now = ref(Date.now())
    const iv = setInterval(() => { now.value = Date.now() }, 1000)

    const left = computed(() => Math.max(0, Math.ceil((S.deadline - now.value) / 1000)))
    /** Si el control con foco desapareció, el foco va al sitio indicado: nunca al body. */
    async function keepFocus(sel) {
      await nextTick(); await nextTick()
      const ae = document.activeElement
      if (ae && ae !== document.body && ae.isConnected && ae.getClientRects().length) return

    }
    // ---- 1 y 4. Guardar: error de servidor → reintentar → éxito que se queda ----
    async function send() {
      const retry = S.save === 'error'
      const focused = document.activeElement && document.activeElement !== document.body
      if (retry) S.retriedAt = clock(); else S.sentAt = clock()
      S.save = retry ? 'retrying' : 'busy'
      await wait(700)
      S.save = S.saveFails ? 'error' : 'success'
      if (S.save === 'error') Base.tell('error', 'Error: No se pudo guardar la factura. El servidor no respondió; tus datos siguen en el formulario.')
      else Base.tell('success', 'Correcto: Factura guardada con el folio F-0042.')
      if (focused) keepFocus(props.c === 'B' ? (document.getElementById('island-panel') && !document.getElementById('island-panel').hidden ? '#island' : '#save') : props.c === 'C' ? '#save-note' : '#save')
    }
    function closeSave() { S.save = 'idle'; keepFocus('#save') }
    const saveSteps = computed(() => {
      const st = []
      if (S.save === 'idle' || S.save === 'busy') return st
      st.push({ state: 'done', time: S.sentAt, label: 'Enviada al servidor' })
      st.push({ state: 'failed', label: 'El servidor no respondió' })
      if (S.save === 'retrying') st.push({ state: 'current', time: S.retriedAt, label: 'Reintentando…' })
      if (S.save === 'success') st.push({ state: 'ok', time: S.retriedAt || S.sentAt, label: 'Guardada con el folio', link: { href: '#f-0042', label: 'F-0042' } })
      if (S.save === 'success' && !S.retriedAt) st.splice(1, 1)
      return st
    })
    // ---- 2. Tabla ----
    async function load() {
      S.table = 'retrying'
      await wait(700)
      S.table = S.tableFails ? 'error' : 'ok'
      if (S.table === 'error') Base.tell('error', 'Error: No se pudieron cargar las facturas.')
      else Base.tell('success', 'Facturas cargadas: 2 resultados.')
      keepFocus(props.c === 'B' ? '#island' : '#tb-region')
    }
    function breakTable() { S.table = 'error'; Base.tell('error', 'Error: No se pudieron cargar las facturas.') }
    // ---- 3. Página ----
    function toggle(k) {
      if (k === 'session') { if (!S.session) S.deadline = Date.now() + 305000; S.session = !S.session; if (S.session) Base.tell('warning', 'Advertencia: Tu sesión está por caducar. Se cerrará en 5 min.') }
      if (k === 'offline') { S.offline = !S.offline; S.online = false; if (S.offline) Base.tell('warning', 'Advertencia: Sin conexión. Los cambios se guardarán al volver.') }
      if (k === 'online') { S.online = true; Base.tell('success', 'Correcto: Conexión restablecida.') }
      if (k === 'maint') { S.maint = !S.maint; if (S.maint) Base.tell('info', 'Información: Mantenimiento programado el sábado de 02:00 a 04:00.') }
    }
    function extend() { S.session = false; keepFocus(props.c === 'B' ? '#island' : '#f-nombre') }
    function dismissOnline() { S.offline = false; S.online = false; keepFocus(props.c === 'B' ? '#island' : '#f-nombre') }
    // Condiciones de página, por gravedad
    const page = computed(() => {
      const l = []

      if (S.offline && S.online) l.push({ id: 'offline', type: 'success', title: 'Conexión restablecida', text: 'Los cambios pendientes ya se guardaron.', result: true, close: dismissOnline })
      if (S.session) l.push({ id: 'session', type: 'warning', title: 'Tu sesión está por caducar', text: '', deadline: S.deadline, action: { label: 'Seguir conectado', run: extend } })
      if (S.maint) l.push({ id: 'maint', type: 'info', title: 'Mantenimiento programado', text: 'El sábado de 02:00 a 04:00 no se podrá facturar.', dismiss: () => { S.maint = false } })
      return l.sort((a, b) => SEV[b.type] - SEV[a.type])
    })
    // B: todo lo que pasa, en la isla
    const island = computed(() => {
      const l = [...page.value]
      if (S.save === 'error' || S.save === 'retrying') l.push({ id: 'save', type: 'error', title: 'No se pudo guardar la factura', text: 'El servidor no respondió; tus datos siguen en el formulario.', origin: { target: '#save', label: 'Ir al formulario' }, action: { label: 'Reintentar', busyLabel: 'Reintentando…', busy: S.save === 'retrying', run: send } })
      if (S.save === 'success') l.push({ id: 'save', type: 'success', title: 'Factura guardada', text: 'Folio', link: { href: '#f-0042', label: 'F-0042' }, result: true })
      if (S.table === 'error' || S.table === 'retrying') l.push({ id: 'table', type: 'error', title: 'No se pudieron cargar las facturas', text: '', origin: { target: '#tb-region', label: 'Ir a Facturas' }, action: { label: 'Reintentar', busyLabel: 'Cargando…', busy: S.table === 'retrying', run: load } })
      return l.sort((a, b) => SEV[b.type] - SEV[a.type]).map((i) => ({ ...i, key: i.id + ':' + i.type }))
    })
    function onAck(ids) { if (ids.includes('save')) S.save = 'idle'; if (ids.includes('offline')) { S.offline = false; S.online = false } }
    const toast = () => window.toaster.success('Copia enviada')
    const tableFailed = computed(() => S.table === 'error' || S.table === 'retrying')
    const saveType = computed(() => (S.save === 'success' ? 'success' : 'error'))
    const saveOpen = computed(() => S.save === 'error' || S.save === 'retrying' || S.save === 'success')
    return { S, now, left, send, closeSave, saveSteps, load, breakTable, toggle, extend, dismissOnline, page, island, onAck, tableFailed, saveType, saveOpen,
      svg, ICON, T, inMin, formLabels, tbColumns, tbLabels, ROWS, cardLabels, toast }
  },
  template: `
  <!-- ============ Página · B: isla en el shell (primer contenido tras la barra) ============ -->
  <xb-island v-if="c === 'B'" :items="island" :now="now" @ack="onAck"></xb-island>

  <!-- ============ Página · A: la condición se funde con el borde de la barra ============ -->
  <div v-if="c === 'A'" id="page-notes">
    <x-edge v-for="n in page.slice(0, 2)" :key="n.id" :n="n" :left="left"></x-edge>
  </div>

  <!-- ============ Página · C: regla en el borde del visor + nota como primera línea ============ -->
  <template v-if="c === 'C'">
    <div v-if="page.length" class="xc-pagerule" :data-type="page[0].type" aria-hidden="true"></div>
    <div class="xc-page" id="page-notes">
      <xc-note v-for="n in page.slice(0, 2)" :key="n.id" :id="'page-' + n.id" open :type="n.type" :title="n.title">
        {{ n.text }} <template v-if="n.deadline">{{ inMin(left) }}</template>
        <template v-if="n.action || n.close" #actions>
          <g-btn v-if="n.action" :id="'page-' + n.id + '-action'" size="sm" variant="outline" color="neutral" @click="n.action.run">{{ n.action.label }}</g-btn>
          <g-btn v-if="n.close" :id="'page-' + n.id + '-close'" size="sm" variant="ghost" color="neutral" @click="n.close">Cerrar</g-btn>
        </template>
      </xc-note>
    </div>
  </template>

  <main>
    <h1>{{ c === 'A' ? 'A · Nace de su causa' : c === 'B' ? 'B · Isla de estado' : 'C · Nota al margen' }}</h1>
    <p class="lead" v-if="c === 'A'">El mensaje no es un bloque aparte: sale del control que lo provocó y ocupa el sitio de lo que falló. «Guardar» se abre, se convierte en «Reintentar» y vuelve a ser «Guardar».</p>
    <p class="lead" v-if="c === 'B'"><strong>Concepto elegido por el usuario.</strong> Todo lo que pasa y dura vive en una sola isla del shell: no ocupa sitio en el contenido, se abre sola cuando algo es grave (sin tomar el foco) y se repliega a un punto cuando lo reconoces, sin desaparecer mientras dure. En el origen queda una marca que lleva a ella. Alt+F8 va y vuelve.</p>
    <p class="lead" v-if="c === 'C'">Sin caja: una regla en el margen de la región afectada y texto. El mensaje cuenta la secuencia (qué pasó, qué se está haciendo, cómo acabó) y avanza en el mismo sitio.</p>

    <div class="cards">
      <!-- ============ 1 y 4. Guardar ============ -->
      <section class="card" id="form-card">
        <h2>Nueva factura</h2>
        <div :class="c === 'C' ? ['xc-region', { 'has-note': saveOpen }] : undefined" :data-type="c === 'C' ? saveType : undefined" style="--_origin:100%">
          <g-form id="form" :errors="{}" :labels="formLabels" @submit="send">
            <g-form-layout>
              <g-input id="f-nombre" label="Cliente" name="nombre" v-model="S.f.nombre"></g-input>
              <g-input id="f-rfc" label="RFC" name="rfc" v-model="S.f.rfc"></g-input>
            </g-form-layout>
            <xc-note v-if="c === 'C'" id="save-note" :open="saveOpen" :type="saveType" :title="S.save === 'success' ? 'Factura guardada' : 'No se pudo guardar la factura'" :steps="saveSteps">
              <template v-if="S.save !== 'success'">Tus datos siguen en el formulario.</template>
              <template #actions>
                <g-btn v-if="S.save !== 'success'" id="retry" size="sm" variant="outline" color="neutral" :loading="S.save === 'retrying'" loading-text="Reintentando…" @click="send">Reintentar</g-btn>
                <g-btn v-else id="save-close" size="sm" variant="ghost" color="neutral" @click="closeSave">Cerrar</g-btn>
              </template>
            </xc-note>
            <!-- A: la fila de acciones ES el aviso (hoy fuera de GFormActions: integrarlo es trabajo de lima, ver declaración) -->
            <xa-action v-if="c === 'A'" :state="S.save" label="Guardar" retry-label="Reintentar" busy-text="Guardando…" @close="closeSave">
              <template #error><strong>No se pudo guardar.</strong> El servidor no respondió; tus datos siguen aquí.</template>
              <template #success><strong>Factura guardada.</strong> Folio <a id="save-link" href="#f-0042">F-0042</a>.</template>
            </xa-action>
            <g-form-actions v-else>
              <xb-mark v-if="c === 'B' && (S.save === 'error' || S.save === 'retrying')" id="save-mark" type="error" for="save" :busy="S.save === 'retrying'">No se guardó</xb-mark>
              <xb-mark v-if="c === 'B' && S.save === 'success'" id="save-mark" type="success" for="save">Guardada</xb-mark>
              <g-btn id="save" type="submit" :loading="S.save === 'busy'" loading-text="Guardando…">Guardar</g-btn>
            </g-form-actions>
          </g-form>
        </div>
      </section>

      <!-- ============ 2. Cargar una tabla ============ -->
      <section class="card" id="table-card">
        <h2>Facturas</h2>
        <div id="tb-region" :data-type="tableFailed ? 'error' : undefined"
          :class="c === 'A' ? ['xa-region', { 'is-failed': tableFailed }] : c === 'C' ? ['xc-region', { 'has-note': tableFailed }] : undefined">
          <xc-note v-if="c === 'C'" id="tb-note" :open="tableFailed" type="error" title="No se pudieron cargar las facturas" :steps="S.table === 'retrying' ? [{ state: 'failed', label: 'El servidor no respondió' }, { state: 'current', label: 'Cargando de nuevo…' }] : [{ state: 'failed', label: 'El servidor no respondió' }]">
            <template #actions><g-btn id="tb-retry" size="sm" variant="outline" color="neutral" :loading="S.table === 'retrying'" loading-text="Cargando…" @click="load">Reintentar</g-btn></template>
          </xc-note>
          <g-table id="tb" :columns="tbColumns" :rows="S.table === 'ok' ? ROWS : []" row-key="id" caption="Facturas emitidas" :labels="tbLabels">
            <template v-if="c === 'B' && tableFailed" #empty>
              <div class="xb-empty"><xb-mark id="tb-mark" type="error" for="table" :busy="S.table === 'retrying'">No se pudieron cargar</xb-mark></div>
            </template>
            <template v-else-if="c === 'A' && tableFailed" #empty>
              <div class="xa-cause" data-type="error" role="group" aria-labelledby="tb-cause">
                <span class="xa-cause__icon" aria-hidden="true" v-html="svg('circle-alert')"></span>
                <p id="tb-cause"><span class="sr">Error: </span><strong>No se pudieron cargar las facturas</strong><span>El servidor no respondió. Lo demás de la página sigue funcionando.</span></p>
                <g-btn id="tb-retry" size="sm" variant="outline" color="neutral" :loading="S.table === 'retrying'" loading-text="Cargando…" @click="load"><template #prepend><span v-html="svg('refresh-cw')"></span></template>Reintentar</g-btn>
              </div>
            </template>
          </g-table>
        </div>
        <p><g-btn id="tb-after" size="sm" variant="ghost" color="neutral">Exportar</g-btn></p>
      </section>

      <!-- ============ 5. Advertencia en una sección y en un diálogo ============ -->
      <section class="card" id="section-card">
        <h2>Cuenta</h2>
        <div id="card-region" data-type="warning" :class="c === 'C' ? ['xc-region', { 'has-note': S.cardWarn }] : undefined">
          <xc-note v-if="c === 'C'" id="card-note" :open="S.cardWarn" type="warning" title="Tu tarjeta caduca este mes">
            Actualízala para no interrumpir la facturación.
            <template #actions><g-btn size="sm" variant="outline" color="neutral">Actualizar tarjeta</g-btn></template>
          </xc-note>
          <g-card id="card" title="Facturación" description="Plan Equipo · renovación el 1 de noviembre" :status="c === 'A' && S.cardWarn ? 'warning' : undefined" status-text="Tu tarjeta caduca este mes." :labels="cardLabels">
            <xb-mark v-if="c === 'B' && S.cardWarn" id="card-mark" type="warning">Tu tarjeta caduca este mes.<template #action><g-btn size="sm" variant="ghost" color="neutral">Actualizar tarjeta</g-btn></template></xb-mark>
          </g-card>
        </div>
        <p><g-btn id="d-open" variant="outline" color="neutral" @click="S.dlg = true">Editar cliente…</g-btn></p>
      </section>
    </div>

    <g-dialog v-model="S.dlg" id="dialog" title="Editar cliente" close-label="Cerrar">
      <template v-if="c === 'A'" #description><span class="xa-inline" data-type="warning" id="d-warn"><span aria-hidden="true" v-html="svg('triangle-alert')"></span><span><span class="sr">Advertencia: </span>Este cliente tiene 2 facturas abiertas.</span></span></template>
      <div :class="c === 'C' ? 'xc-region has-note' : undefined" data-type="warning">
        <xc-note v-if="c === 'C'" id="d-warn" open type="warning" title="Este cliente tiene 2 facturas abiertas">Los cambios de nombre no se aplican a las ya emitidas.</xc-note>
        <xb-mark v-if="c === 'B'" id="d-warn" type="warning">Este cliente tiene 2 facturas abiertas.</xb-mark>
        <g-input id="d-nombre" label="Nombre" v-model="S.f.nombre"></g-input>
      </div>
      <template #footer><g-btn id="d-save" @click="S.dlg = false">Guardar</g-btn></template>
    </g-dialog>

    <!-- ============ Simulador (no es parte de la propuesta) ============ -->
    <div class="sim" role="group" aria-label="Simulador">
      <strong>Simulador</strong>
      <label><input type="checkbox" id="sim-save-fails" v-model="S.saveFails"> Guardar falla</label>
      <label><input type="checkbox" id="sim-table-fails" v-model="S.tableFails"> Cargar falla</label>
      <g-btn id="sim-break" size="sm" variant="outline" color="neutral" @click="breakTable">Romper la tabla</g-btn>
      <g-btn id="sim-offline" size="sm" variant="outline" color="neutral" :aria-pressed="S.offline ? 'true' : 'false'" @click="toggle('offline')">Sin conexión</g-btn>
      <g-btn id="sim-online" size="sm" variant="outline" color="neutral" :disabled="!S.offline || S.online" @click="toggle('online')">Vuelve la conexión</g-btn>
      <g-btn id="sim-session" size="sm" variant="outline" color="neutral" :aria-pressed="S.session ? 'true' : 'false'" @click="toggle('session')">Sesión por caducar</g-btn>
      <g-btn id="sim-maint" size="sm" variant="outline" color="neutral" :aria-pressed="S.maint ? 'true' : 'false'" @click="toggle('maint')">Mantenimiento</g-btn>
      <g-btn id="sim-toast" size="sm" variant="outline" color="neutral" @click="toast">Aviso flotante (GToaster)</g-btn>
    </div>
  </main>`
})

// A · franja pegada a la barra (condición de página)
const XEdge = defineComponent({
  name: 'XEdge',
  props: { n: Object, left: Number },
  setup() { return { svg, ICON, T, inMin, enter: Base.sizeIn, leave: Base.sizeOut } },
  template: `
  <Transition :css="false" appear @enter="enter" @leave="leave">
    <div class="xa-edge" :data-type="n.type" :id="'page-' + n.id" role="group" :aria-labelledby="'page-' + n.id + '-t'">
      <div class="xa-edge__in">
        <span aria-hidden="true" :key="n.type" v-html="svg(n.icon || ICON[n.type])"></span>
        <p :id="'page-' + n.id + '-t'"><span class="sr">{{ T[n.type] }}: </span><strong>{{ n.title }}.</strong> {{ n.text }} <template v-if="n.deadline">{{ inMin(left) }}</template></p>
        <g-btn v-if="n.action" :id="'page-' + n.id + '-action'" size="sm" variant="outline" color="neutral" @click="n.action.run">{{ n.action.label }}</g-btn>
        <g-btn v-if="n.close" :id="'page-' + n.id + '-close'" icon size="sm" variant="ghost" color="neutral" aria-label="Cerrar aviso" @click="n.close"><span v-html="svg('x')"></span></g-btn>
      </div>
    </div>
  </Transition>`
})

const toaster = Grana.createToaster({ position: 'top-center', labels: { region: 'Notificaciones ({hotkey})', close: 'Cerrar notificación', types: { info: 'Información', success: 'Correcto', warning: 'Advertencia', error: 'Error', loading: 'En curso' }, repeated: '{count} veces', queued: '{count} más en espera', actionHint: 'Pulsa {hotkey} para {action}.' } })
window.toaster = toaster
const app = createApp({
  components: { Scene },
  setup() {
    const q = new URLSearchParams(location.search)
    const c = ref(['A', 'B', 'C'].includes(q.get('c')) ? q.get('c') : 'A')
    const rtl = ref(q.get('dir') === 'rtl')
    const slow = ref(false)
    watch(slow, (v) => { window.__slow = v })
    watch(c, (v) => { history.replaceState(null, '', '?c=' + v + (rtl.value ? '&dir=rtl' : '')); window.__live.length = 0 })
    watch(rtl, (v) => { document.documentElement.dir = v ? 'rtl' : 'ltr' }, { immediate: true })
    window.__c = c
    return { c, rtl, slow }
  },
  template: `
  <header class="sh-bar">
    <span class="sh-brand">Facturas</span>
    <fieldset class="sh-pick">
      <legend class="sr">Concepto</legend>
      <label v-for="k in ['A', 'B', 'C']" :key="k"><input type="radio" name="concept" :id="'pick-' + k" :value="k" v-model="c"><span><span class="sr">Concepto </span>{{ k }}</span></label>
      <label><input type="checkbox" id="pick-rtl" v-model="rtl"><span>RTL</span></label>
      <label><input type="checkbox" id="pick-slow" v-model="slow"><span>×5</span></label>
    </fieldset>
  </header>
  <scene :key="c" :c="c"></scene>
  <g-toaster></g-toaster>`
})
app.component('XEdge', XEdge)
app.use(Grana)
app.use(toaster)
app.mount('#app')
</script>
</body>
</html>
