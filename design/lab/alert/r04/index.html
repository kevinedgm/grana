<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla de estado · r04 · tres propuestas sobre D</title>
<link rel="stylesheet" href="../../../../packages/vue/dist/fonts.css">
<link rel="stylesheet" href="../../../../packages/vue/dist/grana.css">
<style>
/* r04 (kiwi): tres propuestas de forma y comportamiento sobre la base D de r03 (transitoria, cae del borde, sin punto,
   lo pendiente en su marca y en Alt+F8). Tokens REALES del tema por defecto, claro y oscuro (?theme=dark).
   Clases x*/isle*/card* de prototipo; el CSS definitivo es de coco.
   D1 · Cápsula de relevo   D2 · Tarjetas en mazo   D3 · Repisa del encabezado */
*{box-sizing:border-box}
html{color-scheme:light}
html[data-theme=dark]{color-scheme:dark}
body{margin:0;font-family:var(--g-font-ui);font-size:var(--g-text-body-size);line-height:var(--g-text-body-line);color:var(--g-color-text);background:var(--g-color-bg)}
.sr{position:absolute;inline-size:1px;block-size:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.g-icon{inline-size:1em;block-size:1em;flex:none}

/* ---------- Shell: cabecera en zona de marca (el fondo más difícil para una isla oscura) ---------- */
.sh-bar{position:sticky;inset-block-start:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--g-space-2);
  min-block-size:var(--g-space-16);padding:var(--g-space-2) var(--g-space-4);background:var(--g-color-bg);color:var(--g-color-text)}
.sh-brand{font-weight:650}
.sh-pick{display:flex;flex-wrap:wrap;gap:var(--g-space-1)}
.sh-pick a{display:inline-flex;align-items:center;min-block-size:var(--g-space-8);padding-inline:var(--g-space-3);border:var(--g-border-width) solid var(--g-color-border-control);border-radius:var(--g-radius-md);color:inherit;text-decoration:none;font-size:var(--g-text-body-sm-size)}
.sh-pick a[aria-current]{background:var(--g-color-text);color:var(--g-color-bg);border-color:var(--g-color-text)}
.sh-pick a:focus-visible,.btn:focus-visible,.x-field input:focus-visible{outline:var(--g-focus-width) solid var(--g-color-focus);outline-offset:var(--g-focus-offset)}
main{max-inline-size:56rem;margin:0 auto;padding:var(--g-space-6) var(--g-space-4) var(--g-space-16)}
h1{font-size:var(--g-text-title-lg-size);line-height:var(--g-text-title-lg-line);margin:0 0 var(--g-space-1)}
.lead{color:var(--g-color-text-muted);margin:0 0 var(--g-space-6);max-inline-size:70ch}
.card-p{padding:var(--g-space-6);background:var(--g-color-surface);border:var(--g-border-width) solid var(--g-color-border);border-radius:var(--g-radius-lg);margin-block-end:var(--g-space-6);min-inline-size:0}
.card-p h2{font-size:var(--g-text-title-sm-size);line-height:var(--g-text-title-sm-line);margin:0 0 var(--g-space-4)}
.x-field{display:grid;gap:var(--g-space-1);max-inline-size:28rem}
.x-field input{font:inherit;min-block-size:calc(var(--g-space-1) * 10);padding-inline:var(--g-space-3);border:var(--g-border-width) solid var(--g-color-border-control);border-radius:var(--g-radius-md);background:var(--g-color-surface);color:inherit}
.x-actions{display:flex;justify-content:flex-end;align-items:center;gap:var(--g-space-2);margin-block-start:var(--g-space-4);min-block-size:calc(var(--g-space-1) * 10)}
.btn{font:inherit;font-weight:var(--g-text-action-weight);display:inline-flex;align-items:center;justify-content:center;gap:var(--g-space-2);min-block-size:calc(var(--g-space-1) * 10);padding-inline:var(--g-space-4);
  border:var(--g-border-width) solid var(--g-color-border-control);border-radius:var(--g-radius-md);background:var(--g-color-surface);color:var(--g-color-text);cursor:pointer}
.btn--solid{background:var(--g-color-brand);border-color:var(--g-color-brand);color:var(--g-color-on-brand)}
.btn--sm{min-block-size:var(--g-space-8);padding-inline:var(--g-space-3);font-size:var(--g-text-body-sm-size)}
.x-table{inline-size:100%;border-collapse:collapse}
.x-table th,.x-table td{padding:var(--g-space-2) var(--g-space-3);text-align:start;border-block-end:var(--g-border-width) solid var(--g-color-border)}
.x-table th{font-size:var(--g-text-body-sm-size);color:var(--g-color-text-muted)}
.sim{display:flex;flex-wrap:wrap;gap:var(--g-space-2);align-items:center;padding:var(--g-space-4);border:var(--g-border-width) dashed var(--g-color-border-strong);border-radius:var(--g-radius-lg);font-size:var(--g-text-body-sm-size)}
.sim strong{flex:1 0 100%}
.sim label{display:inline-flex;gap:var(--g-space-1);align-items:center;min-block-size:24px}
.note{color:var(--g-color-text-muted);font-size:var(--g-text-body-sm-size);margin:var(--g-space-3) 0 0}

[data-type=error]{--_c:var(--g-color-danger);--_on:var(--g-color-on-danger);--_rule:solid}
[data-type=warning]{--_c:var(--g-color-warning);--_on:var(--g-color-on-warning);--_rule:dashed}
[data-type=info]{--_c:var(--g-color-info);--_on:var(--g-color-on-info);--_rule:dotted}
[data-type=success]{--_c:var(--g-color-success);--_on:var(--g-color-on-success);--_rule:none}

/* ---------- Marca junto al origen: la memoria de lo pendiente (GStatusMark enlace) ---------- */
.mark{--_ink:var(--g-color-bg);font:inherit;font-size:var(--g-text-body-sm-size);display:inline-flex;align-items:center;gap:var(--g-space-1);min-block-size:var(--g-space-8);padding:0 var(--g-space-3) 0 var(--g-space-1);
  border:0;border-radius:var(--g-radius-pill);background:var(--g-color-text);color:var(--g-color-bg);cursor:pointer}
.mark[hidden]{display:none}
.mark:focus-visible{outline:var(--g-focus-width) solid var(--g-color-focus);outline-offset:var(--g-focus-offset)}
.mark .badge{--_s:calc(var(--g-space-1) * 6)}
/* Eco: cuando la isla se recoge con algo pendiente, la marca lo recibe con un anillo único */
.mark.is-echo{animation:x-echo calc(var(--g-duration-slow) * 3) var(--g-ease-out)}
@keyframes x-echo{from{box-shadow:0 0 0 0 var(--g-color-focus)}to{box-shadow:0 0 0 var(--g-space-2) transparent}}

/* ---------- Común a la isla ---------- */
.isle{--_m:var(--g-space-2);--_row:calc(var(--g-space-1) * 12);position:fixed;z-index:50;inset-inline:0;inset-block-start:calc(var(--_top, var(--g-space-16)) + var(--_m));
  display:flex;flex-direction:column;align-items:center;pointer-events:none}
.badge{--_s:calc(var(--g-space-1) * 8);position:relative;display:inline-grid;place-items:center;flex:none;inline-size:var(--_s);block-size:var(--_s);border-radius:50%;
  background:var(--_c);color:var(--_on);outline:var(--g-border-width) var(--_rule) var(--_ink);outline-offset:var(--g-border-width);font-size:calc(var(--_s) * 0.55)}
.badge.is-busy .g-icon{animation:x-spin var(--g-duration-spin) linear infinite}
@keyframes x-spin{to{rotate:1turn}}
.ibtn{font:inherit;font-size:var(--g-text-body-sm-size);font-weight:var(--g-text-action-weight);display:inline-flex;align-items:center;justify-content:center;gap:var(--g-space-1);min-block-size:var(--g-space-8);min-inline-size:var(--g-space-8);padding-inline:var(--g-space-3);
  border:var(--g-border-width) solid var(--_ink);border-radius:var(--g-radius-pill);background:transparent;color:var(--_ink);cursor:pointer;white-space:nowrap}
.ibtn--quiet{border-color:transparent;text-decoration:underline;text-underline-offset:0.2em}
.ibtn--icon{padding-inline:0;border-color:transparent}
.ibtn[aria-pressed=true]{background:var(--_ink);color:var(--_fill)}
.ibtn[aria-disabled=true]{cursor:default}
.isle :is(button,a,[tabindex]):focus-visible{outline:var(--g-focus-width) solid var(--_ink);outline-offset:calc(var(--g-focus-width) * -1 - var(--g-border-width))}
.timer{font-variant-numeric:tabular-nums;font-size:var(--g-text-body-sm-size);font-weight:var(--g-text-action-weight)}
.items{display:grid;gap:var(--g-space-2);margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--g-space-1) var(--g-space-3);padding:var(--g-space-3);border-radius:var(--g-radius-lg);background:var(--_tile)}
.item + .item{margin-block-start:0}
.item__title{margin:0;font-weight:var(--g-text-title-sm-weight)}
.item__desc{margin:0;font-size:var(--g-text-body-sm-size)}
.item__actions{grid-column:2;display:flex;flex-wrap:wrap;gap:var(--g-space-2);margin-block-start:var(--g-space-1)}
.list-head{display:flex;align-items:center;justify-content:space-between;gap:var(--g-space-2);padding:0 0 var(--g-space-1) var(--g-space-2);font-size:var(--g-text-body-sm-size);font-weight:var(--g-text-action-weight)}
@media (pointer:coarse){.ibtn,.mark{min-block-size:44px;min-inline-size:44px}}

/* Superficie inversa (D1, D2) con «doble filo»: el anillo exterior del color de la página separa la isla de una zona
   oscura (la zona de marca del tema por defecto es casi del mismo color que la tinta: 1,04:1 sin anillo) */
.inv{--_fill:var(--g-color-text);--_ink:var(--g-color-bg);--_tile:color-mix(in oklab,var(--g-color-bg) 9%,transparent);
  background:var(--_fill);color:var(--_ink);box-shadow:0 0 0 var(--g-border-width) var(--g-color-bg),var(--g-shadow-2)}

/* =====================================================================
   D1 · CÁPSULA DE RELEVO: una línea; varias condiciones se relevan una tras otra en la misma cápsula; la acción asoma al
   pasar o enfocar; el tiempo se ve como un anillo alrededor de la insignia
   ===================================================================== */
.d1{position:relative;inline-size:var(--_w);block-size:var(--_h);max-inline-size:calc(100vw - var(--_m) * 2);overflow:clip;pointer-events:auto;border-radius:calc(var(--_row) / 2)}
.d1[hidden]{display:none}
.d1.is-list{border-radius:var(--g-radius-xl)}
.d1__inner{inline-size:max-content;max-inline-size:calc(100vw - var(--_m) * 2);display:flex;flex-direction:column}
.d1.is-peek .d1__inner,.d1.is-list .d1__inner{inline-size:min(calc(var(--g-space-1) * 104),calc(100vw - var(--_m) * 2))}
.d1__row{display:flex;align-items:center;gap:var(--g-space-2);min-block-size:var(--_row);padding:0 var(--g-space-4) 0 var(--g-space-2)}
.d1__summary{font:inherit;color:inherit;background:none;border:0;padding:0;display:flex;align-items:center;gap:var(--g-space-2);min-inline-size:0;flex:1;cursor:pointer;text-align:start;min-block-size:var(--g-space-8)}
.d1__text{min-inline-size:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--g-text-action-weight)}
.d1.is-peek .d1__text,.d1.is-list .d1__text{white-space:normal}
.d1__count{font-size:var(--g-text-body-sm-size);font-variant-numeric:tabular-nums;white-space:nowrap}
.d1__more{display:grid;gap:var(--g-space-2);padding:0 var(--g-space-4) var(--g-space-3) calc(var(--g-space-2) + var(--g-space-8) + var(--g-space-2))}
.d1.is-list .d1__more{padding:0 var(--g-space-2) var(--g-space-2)}
.d1__more[hidden]{display:none}
.d1__desc{margin:0;font-size:var(--g-text-body-sm-size)}
.d1__acts{display:flex;flex-wrap:wrap;gap:var(--g-space-2)}
.ring{position:absolute;inset:calc(var(--g-space-1) * -1);inline-size:calc(100% + var(--g-space-2));block-size:calc(100% + var(--g-space-2));rotate:-90deg;pointer-events:none}
.ring circle{fill:none;stroke:var(--_ink);stroke-width:2;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--_left, 1) * 100)}
.d1__summary .badge:has(.ring){outline:none}
.roll{display:block;animation:x-roll var(--g-duration-slow) var(--g-ease-out)}
@keyframes x-roll{from{translate:0 60%;opacity:0}}

/* =====================================================================
   D2 · TARJETAS EN MAZO: dos líneas con la acción a la vista; varias se apilan como un mazo y se despliegan al pasar;
   el tiempo es una línea fina en el borde inferior de cada tarjeta
   ===================================================================== */
.d2{position:relative;inline-size:min(calc(var(--g-space-1) * 100),calc(100vw - var(--_m) * 2));block-size:var(--_deck-h,0px);pointer-events:auto;transition:block-size var(--g-duration-slow) var(--g-ease-out)}
.d2[hidden]{display:none}
.card{position:absolute;inset-inline:0;inset-block-start:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--g-space-1) var(--g-space-3);align-items:start;
  padding:var(--g-space-3) var(--g-space-3) var(--g-space-3) var(--g-space-3);border-radius:var(--g-radius-xl);overflow:clip;
  translate:0 var(--_y,0px);scale:var(--_k,1);transform-origin:50% 100%;z-index:var(--_z,1);transition:translate var(--g-duration-slow) var(--g-ease-out),scale var(--g-duration-slow) var(--g-ease-out),opacity var(--g-duration-press) var(--g-ease-out)}
.card.is-behind > *{opacity:0;transition:opacity var(--g-duration-fast) var(--g-ease-standard)}
.card__title{margin:0;font-weight:var(--g-text-title-sm-weight);min-inline-size:0}
.card__desc{margin:0;font-size:var(--g-text-body-sm-size)}
.card__body{min-inline-size:0;display:grid;gap:var(--g-space-1)}
.card__acts{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:var(--g-space-2);align-items:center}
.card__close{grid-column:3;grid-row:1}
.card__bar{position:absolute;inset-inline:var(--g-space-3);inset-block-end:0;block-size:calc(var(--g-border-width) * 2);background:color-mix(in oklab,var(--_ink) 24%,transparent);border-radius:var(--g-radius-pill);overflow:hidden}
.card__bar::before{content:"";display:block;block-size:100%;background:var(--_ink);transform-origin:0 50%;scale:var(--_left,1) 1}
[dir=rtl] .card__bar::before{transform-origin:100% 50%}
.card.is-in{animation:x-fall var(--g-duration-slow) var(--g-ease-out)}
.card.is-out{animation:x-rise var(--g-duration-slow) var(--g-ease-standard) forwards;pointer-events:none}
.d2__head{position:absolute;inset-inline:0;inset-block-start:calc(var(--_head-y, 0px));display:flex;justify-content:flex-end}
.d2__head[hidden]{display:none}

/* =====================================================================
   D3 · REPISA DEL ENCABEZADO: banda clara que sale de debajo del encabezado (relación estructural con la cabecera), una
   línea con la acción y «Fijar» a la vista; lo nuevo sustituye y una cuenta abre el resto
   ===================================================================== */
.isle[data-p=D3]{inset-block-start:var(--_top, var(--g-space-16));clip-path:inset(0 -100vw -100vh -100vw)}
.d3{--_fill:var(--g-color-surface);--_ink:var(--g-color-text);--_tile:var(--g-color-bg);
  inline-size:min(calc(var(--g-space-1) * 150),calc(100vw - var(--_m) * 2));block-size:var(--_h);overflow:clip;pointer-events:auto;background:var(--_fill);color:var(--_ink);
  border:var(--g-border-width) solid var(--g-color-border-control);border-block-start:0;border-end-start-radius:var(--g-radius-xl);border-end-end-radius:var(--g-radius-xl);box-shadow:var(--g-shadow-2)}
.d3[hidden]{display:none}
.d3__inner{display:flex;flex-direction:column}
.d3__row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--g-space-2) var(--g-space-3);min-block-size:var(--_row);padding:var(--g-space-2) var(--g-space-3)}
.d3__summary{font:inherit;color:inherit;background:none;border:0;padding:0;display:flex;align-items:center;gap:var(--g-space-2);flex:1 1 calc(var(--g-space-1) * 40);min-inline-size:0;text-align:start;cursor:pointer;min-block-size:var(--g-space-8)}
.d3__text{min-inline-size:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--g-text-action-weight)}
.d3__tools{display:flex;align-items:center;gap:var(--g-space-1);margin-inline-start:auto}
.d3__list{padding:0 var(--g-space-3) var(--g-space-3);border-block-start:var(--g-border-width) solid var(--g-color-border)}
.d3__list[hidden]{display:none}
.d3 .badge{--_s:calc(var(--g-space-1) * 6)}
.isle[data-p=D3] .is-in{animation:x-shelf var(--g-duration-slow) var(--g-ease-out)}
.isle[data-p=D3] .is-out{animation:x-shelf-out var(--g-duration-slow) var(--g-ease-standard) forwards}
@keyframes x-shelf{from{translate:0 -100%}}
@keyframes x-shelf-out{to{translate:0 -100%}}

/* Movimiento: tamaño entre px medidos ANTES de mostrar (F2 de coco); caer y subir (D de r03) */
.isle.is-ready .d1,.isle.is-ready .d3{transition:inline-size var(--g-duration-slow) var(--g-ease-spring),block-size var(--g-duration-slow) var(--g-ease-spring),border-radius var(--g-duration-slow) var(--g-ease-out)}
.isle.is-ready .d1.is-leaving,.isle.is-ready .d3.is-leaving{transition:inline-size var(--g-duration-slow) var(--g-ease-out),block-size var(--g-duration-slow) var(--g-ease-out)}
.isle.no-tr .d1,.isle.no-tr .d3,.isle.no-tr .d1__inner{transition:none !important}
.d1__inner{transition:opacity var(--g-duration-press) var(--g-ease-out)}
.d1.is-veiled .d1__inner{opacity:0;transition:opacity var(--g-duration-fast) var(--g-ease-standard)}
.d1.is-in{animation:x-fall var(--g-duration-slow) var(--g-ease-out)}
.d1.is-out{animation:x-rise var(--g-duration-slow) var(--g-ease-standard) forwards}
@keyframes x-fall{from{translate:0 calc(-100% - var(--_m));scale:0.9;opacity:0}}
@keyframes x-rise{to{translate:0 calc(-100% - var(--_m));scale:0.9;opacity:0}}
@keyframes x-fade{from{opacity:0}}
@keyframes x-fadeout{to{opacity:0}}

@media (prefers-reduced-motion:reduce){
  .isle.is-ready .d1,.isle.is-ready .d3,.isle.is-ready .d1.is-leaving,.isle.is-ready .d3.is-leaving,.d2,.card{transition:opacity var(--g-duration-fast) var(--g-ease-standard)}
  .d1.is-in,.card.is-in,.isle[data-p=D3] .is-in{animation:x-fade var(--g-duration-fast) var(--g-ease-standard)}
  .d1.is-out,.card.is-out,.isle[data-p=D3] .is-out{animation:x-fadeout var(--g-duration-fast) var(--g-ease-standard) forwards}
  .roll,.mark.is-echo,.badge.is-busy .g-icon{animation:none}
}
@media (forced-colors:active){.inv,.d3,.badge{border:var(--g-border-width) solid CanvasText}}
</style>
</head>
<body>
<header class="sh-bar" id="hdr" data-g-zone="brand">
  <span class="sh-brand">Facturación</span>
  <nav class="sh-pick" aria-label="Propuesta">
    <a href="?p=D1" id="pick-D1">D1 · Cápsula</a><a href="?p=D2" id="pick-D2">D2 · Mazo</a><a href="?p=D3" id="pick-D3">D3 · Repisa</a><a href="#" id="pick-theme">Tema</a>
  </nav>
</header>
<main>
  <h1 id="ref-h1">Facturas</h1>
  <p class="lead" id="lead"></p>
  <section class="card-p" id="form-card">
    <h2>Nueva factura</h2>
    <form id="form" aria-label="Factura" onsubmit="return false">
      <div class="x-field"><label for="cliente">Cliente</label><input id="cliente" value="Clínica Norte"></div>
      <div class="x-actions" id="actions">
        <button type="button" class="mark" id="mark-save" hidden></button>
        <button type="submit" class="btn btn--solid" id="save">Guardar</button>
      </div>
    </form>
  </section>
  <section class="card-p" id="ref-table" aria-label="Últimas facturas">
    <h2>Últimas facturas</h2>
    <table class="x-table"><thead><tr><th>Folio</th><th>Cliente</th><th>Total</th></tr></thead>
      <tbody><tr id="ref-row1"><td>F-0040</td><td>Clínica Norte</td><td>$1,200</td></tr><tr><td>F-0041</td><td>Laboratorio Sur</td><td>$860</td></tr></tbody></table>
  </section>
  <div class="sim" id="sim">
    <strong>Simular (la aplicación)</strong>
    <label><input type="checkbox" id="fails" checked> El servidor falla al guardar</label>
    <button class="btn btn--sm" id="s-offline">Sin conexión</button>
    <button class="btn btn--sm" id="s-online">Vuelve la conexión</button>
    <button class="btn btn--sm" id="s-maint">Mantenimiento</button>
    <button class="btn btn--sm" id="s-session">Sesión por caducar</button>
    <button class="btn btn--sm" id="s-three">Tres a la vez</button>
    <button class="btn btn--sm" id="s-clear">Quitar todas</button>
  </div>
  <p class="note" id="explain"></p>
</main>
<div class="isle" id="isle" data-form="empty">
  <section class="isle__region" id="region" aria-label="Estado de la aplicación (Alt+F8)"></section>
</div>
<script src="../../lucide-icons.js"></script>
<script src="./base.js"></script>
<script>
(function () {
  const B = window.Base
  const q = new URLSearchParams(location.search)
  const P = (q.get('p') || 'D1').toUpperCase()
  if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark'
  document.getElementById('pick-' + P).setAttribute('aria-current', 'page')
  const themeLink = document.getElementById('pick-theme')
  themeLink.textContent = q.get('theme') === 'dark' ? 'Tema claro' : 'Tema oscuro'
  themeLink.href = `?p=${P}${q.get('theme') === 'dark' ? '' : '&theme=dark'}`
  const LEAD = {
    D1: 'D1 · Cápsula de relevo. Una línea que cae del borde y se ensancha. Si llegan varias, se relevan en la misma cápsula, una tras otra. La acción asoma al pasar el puntero o al enfocar; el anillo de la insignia es el tiempo que queda (se detiene en pausa).',
    D2: 'D2 · Tarjetas en mazo. Dos líneas con la acción siempre a la vista. Varias se apilan como un mazo y se despliegan al pasar el puntero; cada tarjeta se va a su tiempo, que se ve como una línea fina en su borde inferior.',
    D3: 'D3 · Repisa del encabezado. Una banda clara sale de debajo de la cabecera, unida a ella. Una línea con la acción, «Fijar» y cerrar a la vista. Lo nuevo sustituye a lo anterior y «N más» abre el resto.'
  }
  document.getElementById('lead').textContent = LEAD[P]
  const isle = document.getElementById('isle'); isle.dataset.p = P
  const region = document.getElementById('region')
  const mark = document.getElementById('mark-save')
  const hdr = document.getElementById('hdr')
  const I = B.icon, E = B.esc
  const TY = B.TYPES
  // tiempo de lectura de GToast (#142); `t` en la URL lo fija para las pruebas
  const readFor = (c) => B.T || Math.min(12000, Math.max(5000, 2000 + 60 * ((c.title || '').length + (c.description || '').length)))
  const setTop = () => isle.style.setProperty('--_top', hdr.getBoundingClientRect().bottom + 'px')
  setTop(); addEventListener('resize', setTop)

  // ---------- Estado de la vista ----------
  let shown = []      // ids a la vista (D1 y D3: uno; D2: hasta tres)
  let queue = []      // D1: relevo
  let list = false    // lista de todo lo vigente (Alt+F8, marca, «N más»)
  let pinned = false  // D3: «Fijar»
  let peek = false    // D1: asomo
  let saved = null
  const left = new Map() // id → ms que quedan
  const total = new Map()
  let fanned = false     // D2: mazo desplegado al pasar

  // Un reloj para todo: descuenta solo si nada lo pausa (puntero o foco en la isla o en la marca, pestaña oculta, Fijar)
  function paused () {
    return list || pinned || document.visibilityState === 'hidden' || isle.matches(':hover') || isle.contains(document.activeElement) || mark.matches(':hover,:focus')
  }
  let lastT = performance.now()
  setInterval(() => {
    const now = performance.now(), dt = now - lastT; lastT = now
    const p = paused()
    isle.dataset.paused = String(p)
    for (const id of [...shown]) {
      if (!left.has(id)) continue
      if (!p) left.set(id, left.get(id) - dt)
      const el = P === 'D2' ? region.querySelector(`.card[data-id="${CSS.escape(id)}"]`) : region.querySelector('.d1,.d3')
      if (el) el.style.setProperty('--_left', Math.max(0, left.get(id) / total.get(id)).toFixed(3))
      if (left.get(id) <= 0) expire(id)
    }
    // cuenta atrás visible (deadline)
    region.querySelectorAll('[data-deadline]').forEach((t) => { t.textContent = mmss(+t.dataset.deadline - Date.now()) })
  }, 50)
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
  function arm (id) {
    const c = B.conds.get(id)
    if (!c || c.deadline) { left.delete(id); return } // una cuenta atrás no se recoge sola (2.2.1)
    const ms = readFor(c); left.set(id, ms); total.set(id, ms)
  }

  // ---------- Piezas ----------
  const badge = (c, extra = '') => `<span class="badge${c.busy ? ' is-busy' : ''}" data-type="${c.type}" aria-hidden="true">${I(c.busy ? 'loader-circle' : B.ICON[c.type])}${extra}</span>`
  const actBtn = (c, cls = 'ibtn') => c.action ? `<button type="button" class="${cls}" data-do="act" data-id="${E(c.id)}"${c.busy ? ' aria-disabled="true"' : ''}>${E(c.busy ? (c.action.busyLabel || c.action.label) : c.action.label)}</button>` : ''
  const timer = (c) => c.deadline ? `<span class="timer" role="timer" aria-live="off" data-deadline="${c.deadline}">${mmss(c.deadline - Date.now())}</span>` : ''
  function itemHTML (c) {
    const a = [actBtn(c)]
    if (c.link) a.push(`<a class="ibtn ibtn--quiet" href="${E(c.link.href)}" data-do="link">${E(c.link.label)}</a>`)
    if (c.origin && c.type !== 'success') a.push(`<button type="button" class="ibtn ibtn--quiet" data-do="origin" data-id="${E(c.id)}">${E(c.origin.label)}</button>`)
    if (c.dismissible) a.push(`<button type="button" class="ibtn ibtn--quiet ibtn--icon" data-do="dismiss" data-id="${E(c.id)}" aria-label="Descartar: ${E(c.title)}">${I('x')}</button>`)
    return `<li class="item" data-type="${c.type}" data-item="${E(c.id)}"${c.busy ? ' aria-busy="true"' : ''}>${badge(c)}<div><p class="item__title"><span class="sr">${TY[c.type]}: </span>${E(c.title)}</p>${c.description ? `<p class="item__desc">${E(c.description)}</p>` : ''}${timer(c)}</div>${a.join('') ? `<div class="item__actions">${a.join('')}</div>` : ''}</li>`
  }
  const listHTML = () => `<div class="list-head"><span aria-hidden="true">Pendiente</span><button type="button" class="ibtn" data-do="close">${I('x')} Cerrar</button></div><ul class="items">${B.list().map(itemHTML).join('')}</ul>`
  const borderW = (el) => parseFloat(getComputedStyle(el).borderTopWidth) || 0

  // ---------- D1 · Cápsula de relevo ----------
  function paintD1 ({ birth = false, roll = false } = {}) {
    let shape = region.querySelector('.d1')
    const id = shown[0]
    const c = id && B.conds.get(id)
    if (!list && !c) { if (shape) shape.hidden = true; return }
    if (!shape) { region.innerHTML = '<div class="d1 inv"><div class="d1__inner"></div></div>'; shape = region.querySelector('.d1'); shape.hidden = true; watchSize(shape) }
    const inner = shape.firstElementChild
    const cur = c || B.list()[0]
    const waiting = queue.length
    const ring = cur.deadline ? '' : '<svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="16" pathLength="100"/></svg>'
    const count = list ? '' : waiting ? `<span class="d1__count"><span aria-hidden="true">+${waiting}</span><span class="sr">, ${waiting} más en espera</span></span>` : ''
    inner.innerHTML = `<div class="d1__row"><button type="button" class="d1__summary" aria-expanded="${list || peek}" aria-keyshortcuts="Alt+F8">${badge(cur, ring)}${list ? `<span class="d1__text">Pendiente (${B.conds.size})</span>` : `<span class="d1__text${roll ? ' roll' : ''}"><span class="sr">${TY[cur.type]}: </span>${E(cur.title)}</span>`}${timer(cur)}</button>${count}${list ? '' : `<span aria-hidden="true">${I('chevron-down')}</span>`}</div>
      <div class="d1__more"${list || peek ? '' : ' hidden'}>${list ? listHTML() : `${cur.description ? `<p class="d1__desc">${E(cur.description)}</p>` : ''}<div class="d1__acts">${actBtn(cur)}${cur.origin && cur.type !== 'success' ? `<button type="button" class="ibtn ibtn--quiet" data-do="origin" data-id="${E(cur.id)}">${E(cur.origin.label)}</button>` : ''}${cur.link ? `<a class="ibtn ibtn--quiet" href="${E(cur.link.href)}" data-do="link">${E(cur.link.label)}</a>` : ''}<button type="button" class="ibtn ibtn--quiet" data-do="dismiss-view">Ocultar</button></div>`}</div>`
    shape.classList.toggle('is-peek', peek && !list)
    shape.classList.toggle('is-list', list)
    const wasHidden = shape.hidden
    if (wasHidden) { isle.classList.add('no-tr'); shape.style.visibility = 'hidden'; shape.hidden = false }
    const w = inner.offsetWidth + 2 * borderW(shape), h = inner.offsetHeight + 2 * borderW(shape)
    const capsule = wasHidden && !list && !B.reduced()
    shape.style.setProperty('--_w', capsule ? 'calc(var(--g-space-1) * 24)' : w + 'px')
    shape.style.setProperty('--_h', capsule ? 'var(--_row)' : h + 'px')
    if (capsule) shape.classList.add('is-veiled')
    if (wasHidden) {
      void shape.offsetWidth; shape.style.visibility = ''
      requestAnimationFrame(() => isle.classList.remove('no-tr'))
      play(shape, 'is-in', () => { if (leaving) return; shape.style.setProperty('--_w', inner.offsetWidth + 2 * borderW(shape) + 'px'); shape.style.setProperty('--_h', inner.offsetHeight + 2 * borderW(shape) + 'px'); shape.classList.remove('is-veiled') })
    }
  }
  // El contenido puede cambiar de tamaño sin repintar (la fuente llega tarde): se vuelve a medir, salvo al nacer o al irse
  function watchSize (shape) {
    if (typeof ResizeObserver !== 'function') return
    new ResizeObserver(() => {
      if (shape.hidden || leaving || shape.classList.contains('is-veiled')) return
      const inner = shape.firstElementChild, b = borderW(shape)
      if (shape.matches('.d1')) shape.style.setProperty('--_w', inner.offsetWidth + 2 * b + 'px')
      shape.style.setProperty('--_h', inner.offsetHeight + (shape.matches('.d1') ? 2 * b : b) + 'px')
    }).observe(shape.firstElementChild)
  }
  // ---------- D2 · Tarjetas en mazo ----------
  function paintD2 () {
    let deck = region.querySelector('.d2')
    if (!deck) { region.innerHTML = '<div class="d2" hidden></div>'; deck = region.querySelector('.d2') }
    const ids = list ? B.list().map((c) => c.id) : shown.filter((id) => B.conds.has(id))
    const keep = new Set(ids)
    deck.querySelectorAll('.card:not(.is-out)').forEach((el) => { if (!keep.has(el.dataset.id)) leaveCard(el) })
    if (!ids.length && !deck.querySelector('.card.is-out')) { deck.hidden = true; deck.style.setProperty('--_deck-h', '0px'); return }
    deck.hidden = false
    ids.forEach((id, i) => {
      const c = B.conds.get(id)
      let el = deck.querySelector(`.card[data-id="${CSS.escape(id)}"]:not(.is-out)`)
      const fresh = !el
      if (fresh) { el = document.createElement('div'); el.className = 'card inv'; el.dataset.id = id; el.setAttribute('role', 'group'); deck.prepend(el) }
      el.dataset.type = c.type
      el.setAttribute('aria-labelledby', `t-${uidOf(id)}`)
      const html = `${badge(c)}<div class="card__body"><p class="card__title" id="t-${uidOf(id)}"><span class="sr">${TY[c.type]}: </span>${E(c.title)}</p>${c.description ? `<p class="card__desc">${E(c.description)}</p>` : ''}${timer(c)}</div>
        <button type="button" class="ibtn ibtn--icon card__close" data-do="hide-card" data-id="${E(id)}" aria-label="Cerrar: ${E(c.title)}">${I('x')}</button>
        ${c.action || c.origin || c.link ? `<div class="card__acts">${actBtn(c)}${c.link ? `<a class="ibtn ibtn--quiet" href="${E(c.link.href)}" data-do="link">${E(c.link.label)}</a>` : ''}${c.origin && c.type !== 'success' ? `<button type="button" class="ibtn ibtn--quiet" data-do="origin" data-id="${E(id)}">${E(c.origin.label)}</button>` : ''}</div>` : ''}
        ${left.has(id) && !list ? '<span class="card__bar" aria-hidden="true"></span>' : ''}`
      if (el.dataset.html !== html) { const f = el.contains(document.activeElement) && document.activeElement.dataset.do; el.innerHTML = html; el.dataset.html = html; if (f) el.querySelector(`[data-do="${f}"]`)?.focus() }

    })

  }
  const uidOf = (id) => (B.conds.get(id) || {}).uid || 0
  function layoutD2 () {
    const deck = region.querySelector('.d2'); if (!deck) return
    const cards = [...deck.querySelectorAll('.card:not(.is-out)')]
    // orden del DOM = orden de lectura = el del mazo (la más reciente primero)
    const ids = list ? B.list().map((c) => c.id) : shown
    const want = [...cards].sort((a, b) => ids.indexOf(a.dataset.id) - ids.indexOf(b.dataset.id))
    if (want.some((el, i) => el !== cards[i])) { const f = document.activeElement; want.forEach((el) => deck.append(el)); if (f && deck.contains(f)) f.focus() } // volver a insertar quita el foco
    cards.splice(0, cards.length, ...want)
    const open = list || fanned
    let y = 0, hTop = 0
    const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--g-space-2')) || 8
    cards.forEach((el, i) => {
      const h = el.offsetHeight
      if (open) { el.style.setProperty('--_y', y + 'px'); el.style.setProperty('--_k', '1'); el.classList.remove('is-behind'); y += h + gap }
      else {
        // apilada: asoma por debajo un poco de cada una (space × 2), más pequeña; su contenido se apaga
        if (i === 0) hTop = h
        el.style.setProperty('--_y', (i === 0 ? 0 : hTop + i * gap * 1.5 - h) + 'px'); el.style.setProperty('--_k', String(1 - i * 0.04)); el.classList.toggle('is-behind', i > 0)
      }
      el.style.setProperty('--_z', String(cards.length - i))
      el.toggleAttribute('inert', !open && i > 0)
    })
    deck.style.setProperty('--_deck-h', (open ? Math.max(0, y - gap) : hTop + Math.max(0, cards.length - 1) * gap * 1.5) + 'px')
  }
  function leaveCard (el) {
    if (el.classList.contains('is-out')) return
    if (el.contains(document.activeElement)) focusOut(el)
    el.setAttribute('inert', '')
    play(el, 'is-out', () => { el.remove(); const deck = region.querySelector('.d2'); if (deck && !deck.querySelector('.card')) { deck.hidden = true; deck.style.setProperty('--_deck-h', '0px') } layoutD2() })
  }
  // ---------- D3 · Repisa del encabezado ----------
  function paintD3 () {
    let shelf = region.querySelector('.d3')
    const id = shown[0]
    const c = id && B.conds.get(id)
    if (!list && !c) { if (shelf) shelf.hidden = true; return }
    if (!shelf) { region.innerHTML = '<div class="d3"><div class="d3__inner"></div></div>'; shelf = region.querySelector('.d3'); shelf.hidden = true; watchSize(shelf) }
    const inner = shelf.firstElementChild
    const cur = c || B.list()[0]
    const others = B.list().filter((x) => x.id !== cur.id).length
    inner.innerHTML = `<div class="d3__row" data-type="${cur.type}"><button type="button" class="d3__summary" aria-expanded="${list}" aria-keyshortcuts="Alt+F8">${badge(cur)}<span class="d3__text"><span class="sr">${TY[cur.type]}: </span>${E(cur.title)}</span></button>
        <span class="d3__tools">${timer(cur)}${list ? '' : actBtn(cur)}${others && !list ? `<button type="button" class="ibtn ibtn--quiet" data-do="list">${others} más</button>` : ''}
        ${list || cur.deadline ? '' : `<button type="button" class="ibtn ibtn--icon" data-do="pin" aria-pressed="${pinned}" aria-label="Fijar">${I('circle-pause')}</button>`}
        <button type="button" class="ibtn ibtn--icon" data-do="close" aria-label="Cerrar">${I('x')}</button></span></div>
      <div class="d3__list"${list ? '' : ' hidden'}>${list ? `<ul class="items">${B.list().map(itemHTML).join('')}</ul>` : ''}</div>`
    const wasHidden = shelf.hidden
    if (wasHidden) { isle.classList.add('no-tr'); shelf.style.visibility = 'hidden'; shelf.hidden = false }
    shelf.style.setProperty('--_h', inner.offsetHeight + borderW(shelf) + 'px')
    if (wasHidden) { void shelf.offsetWidth; shelf.style.visibility = ''; requestAnimationFrame(() => isle.classList.remove('no-tr')); play(shelf, 'is-in') }
  }

  function paint (o) {
    const keep = isle.contains(document.activeElement) ? document.activeElement : null
    const key = keep && keep.dataset.do ? `[data-do="${keep.dataset.do}"]${keep.dataset.id ? `[data-id="${CSS.escape(keep.dataset.id)}"]` : ''}` : keep && keep.matches('.d1__summary,.d3__summary') ? '.d1__summary,.d3__summary' : null
    if (leaving) { paintMark(); return }
    isle.dataset.form = list ? 'list' : shown.length ? 'line' : 'empty'
    paintMark()
    if (P === 'D1') paintD1(o); else if (P === 'D2') paintD2(o); else paintD3(o)
    if (keep && !keep.isConnected) { const back = key && region.querySelector(key); (back || firstFocusable() || null)?.focus?.() }
  }
  function paintMark () {
    const c = B.conds.get('save')
    if (!c || !document.getElementById('save')) { mark.hidden = true; return }
    mark.hidden = false
    mark.innerHTML = `${badge(c)}<span><span class="sr">${TY[c.type]}: </span>${c.type === 'success' ? 'Guardada' : c.busy ? 'Reintentando…' : 'No se guardó'}</span>`
  }
  const firstFocusable = () => region.querySelector('.card:not([inert]) [data-do=act]:not([aria-disabled=true]), .card:not([inert]) button, .d1__summary, .d3__summary')
  function play (el, cls, done) {
    el.classList.remove('is-in', 'is-out'); void el.offsetWidth; el.classList.add(cls)
    let ok = false
    const end = (e) => { if (ok || (e && e.target !== el)) return; ok = true; el.removeEventListener('animationend', end); if (cls === 'is-in') el.classList.remove('is-in'); if (done) done() }
    el.addEventListener('animationend', end); setTimeout(end, 600)
  }
  function focusOut (from) {
    const t = saved && saved.isConnected && !isle.contains(saved) ? saved : !mark.hidden ? mark : B.neighbour(document.getElementById('sim'))
    if (t) t.focus()
  }
  // Recoger (D1, D3): se apaga el texto, se estrecha (D1) y sube por el borde. Nada se borra del modelo salvo un resultado sin enlace.
  let leaving = 0
  function leaveAll (after) {
    const shape = region.querySelector('.d1,.d3')
    const gone = [...shown]
    const finish = () => { leaving = 0; shown = []; queue = []; list = false; pinned = false; peek = false; gone.forEach(afterGone); paint(); if (after) after() }
    if (P === 'D2') { list = false; fanned = false; shown = []; queue = []; gone.forEach(afterGone); paint(); return }
    if (!shape || shape.hidden) { finish(); return }
    if (isle.contains(document.activeElement)) focusOut()
    const tok = ++leaving
    if (P === 'D1' && !B.reduced()) {
      shape.classList.add('is-veiled', 'is-leaving')
      shape.style.setProperty('--_w', 'calc(var(--g-space-1) * 24)'); shape.style.setProperty('--_h', 'var(--_row)')
      setTimeout(() => { if (tok === leaving) play(shape, 'is-out', () => { shape.classList.remove('is-out', 'is-veiled', 'is-leaving'); shape.hidden = true; if (tok === leaving) finish() }) }, 240)
    } else play(shape, 'is-out', () => { shape.classList.remove('is-out'); shape.hidden = true; if (tok === leaving) finish() })
  }
  // Al irse de la vista: un resultado sin enlace termina; lo pendiente con marca deja un eco en la marca
  function afterGone (id) {
    left.delete(id)
    const c = B.conds.get(id); if (!c) return
    if (c.type === 'success' && !c.link) { B.remove(id, 'read'); return }
    if (id === 'save' && !mark.hidden && !B.reduced()) { mark.classList.remove('is-echo'); void mark.offsetWidth; mark.classList.add('is-echo'); setTimeout(() => mark.classList.remove('is-echo'), 900) }
  }
  function expire (id) {
    left.delete(id)
    if (P === 'D1') {
      if (queue.length) { const next = queue.shift(); afterGone(id); shown = [next]; arm(next); paint({ roll: true }); return }
      leaveAll(); return
    }
    if (P === 'D2') { shown = shown.filter((x) => x !== id); afterGone(id); paint(); return }
    leaveAll()
  }
  function show (id) {
    if (leaving) { leaving = 0; region.querySelectorAll('.is-out,.is-veiled,.is-leaving').forEach((el) => el.classList.remove('is-out', 'is-veiled', 'is-leaving')); const s = region.querySelector('.d1,.d3'); if (s) s.hidden = true; shown = [] }
    if (list) { paint(); return }
    if (P === 'D1') {
      if (!shown.length) { shown = [id]; arm(id); paint(); return }
      if (shown[0] === id) { arm(id); paint(); return }
      queue = queue.filter((x) => x !== id)
      const rank = (x) => B.RANK[(B.conds.get(x) || {}).type] ?? 9
      // lo más grave pasa delante: si es más grave que lo que se lee, lo releva ya y lo anterior espera el primero
      if (rank(id) < rank(shown[0])) { queue.unshift(shown[0]); shown = [id]; arm(id); paint({ roll: true }); return }
      queue.push(id); queue.sort((a, b) => rank(a) - rank(b))
      paint(); return
    }
    if (P === 'D2') { shown = [id, ...shown.filter((x) => x !== id)].slice(0, 3); arm(id); paint(); return }
    const roll = shown.length > 0
    shown = [id]; arm(id); paint({ roll })
  }
  function openList (focus) {
    if (leaving) { leaving = 0; region.querySelectorAll('.is-out,.is-veiled,.is-leaving').forEach((el) => el.classList.remove('is-out', 'is-veiled', 'is-leaving')) }
    list = true; peek = false; paint()
    if (focus === 'summary') (region.querySelector('.d1__summary,.d3__summary') || firstFocusable())?.focus()
    else if (focus) { const t = region.querySelector(`[data-do=act][data-id="${CSS.escape(focus)}"]:not([aria-disabled=true])`) || region.querySelector(`[data-item="${CSS.escape(focus)}"] [data-do], .card[data-id="${CSS.escape(focus)}"] [data-do]`); (t || firstFocusable())?.focus() }
  }
  function closeAll () { focusOut(); list = false; fanned = false; leaveAll() }

  // ---------- Sucesos del modelo ----------
  B.on((ev) => {
    if (!B.mounted) { paint(); return }
    if (ev.kind === 'remove') {
      shown = shown.filter((x) => x !== ev.id); queue = queue.filter((x) => x !== ev.id); left.delete(ev.id)
      if (P === 'D1' && !shown.length && queue.length) { shown = [queue.shift()]; arm(shown[0]); paint({ roll: true }); return }
      if (!B.conds.size || (!shown.length && !list)) { leaveAll(); return }
      paint(); return
    }
    if (ev.kind === 'state') { paint(); return }
    if (ev.kind === 'appear' || ev.kind === 'announce' || ev.changed) show(ev.id); else paint()
  })

  // ---------- Interacción ----------
  region.addEventListener('click', (e) => {
    const t = e.target.closest('[data-do],.d1__summary,.d3__summary'); if (!t) return
    if (t.matches('.d1__summary,.d3__summary')) { if (list) closeAll(); else { saved = saved || null; openList('summary') } return }

    else if (d === 'dismiss') B.remove(id, 'dismiss')
    else if (d === 'dismiss-view' || d === 'hide-card') { if (P === 'D2' && !list) { shown = shown.filter((x) => x !== id); afterGone(id); paint(); if (!shown.length) focusOut() } else closeAll() }
    else if (d === 'origin') { const c = B.conds.get(id); closeAll(); const el = document.getElementById(c.origin.target); if (el) { if (!el.matches('a,button,input,[tabindex]')) el.tabIndex = -1; el.focus(); el.scrollIntoView({ block: 'nearest' }) } }
    else if (d === 'link') { e.preventDefault(); closeAll() }
  })
  // D1: la acción asoma al pasar o enfocar
  if (P === 'D1') {
    const setPeek = (v) => { if (list || peek === v || !shown.length) return; peek = v; paint() }
    isle.addEventListener('pointerenter', () => setPeek(true), true)
    isle.addEventListener('pointerleave', (e) => { if (e.target === region.querySelector('.d1') && !isle.contains(document.activeElement)) setPeek(false) }, true)
    isle.addEventListener('focusin', () => setPeek(true))
    isle.addEventListener('focusout', () => setTimeout(() => { if (!isle.contains(document.activeElement) && !isle.matches(':hover')) setPeek(false) }, 0))
  }
  // D2: el mazo se despliega al pasar o enfocar
  if (P === 'D2') {
    const fan = (v) => { if (fanned === v) return; fanned = v; layoutD2() }
    isle.addEventListener('pointerenter', () => fan(true), true)
    isle.addEventListener('pointerleave', (e) => { if (e.target === region.querySelector('.d2') && !isle.contains(document.activeElement)) fan(false) }, true)
    isle.addEventListener('focusin', () => fan(true))
    isle.addEventListener('focusout', () => setTimeout(() => { if (!isle.contains(document.activeElement) && !isle.matches(':hover')) fan(false) }, 0))
  }
  isle.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (shown.length || list)) { e.preventDefault(); e.stopPropagation(); closeAll() } })
  document.addEventListener('pointerdown', (e) => { if (list && !isle.contains(e.target) && !mark.contains(e.target)) closeAll() }, true)
  document.addEventListener('keydown', (e) => {
    if (!B.hotkey(e) || !B.conds.size) return
    e.preventDefault()
    if (isle.contains(document.activeElement)) { closeAll(); return }
    saved = document.activeElement
    openList('summary')
  })
  mark.addEventListener('click', () => { saved = mark; if (B.conds.has('save')) openList('save') })

  // ---------- La aplicación de ejemplo ----------
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const fails = document.getElementById('fails')
  const saveReq = () => wait(700).then(() => { if (fails.checked) throw new Error('500'); return { type: 'success', title: 'Factura guardada con el folio F-0042', description: '', details: undefined, action: undefined, link: { label: 'Ver factura', href: '#f-0042' } } })
  document.getElementById('form').addEventListener('submit', () => {
    if (!fails.checked) { B.set('save', { type: 'success', title: 'Factura guardada con el folio F-0042', description: '', action: undefined, link: { label: 'Ver factura', href: '#f-0042' }, origin: { label: 'Ir al formulario', target: 'form' } }); return }
    if (B.conds.has('save') && B.conds.get('save').type === 'error') { B.again('save'); return }
    B.set('save', { type: 'error', title: 'No se pudo guardar la factura', description: 'El servidor no respondió; tus datos siguen en el formulario.', action: { label: 'Reintentar', busyLabel: 'Reintentando…', onClick: saveReq }, origin: { label: 'Ir al formulario', target: 'form' } })
  })
  document.getElementById('s-offline').onclick = () => B.set('offline', { type: 'warning', title: 'Sin conexión', description: 'Los cambios se guardarán al volver.' })
  document.getElementById('s-online').onclick = () => B.resolve('offline', 'Conexión restablecida')
  document.getElementById('s-maint').onclick = () => B.set('maint', { type: 'info', title: 'Mantenimiento esta noche', description: 'De 23:00 a 23:30 no se podrá guardar.', dismissible: true })
  document.getElementById('s-session').onclick = () => B.set('session', { type: 'warning', title: 'La sesión caduca pronto', description: 'Sigue conectado para no perder los cambios.', deadline: Date.now() + 120000, action: { label: 'Seguir conectado', onClick: () => { B.resolve('session', 'Sesión renovada') } } })
  document.getElementById('s-three').onclick = () => { document.getElementById('s-maint').click(); document.getElementById('s-offline').click(); document.getElementById('save').click() }
  document.getElementById('s-clear').onclick = () => { [...B.conds.keys()].forEach((id) => B.remove(id, 'clear')) }
  document.getElementById('explain').textContent = 'Prueba: Guardar (falla) → cae, se lee y se recoge; el error queda en «No se guardó» (eco al recogerse). Púlsala o Alt+F8 para volver a verlo. «Tres a la vez» enseña cómo se relevan, apilan o sustituyen. «Sesión por caducar» se queda hasta actuar. Cambia el tema arriba.'
  window.__S = { B, P, get shown () { return shown }, get queue () { return queue }, get list () { return list }, get pinned () { return pinned }, openList, closeAll, paint }
  B.mount(isle)
  paint()
  requestAnimationFrame(() => requestAnimationFrame(() => isle.classList.add('is-ready')))
})()
</script>
</body>
</html>
