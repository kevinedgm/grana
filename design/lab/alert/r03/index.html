<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isla de estado · r03 · tres conceptos de comportamiento</title>
<link rel="stylesheet" href="../../../../packages/vue/dist/fonts.css">
<link rel="stylesheet" href="../../../../packages/vue/dist/grana.css">
<style>
/* r03 (kiwi): la isla vista por quien no conoce el contrato. Tres conceptos de COMPORTAMIENTO sobre la misma base (base.js),
   con TOKENS REALES del tema por defecto. Clases x*/isle* de prototipo; el CSS definitivo es de coco.
   A · Hilo (nace de su causa y vuelve a ella)   B · Punto que habla   C · Titular (contador en el borde) */
*{box-sizing:border-box}
body{margin:0;font-family:var(--g-font-ui);font-size:var(--g-text-body-size);line-height:var(--g-text-body-line);color:var(--g-color-text);background:var(--g-color-bg)}
.sr{position:absolute;inline-size:1px;block-size:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.g-icon{inline-size:1em;block-size:1em;flex:none}

/* ---------- Shell de la maqueta ---------- */
.sh-bar{position:sticky;inset-block-start:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--g-space-2);
  min-block-size:var(--g-space-16);padding:var(--g-space-2) var(--g-space-4);background:var(--g-color-surface);border-block-end:var(--g-border-width) solid var(--g-color-border)}
.sh-brand{font-weight:650}
.sh-pick{display:flex;gap:var(--g-space-1)}
.sh-pick a{display:inline-flex;align-items:center;min-block-size:var(--g-space-8);padding-inline:var(--g-space-3);border:var(--g-border-width) solid var(--g-color-border-control);border-radius:var(--g-radius-md);color:inherit;text-decoration:none;font-size:var(--g-text-body-sm-size)}
.sh-pick a[aria-current]{background:var(--g-color-brand);color:var(--g-color-on-brand);border-color:var(--g-color-brand)}
.sh-pick a:focus-visible,.btn:focus-visible,.x-field input:focus-visible{outline:var(--g-focus-width) solid var(--g-color-focus);outline-offset:var(--g-focus-offset)}
main{max-inline-size:56rem;margin:0 auto;padding:var(--g-space-6) var(--g-space-4) var(--g-space-16)}
h1{font-size:var(--g-text-title-lg-size);line-height:var(--g-text-title-lg-line);margin:0 0 var(--g-space-1)}
.lead{color:var(--g-color-text-muted);margin:0 0 var(--g-space-6);max-inline-size:70ch}
.card{padding:var(--g-space-6);background:var(--g-color-surface);border:var(--g-border-width) solid var(--g-color-border);border-radius:var(--g-radius-lg);margin-block-end:var(--g-space-6);min-inline-size:0}
.card h2{font-size:var(--g-text-title-sm-size);line-height:var(--g-text-title-sm-line);margin:0 0 var(--g-space-4)}
.x-field{display:grid;gap:var(--g-space-1);max-inline-size:28rem}
.x-field input{font:inherit;min-block-size:calc(var(--g-space-1) * 10);padding-inline:var(--g-space-3);border:var(--g-border-width) solid var(--g-color-border-control);border-radius:var(--g-radius-md);background:var(--g-color-surface);color:inherit}
.x-actions{display:flex;justify-content:flex-end;align-items:center;gap:var(--g-space-2);margin-block-start:var(--g-space-4);min-block-size:calc(var(--g-space-1) * 10)}
.btn{font:inherit;font-weight:var(--g-text-action-weight);display:inline-flex;align-items:center;justify-content:center;gap:var(--g-space-2);min-block-size:calc(var(--g-space-1) * 10);padding-inline:var(--g-space-4);
  border:var(--g-border-width) solid var(--g-color-border-control);border-radius:var(--g-radius-md);background:var(--g-color-surface);color:var(--g-color-text);cursor:pointer}
.btn--solid{background:var(--g-color-brand);border-color:var(--g-color-brand);color:var(--g-color-on-brand)}
.btn--sm{min-block-size:var(--g-space-8);padding-inline:var(--g-space-3);font-size:var(--g-text-body-sm-size)}
.x-rows{display:grid;gap:var(--g-space-1);margin:0;padding:0;list-style:none}
.x-rows li{display:flex;justify-content:space-between;padding:var(--g-space-2) var(--g-space-3);border-radius:var(--g-radius-md);background:var(--g-color-bg)}
.sim{display:flex;flex-wrap:wrap;gap:var(--g-space-2);align-items:center;padding:var(--g-space-4);border:var(--g-border-width) dashed var(--g-color-border-strong);border-radius:var(--g-radius-lg);font-size:var(--g-text-body-sm-size)}
.sim strong{flex:1 0 100%}
.sim label{display:inline-flex;gap:var(--g-space-1);align-items:center;min-block-size:24px}
.note{color:var(--g-color-text-muted);font-size:var(--g-text-body-sm-size);margin:var(--g-space-3) 0 0}

/* tipos: alias locales */
[data-type=error]{--_c:var(--g-color-danger);--_on:var(--g-color-on-danger);--_rule:solid}
[data-type=warning]{--_c:var(--g-color-warning);--_on:var(--g-color-on-warning);--_rule:dashed}
[data-type=info]{--_c:var(--g-color-info);--_on:var(--g-color-on-info);--_rule:dotted}
[data-type=success]{--_c:var(--g-color-success);--_on:var(--g-color-on-success);--_rule:none}

/* ---------- Marca junto al origen (como GStatusMark enlace: en la fila, antes del botón; no empuja) ---------- */
.mark{font:inherit;font-size:var(--g-text-body-sm-size);display:inline-flex;align-items:center;gap:var(--g-space-1);min-block-size:var(--g-space-8);padding:0 var(--g-space-3) 0 var(--g-space-1);
  border:0;border-radius:var(--g-radius-pill);background:var(--g-color-text);color:var(--g-color-surface);cursor:pointer}
.mark[hidden]{display:none}
.mark:focus-visible{outline:var(--g-focus-width) solid var(--g-color-focus);outline-offset:var(--g-focus-offset)}
.mark .badge{--_s:calc(var(--g-space-1) * 6)}
.mark.is-gone{opacity:0;transition:opacity var(--g-duration-fast) var(--g-ease-standard)}

/* ---------- La isla: base de forma (los tres) ---------- */
.isle{--_m:var(--g-space-2);--_open:min(calc(var(--g-space-1) * 104), calc(100vw - var(--_m) * 2));--_row:calc(var(--g-space-1) * 12);
  position:fixed;z-index:50;inset-inline:0;inset-block-start:calc(env(safe-area-inset-top) + var(--g-space-16) + var(--_m));display:flex;flex-direction:column;align-items:center;pointer-events:none}
.isle__shape{position:relative;inline-size:var(--_w);block-size:var(--_h);max-inline-size:calc(100vw - var(--_m) * 2);overflow:clip;pointer-events:auto;
  border:var(--g-border-width) solid transparent;border-radius:min(var(--g-radius-pill),calc(var(--_row) / 2));background:var(--g-color-text);color:var(--g-color-surface);box-shadow:var(--g-shadow-2);transform-origin:50% 0}
.isle__shape[hidden]{display:none}
.isle[data-form=open] .isle__shape{border-radius:var(--g-radius-xl)}
.isle__inner{inline-size:max-content;max-inline-size:calc(100vw - var(--_m) * 2 - var(--g-border-width) * 2);display:flex;flex-direction:column}
.isle[data-form=open] .isle__inner{inline-size:calc(var(--_open) - var(--g-border-width) * 2);max-block-size:calc(100dvh - var(--g-space-16) - var(--_m) * 3)}
.isle__summary{font:inherit;color:inherit;background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:var(--g-space-2);min-block-size:calc(var(--_row) - var(--g-border-width) * 2);
  padding:0 var(--g-space-4) 0 var(--g-space-2);text-align:start;border-radius:inherit;min-inline-size:0}
.isle__summary:focus-visible,.isle .ibtn:focus-visible,.isle .item:focus-visible{outline:var(--g-focus-width) solid var(--g-color-surface);outline-offset:calc(var(--g-focus-width) * -2)}
.isle__text{min-inline-size:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:var(--g-text-action-weight)}
.isle__more{font-variant-numeric:tabular-nums;font-size:var(--g-text-body-sm-size)}
.isle__chev{display:inline-grid;place-items:center;transition:rotate var(--g-duration-fast) var(--g-ease-out)}
.isle[data-form=open] .isle__chev{rotate:180deg}
.badge{--_s:calc(var(--g-space-1) * 8);position:relative;display:inline-grid;place-items:center;flex:none;inline-size:var(--_s);block-size:var(--_s);border-radius:50%;
  background:var(--_c);color:var(--_on);outline:var(--g-border-width) var(--_rule) var(--g-color-surface);outline-offset:var(--g-border-width);font-size:calc(var(--_s) * 0.55)}
.badge.is-busy .g-icon{animation:x-spin var(--g-duration-spin) linear infinite}
@keyframes x-spin{to{rotate:1turn}}

/* Panel */
.isle__panel{display:grid;gap:var(--g-space-2);padding:0 var(--g-space-2) var(--g-space-2);min-block-size:0;overflow:auto;overscroll-behavior:contain}
.isle__panel[hidden]{display:none}
.panel__head{display:flex;align-items:center;justify-content:space-between;gap:var(--g-space-2);padding-inline-start:var(--g-space-2)}
.panel__title{font-size:var(--g-text-body-sm-size);font-weight:var(--g-text-action-weight)}
.items{display:grid;gap:var(--g-space-2);margin:0;padding:0;list-style:none}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--g-space-1) var(--g-space-3);padding:var(--g-space-3);border-radius:var(--g-radius-lg);background:color-mix(in oklab,var(--g-color-surface) 8%,transparent)}
.item__title{margin:0;font-weight:var(--g-text-title-sm-weight)}
.item__desc,.item__note{margin:0;font-size:var(--g-text-body-sm-size)}
.item__note{display:flex;gap:var(--g-space-1);align-items:center}
.item__actions{grid-column:2;display:flex;flex-wrap:wrap;gap:var(--g-space-2);margin-block-start:var(--g-space-1)}
.item.is-hidden{opacity:1}
.item.is-hidden .item__title{font-weight:var(--g-text-action-weight)}
.ibtn{font:inherit;font-size:var(--g-text-body-sm-size);font-weight:var(--g-text-action-weight);display:inline-flex;align-items:center;gap:var(--g-space-1);min-block-size:var(--g-space-8);min-inline-size:24px;padding-inline:var(--g-space-3);
  border:var(--g-border-width) solid var(--g-color-surface);border-radius:var(--g-radius-pill);background:transparent;color:var(--g-color-surface);cursor:pointer}
.ibtn--quiet{border-color:transparent;text-decoration:underline;text-underline-offset:0.2em}
.ibtn[aria-disabled=true]{cursor:default}
.isle__foot{display:flex;align-items:center;justify-content:space-between;gap:var(--g-space-2);padding-inline-start:var(--g-space-2);font-size:var(--g-text-body-sm-size)}
.isle__foot p{margin:0}
@media (pointer:coarse){.isle__summary,.ibtn,.mark{min-block-size:44px} .isle{--_row:max(calc(var(--g-space-1) * 12),calc(44px + var(--g-border-width) * 2))}}

/* Movimiento (comportamiento, no estética final): tamaño entre px medidos ANTES de mostrar */
.isle.is-ready .isle__shape{transition:inline-size var(--g-duration-slow) var(--g-ease-spring),block-size var(--g-duration-slow) var(--g-ease-spring),border-radius var(--g-duration-slow) var(--g-ease-out)}
.isle.no-tr .isle__shape{transition:none}
.isle.is-ready .item{transition:opacity var(--g-duration-press) var(--g-ease-out)}
@starting-style{.isle.is-ready .item{opacity:0}}
@keyframes x-drop{from{clip-path:inset(0 0 100% 0 round var(--g-radius-xl));translate:0 calc(var(--g-space-2) * -1)}to{clip-path:inset(0 0 0 0 round 0);translate:0 0}}
@keyframes x-fade{from{opacity:0}}
@keyframes x-nudge{from{scale:0.86}}
@keyframes x-ring{from{box-shadow:0 0 0 0 color-mix(in oklab,var(--_c) 70%,transparent)}to{box-shadow:0 0 0 var(--g-space-3) transparent}}
.isle.is-drop .isle__shape{animation:x-drop var(--g-duration-press) var(--g-ease-out)}
.isle.is-fade .isle__shape{animation:x-fade var(--g-duration-fast) var(--g-ease-standard)}
.isle.is-nudge .isle__shape{animation:x-nudge var(--g-duration-slow) var(--g-ease-spring)}
.flight{position:fixed;z-index:51;margin:0;pointer-events:none;border-radius:var(--g-radius-pill);background:var(--g-color-text);box-shadow:var(--g-shadow-2)}

/* =====================================================================
   A · HILO: nace de su causa (la marca) y, resuelta, vuelve a ella. Sin apertura sola, sin punto.
   ===================================================================== */
.isle[data-c=A] .isle__chev{opacity:1}

/* =====================================================================
   B · PUNTO QUE HABLA: igual que hoy, pero cada paso se explica: nace del borde, se abre en dos tiempos, se recoge sola
   con una línea de lectura visible, «Replegar» a la vista, y el punto lleva cuenta y pista.
   ===================================================================== */
.isle[data-form=dot] .isle__text,.isle[data-form=dot] .isle__more,.isle[data-form=dot] .isle__chev{position:absolute;inline-size:1px;block-size:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.isle[data-form=dot] .isle__summary{min-block-size:0;padding:var(--g-space-1);justify-content:center}
.isle[data-form=dot] .isle__shape{border-radius:50%}
.count{position:absolute;inset-block-start:calc(var(--g-space-1) * -1);inset-inline-end:calc(var(--g-space-1) * -1);min-inline-size:calc(var(--g-space-1) * 4);block-size:calc(var(--g-space-1) * 4);
  padding-inline:var(--g-space-1);border-radius:var(--g-radius-pill);background:var(--g-color-surface);color:var(--g-color-text);font-size:var(--g-text-caption-size);line-height:calc(var(--g-space-1) * 4);font-weight:var(--g-text-action-weight);font-variant-numeric:tabular-nums;text-align:center}
.isle[data-form=dot] .isle__shape{overflow:visible}
.isle__tip{position:absolute;inset-block-start:calc(100% + var(--g-space-2));padding:var(--g-space-1) var(--g-space-3);border-radius:var(--g-radius-md);background:var(--g-color-text);color:var(--g-color-surface);
  font-size:var(--g-text-body-sm-size);white-space:nowrap;max-inline-size:calc(100vw - var(--_m) * 2);overflow:hidden;text-overflow:ellipsis;box-shadow:var(--g-shadow-2);pointer-events:none;opacity:0}
.isle[data-form=dot]:has(.isle__summary:hover,.isle__summary:focus) .isle__tip{opacity:1;transition:opacity var(--g-duration-fast) var(--g-ease-out)}
.isle.is-ring .badge{animation:x-ring calc(var(--g-duration-slow) * 3) var(--g-ease-out)}
.drain{block-size:calc(var(--g-border-width) * 2);margin-inline:var(--g-space-2);border-radius:var(--g-radius-pill);background:color-mix(in oklab,var(--g-color-surface) 24%,transparent);overflow:hidden}
.drain::before{content:"";display:block;block-size:100%;background:var(--g-color-surface);transform-origin:0 50%;scale:var(--_left,1) 1}
[dir=rtl] .drain::before{transform-origin:100% 50%}

/* =====================================================================
   C · TITULAR: lengüeta colgada del borde con un contador por tipo; lo nuevo se lee como titular y se recoge en su cifra.
   ===================================================================== */
.isle[data-c=C]{inset-block-start:calc(env(safe-area-inset-top) + var(--g-space-16))}
.isle[data-c=C] .isle__shape{border-start-start-radius:0;border-start-end-radius:0;border-end-start-radius:var(--g-radius-xl);border-end-end-radius:var(--g-radius-xl)}
.isle[data-c=C][data-form=open] .isle__shape{border-start-start-radius:0;border-start-end-radius:0}
.ctrs{display:inline-flex;gap:var(--g-space-3);align-items:center}
.ctr{display:inline-flex;align-items:center;gap:var(--g-space-1);font-variant-numeric:tabular-nums;font-weight:var(--g-text-action-weight)}
.ctr .badge{--_s:calc(var(--g-space-1) * 6)}
.ctr[data-seen] .badge{background:transparent;color:var(--g-color-surface);outline-style:solid}
.num{display:inline-block;min-inline-size:1ch}
.num.is-roll{animation:x-roll var(--g-duration-slow) var(--g-ease-spring)}
@keyframes x-roll{from{translate:0 -60%;opacity:0}}
.headline{display:inline-flex;align-items:center;gap:var(--g-space-2);min-inline-size:0}
.headline .isle__text{max-inline-size:calc(var(--_open) - calc(var(--g-space-1) * 24))}
.go{font-size:var(--g-text-body-sm-size);text-decoration:underline;text-underline-offset:0.2em;white-space:nowrap}
.isle.is-slide .isle__shape{animation:x-slide var(--g-duration-press) var(--g-ease-out)}
@keyframes x-slide{from{translate:0 -100%}}
.hidden-h{margin:var(--g-space-2) 0 0;padding-inline-start:var(--g-space-2);font-size:var(--g-text-body-sm-size);font-weight:var(--g-text-action-weight)}

@media (prefers-reduced-motion:reduce){
  .isle.is-ready .isle__shape{transition:none}
  .isle.is-drop .isle__shape,.isle.is-nudge .isle__shape,.isle.is-slide .isle__shape{animation:x-fade var(--g-duration-fast) var(--g-ease-standard)}
  .isle.is-ring .badge,.num.is-roll,.badge.is-busy .g-icon{animation:none}
  .isle__chev{transition:none}
  .drain{display:none}
}
@media (forced-colors:active){.isle__shape,.badge,.mark{border-color:CanvasText;outline-color:CanvasText}}
</style>
</head>
<body>
<header class="sh-bar">
  <span class="sh-brand">Isla de estado · r03</span>
  <nav class="sh-pick" aria-label="Concepto">
    <a href="?c=A" id="pick-A">A · Hilo</a><a href="?c=B" id="pick-B">B · Punto que habla</a><a href="?c=C" id="pick-C">C · Titular</a>
  </nav>
</header>
<main>
  <h1 id="ref-h1">Facturas</h1>
  <p class="lead" id="lead"></p>
  <section class="card" id="form-card">
    <h2>Nueva factura</h2>
    <form id="form" aria-label="Factura" onsubmit="return false">
      <div class="x-field"><label for="cliente">Cliente</label><input id="cliente" value="Clínica Norte"></div>
      <div class="x-actions" id="actions">
        <button type="button" class="mark" id="mark-save" hidden></button>
        <button type="submit" class="btn btn--solid" id="save">Guardar</button>
      </div>
    </form>
  </section>
  <section class="card" id="ref-table" aria-label="Últimas facturas">
    <h2>Últimas facturas</h2>
    <ul class="x-rows"><li id="ref-row1"><span>F-0040 · Clínica Norte</span><span>$1,200</span></li><li><span>F-0041 · Laboratorio Sur</span><span>$860</span></li></ul>
  </section>
  <div class="sim" id="sim">
    <strong>Simular (la aplicación)</strong>
    <label><input type="checkbox" id="fails" checked> El servidor falla al guardar</label>
    <button class="btn btn--sm" id="s-offline">Sin conexión</button>
    <button class="btn btn--sm" id="s-online">Vuelve la conexión</button>
    <button class="btn btn--sm" id="s-maint">Mantenimiento</button>
    <button class="btn btn--sm" id="s-leave">Salir del formulario</button>
    <button class="btn btn--sm" id="s-back">Volver al formulario</button>
    <button class="btn btn--sm" id="s-clear">Quitar todas</button>
  </div>
  <p class="note" id="explain"></p>
</main>
<div class="isle" id="isle" data-form="empty">
  <section class="isle__shape" aria-label="Estado de la aplicación (Alt+F8)" hidden>
    <div class="isle__inner">
      <button class="isle__summary" id="isle-summary" type="button" aria-expanded="false" aria-controls="isle-panel" aria-keyshortcuts="Alt+F8"></button>
      <div class="isle__panel" id="isle-panel" hidden></div>
    </div>
  </section>
  <span class="isle__tip" aria-hidden="true"></span>
</div>
<script src="../../lucide-icons.js"></script>
<script src="./base.js"></script>
<script>
(function () {
  const B = window.Base
  const q = new URLSearchParams(location.search)
  const C = (q.get('c') || 'B').toUpperCase()
  document.getElementById('pick-' + C).setAttribute('aria-current', 'page')
  const LEAD = {
    A: 'A · Hilo. Lo que nace de un control sale de él y vuelve a él. Nada se abre solo; la isla aterriza replegada con el título a la vista. Resuelto, vuelve a su marca y se va. Sin punto: la memoria queda junto al origen, y lo que la persona oculta no se pierde.',
    B: 'B · Punto que habla. La isla de hoy, explicada: nace del borde, se abre en dos tiempos, se recoge sola cuando la persona no la usa (con una línea que lo enseña), «Replegar» a la vista, y el punto lleva cuenta y pista.',
    C: 'C · Titular. Una lengüeta colgada del borde con una cifra por tipo. Lo nuevo se lee como titular unos segundos y se recoge en su cifra; nada se abre solo. «Visto» y «Ocultar» son de la persona; lo vigente sigue contado.'
  }
  document.getElementById('lead').textContent = LEAD[C]
  const READ = B.T || { A: 6000, B: 8000, C: 6000 }[C]
  const isle = document.getElementById('isle'); isle.dataset.c = C
  const shape = isle.querySelector('.isle__shape')
  const inner = isle.querySelector('.isle__inner')
  const summary = document.getElementById('isle-summary')
  const panel = document.getElementById('isle-panel')
  const tip = isle.querySelector('.isle__tip')
  const mark = document.getElementById('mark-save')
  let open = false, auto = false, headline = null, saved = null
  const I = B.icon, E = B.esc

  // ---------- lectura con pausa (B: recoger la abierta sola; A: volver a la marca; C: recoger el titular) ----------
  const reads = new Map()
  function startRead (key, ms, done) {
    stopRead(key)
    const r = { left: ms, total: ms, done, t: performance.now() }
    reads.set(key, r)
    r.iv = setInterval(() => {
      const now = performance.now(), dt = now - r.t; r.t = now
      const paused = isle.matches(':hover') || isle.contains(document.activeElement) || (C === 'A' && mark.matches(':hover,:focus'))
      isle.dataset.paused = paused ? 'true' : 'false'
      if (!paused) r.left -= dt
      if (key === 'open') isle.style.setProperty('--_left', Math.max(0, r.left / r.total).toFixed(3))
      if (r.left <= 0) { stopRead(key); done() }
    }, 50)
  }
  function stopRead (key) {
    const r = reads.get(key); if (!r) return
    clearInterval(r.iv); reads.delete(key)
    if (key === 'open') isle.style.removeProperty('--_left')
    if (!reads.size) delete isle.dataset.paused
  }
  const stopAll = () => [...reads.keys()].forEach(stopRead)
  // Un resultado sin enlace se lee y se va (en los tres); con enlace se queda hasta que la persona lo ve
  function readResult (c) {
    startRead('res-' + c.id, READ, () => { const n = B.conds.get(c.id); if (n && n.type === 'success' && !n.link) B.remove(c.id, 'read') })
  }

  // ---------- Pintar ----------
  const vis = () => B.list((c) => !c.hidden)
  function summaryHTML (items) {
    const first = items[0]
    const n = items.length
    const sr = `<span class="sr">Estado: ${n} ${n === 1 ? 'aviso' : 'avisos'}. ${B.TYPES[first.type]}: </span>`
    const badge = `<span class="badge${first.busy ? ' is-busy' : ''}" data-type="${first.type}" aria-hidden="true">${I(first.busy ? 'loader-circle' : B.ICON[first.type])}${C === 'B' && n > 1 ? `<span class="count">${n}</span>` : ''}</span>`
    const more = n > 1 ? `<span class="isle__more"><span aria-hidden="true">+${n - 1}</span><span class="sr"> y ${n - 1} más</span></span>` : ''
    if (C === 'C') {
      if (headline && B.conds.has(headline)) {
        const h = B.conds.get(headline)
        return `<span class="headline"><span class="badge" data-type="${h.type}" aria-hidden="true">${I(B.ICON[h.type])}</span><span class="isle__text"><span class="sr">Estado: ${n} ${n === 1 ? 'aviso' : 'avisos'}. Nuevo, </span>${B.TYPES[h.type]}: ${E(h.title)}</span><span class="go" aria-hidden="true">Ver</span></span>`
      }
      const by = {}
      for (const c of B.list()) { (by[c.type] = by[c.type] || []).push(c) }
      const names = { error: ['error', 'errores'], warning: ['advertencia', 'advertencias'], info: ['información', 'informaciones'], success: ['resultado', 'resultados'] }
      const parts = Object.keys(by).map((t) => { const k = by[t].length; return `${k} ${names[t][k === 1 ? 0 : 1]}${by[t].every((c) => c.seen) ? ' vistos' : ''}` })
      return `<span class="sr">Estado: ${parts.join(', ')}.</span><span class="ctrs" aria-hidden="true">${Object.keys(by).map((t) => `<span class="ctr" data-type="${t}"${by[t].every((c) => c.seen) ? ' data-seen' : ''}><span class="badge" data-type="${t}">${I(B.ICON[t])}</span><span class="num" data-n="${by[t].length}">${by[t].length}</span></span>`).join('')}</span><span class="isle__chev" aria-hidden="true">${I('chevron-down')}</span>`
    }
    return `${badge}<span class="isle__text">${sr}${E(first.title)}</span>${more}<span class="isle__chev" aria-hidden="true">${I('chevron-down')}</span>`
  }
  function itemHTML (c) {
    const a = []
    if (c.action) a.push(`<button type="button" class="ibtn" data-do="act"${c.busy ? ' aria-disabled="true"' : ''}>${E(c.busy ? (c.action.busyLabel || c.action.label) : c.action.label)}</button>`)
    if (c.link) a.push(`<a class="ibtn ibtn--quiet" href="${E(c.link.href)}" data-do="link">${E(c.link.label)}</a>`)
    if (c.origin && c.type !== 'success') a.push(`<button type="button" class="ibtn ibtn--quiet" data-do="origin">${E(c.origin.label)}</button>`)
    if (C === 'A' && c.type !== 'success' && (c.origin || c.dismissible)) a.push(`<button type="button" class="ibtn ibtn--quiet" data-do="hide" aria-label="Ocultar: ${E(c.title)}">Ocultar</button>`)
    if (C === 'C' && !c.hidden && !c.seen && c.type !== 'success') a.push(`<button type="button" class="ibtn ibtn--quiet" data-do="seen" aria-label="Visto: ${E(c.title)}">Visto</button>`)
    if (C === 'C' && c.type !== 'success') a.push(c.hidden ? `<button type="button" class="ibtn ibtn--quiet" data-do="show" aria-label="Mostrar: ${E(c.title)}">Mostrar</button>` : `<button type="button" class="ibtn ibtn--quiet" data-do="hide" aria-label="Ocultar: ${E(c.title)}">Ocultar</button>`)
    if (C !== 'A' && c.dismissible) a.push(`<button type="button" class="ibtn ibtn--quiet" data-do="dismiss" aria-label="Descartar: ${E(c.title)}">${I('x')}</button>`)
    const note = C === 'B' && c.persistent && !c.dismissible ? `<p class="item__note">Se quitará sola cuando se resuelva.</p>` : ''
    return `<li class="item${c.hidden ? ' is-hidden' : ''}" data-id="${E(c.id)}" data-type="${c.type}"${c.busy ? ' aria-busy="true"' : ''}>
      <span class="badge${c.busy ? ' is-busy' : ''}" data-type="${c.type}" aria-hidden="true">${I(c.busy ? 'loader-circle' : B.ICON[c.type])}</span>
      <div><p class="item__title"><span class="sr">${B.TYPES[c.type]}: </span>${E(c.title)}</p>${c.description ? `<p class="item__desc">${E(c.description)}</p>` : ''}${note}</div>
      ${a.length ? `<div class="item__actions">${a.join('')}</div>` : ''}</li>`
  }
  function panelHTML () {
    const shown = vis(), hidden = B.list((c) => c.hidden)
    const close = C === 'C' ? `<button type="button" class="ibtn" data-do="close">${I('x')} Cerrar</button>` : `<button type="button" class="ibtn" data-do="close"><span class="isle__chev" style="rotate:180deg">${I('chevron-down')}</span> Replegar</button>`
    let h = `<div class="panel__head"><span class="panel__title" aria-hidden="true">Estado</span>${close}</div><ul class="items">${shown.map(itemHTML).join('')}</ul>`
    if (C === 'C' && hidden.length) h += `<p class="hidden-h">Ocultos (${hidden.length})</p><ul class="items">${hidden.map(itemHTML).join('')}</ul>`
    if (C === 'B') h += `<div class="isle__foot"><p>${auto ? 'Se recoge sola si no la usas.' : 'Lo que siga vigente queda arriba.'}</p><button type="button" class="ibtn" data-do="ack">Entendido</button></div>${auto ? '<div class="drain" aria-hidden="true"></div>' : ''}`
    if (C === 'C' && shown.some((c) => !c.seen && c.type !== 'success')) h += `<div class="isle__foot"><span></span><button type="button" class="ibtn" data-do="seenall">Todo visto</button></div>`
    return h
  }
  function formOf () {
    const items = vis()
    if (!items.length && !(C === 'C' && open)) return 'empty'
    if (open) return 'open'
    if (C === 'B' && items.every((c) => c.ack)) return 'dot'
    if (C === 'C') return headline ? 'headline' : 'tab'
    return 'compact'
  }
  function paintMark () {
    const c = B.conds.get('save')
    if (!c || !document.getElementById('save')) { mark.hidden = true; return }
    mark.hidden = false
    mark.dataset.type = c.type
    mark.setAttribute('aria-expanded', String(open))
    mark.innerHTML = `<span class="badge${c.busy ? ' is-busy' : ''}" data-type="${c.type}" aria-hidden="true">${I(c.busy ? 'loader-circle' : B.ICON[c.type])}</span><span><span class="sr">${B.TYPES[c.type]}: </span>${c.type === 'success' ? 'Guardada' : c.busy ? 'Reintentando…' : 'No se guardó'}</span>`
  }
  let lastForm = 'empty'
  // r03 base: el tamaño se mide ANTES de mostrar; nacer nunca pinta la superficie sin tamaño (defecto 1 del real)
  function paint ({ birth } = {}) {
    const keepFocus = isle.contains(document.activeElement) ? document.activeElement : null
    const focusKey = keepFocus && (keepFocus === summary ? 'summary' : keepFocus.closest('[data-id]') && keepFocus.dataset.do ? keepFocus.closest('[data-id]').dataset.id + '|' + keepFocus.dataset.do : null)
    const form = formOf()
    isle.dataset.form = form
    paintMark()
    if (form === 'empty') {
      shape.hidden = true; panel.hidden = true; lastForm = form
      if (keepFocus) (saved && saved.isConnected ? saved : B.neighbour(document.getElementById('sim'))).focus()
      return
    }
    const items = vis()
    summary.innerHTML = summaryHTML(items.length ? items : B.list())
    summary.setAttribute('aria-expanded', String(form === 'open'))
    panel.hidden = form !== 'open'
    panel.innerHTML = form === 'open' ? panelHTML() : ''
    const wasHidden = shape.hidden
    if (wasHidden) { isle.classList.add('no-tr'); shape.style.visibility = 'hidden'; shape.hidden = false }
    const w = inner.offsetWidth, h = inner.offsetHeight
    shape.style.setProperty('--_w', w + 2 * borderW() + 'px')
    shape.style.setProperty('--_h', h + 2 * borderW() + 'px')
    if (wasHidden) { void shape.offsetWidth; shape.style.visibility = ''; requestAnimationFrame(() => isle.classList.remove('no-tr')) }
    // tip del punto (B): visual, aria-hidden; el nombre accesible ya lo dice
    if (C === 'B') { const n = items.length, f = items[0]; tip.textContent = form === 'dot' ? `${n === 1 ? '1 aviso sigue vigente' : n + ' avisos siguen vigentes'}: ${f.title} · pulsa para ver` : '' }
    // foco: si el control con foco desapareció, al resumen (nunca a body)
    if (keepFocus && !keepFocus.isConnected) {
      let back = null
      if (focusKey && focusKey !== 'summary') { const [id, d] = focusKey.split('|'); back = panel.querySelector(`[data-id="${CSS.escape(id)}"] [data-do="${d}"]`) }
      ;(back || summary).focus()
    }
    if (birth) birthOf(birth)
    lastForm = form
  }
  const borderW = () => parseFloat(getComputedStyle(shape).borderTopWidth) || 0
  function play (cls) {
    isle.classList.remove('is-drop', 'is-fade', 'is-nudge', 'is-slide', 'is-ring')
    void isle.offsetWidth
    isle.classList.add(cls)
    setTimeout(() => isle.classList.remove(cls), 800)
  }
  function birthOf (kind) {
    if (kind === 'flight' && !B.reduced() && !mark.hidden && mark.getClientRects().length) return fly(mark, shape, false)
    if (kind === 'flight' || kind === 'drop') return play(B.reduced() ? 'is-fade' : 'is-drop')
    if (kind === 'slide') return play(B.reduced() ? 'is-fade' : 'is-slide')
    if (kind === 'nudge') return B.reduced() ? null : play('is-nudge')
    if (kind === 'ring') return B.reduced() ? null : play('is-ring')
  }
  // A: la superficie sale de la marca y viaja al borde (o vuelve). Clon aria-hidden; transform y opacidad, nada de layout.
  function fly (from, to, back, done) {
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect()
    const f = document.createElement('div')
    f.className = 'flight'; f.setAttribute('aria-hidden', 'true')
    Object.assign(f.style, { left: b.left + 'px', top: b.top + 'px', width: b.width + 'px', height: b.height + 'px' })
    document.body.append(f)
    const sx = a.width / b.width, sy = a.height / b.height
    const k0 = { transform: `translate(${a.left - b.left}px, ${a.top - b.top}px) scale(${sx}, ${sy})`, opacity: 1 }
    const k1 = { transform: 'none', opacity: 1 }
    to.style.opacity = back ? '' : '0'
    const anim = f.animate(back ? [k1, { ...k0, opacity: 0.4 }] : [k0, k1], { duration: 240, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', transformOrigin: '0 0' })
    f.style.transformOrigin = '0 0'
    if (back) to.style.opacity = '0'
    anim.onfinish = () => { f.remove(); if (!back) to.style.opacity = ''; if (done) done() }
  }

  // ---------- Abrir / cerrar ----------
  function setOpen (v, { focus = false, isAuto = false } = {}) {
    open = v; auto = v && isAuto
    if (!v) { auto = false; stopRead('open'); if (C === 'C') B.list((c) => c.type === 'success').forEach((c) => B.conds.delete(c.id)) }
    if (v && C === 'C') { headline = null; stopRead('headline') }
    paint()
    if (v && focus) summary.focus()
    if (v && auto && C === 'B') startRead('open', READ, () => { if (open && auto) setOpen(false) })
  }
  function covers () {
    const a = B.actor()
    if (!a) return false
    const r = a.getBoundingClientRect()
    const prev = open; open = true; isle.classList.add('no-tr'); paint(); const s = shape.getBoundingClientRect(); open = prev; paint(); requestAnimationFrame(() => isle.classList.remove('no-tr'))
    return !(r.right <= s.left || r.left >= s.right || r.bottom <= s.top || r.top >= s.bottom)
  }

  // ---------- Sucesos del modelo ----------
  B.on((ev) => {
    if (!B.mounted) { paint(); return }
    const before = lastForm
    if (ev.kind === 'remove' || ev.kind === 'state') {
      if (!B.conds.size) { open = false; stopAll(); headline = null }
      if (headline && !B.conds.has(headline)) { headline = null }
      paint(); return
    }
    const c = B.conds.get(ev.id)
    if (C === 'A') {
      if (c.type === 'success' && c.origin) {
        // resuelto: se lee aquí arriba y vuelve a su marca
        paint()
        startRead('return', READ, () => {
          if (!B.conds.has(c.id) || B.conds.get(c.id).type !== 'success') return
          if (open) { open = false; paint() }
          // vuelve a su marca: la condición queda oculta en la isla y viva junto al origen («Guardada»), hasta que el origen se va
          const done = () => B.patch(c.id, { hidden: true })
          if (B.reduced() || mark.hidden) return done()
          fly(mark, shape, true, () => { shape.style.opacity = ''; done() })
        })
        return
      }
      paint({ birth: before === 'empty' ? (c.origin ? 'flight' : 'drop') : (c.origin ? 'flight' : 'nudge') })
      if (c.type === 'success') readResult(c)
      return
    }
    if (C === 'B') {
      const wasDot = before === 'dot'
      paint({ birth: before === 'empty' ? 'drop' : wasDot ? 'ring' : (ev.kind !== 'change' || ev.typeChanged ? 'nudge' : null) })
      if (ev.toError && !open && !B.mobile() && !covers()) {
        // dos tiempos: primero la píldora (de dónde sale), luego se abre
        const wait = before === 'empty' && !B.reduced() ? 360 : 0
        setTimeout(() => { if (B.conds.has(ev.id) && !open) setOpen(true, { isAuto: true }) }, wait)
      }
      if (c.type === 'success') readResult(c)
      return
    }
    // C: titular
    if (open) { paint(); return }
    if (ev.kind === 'change' && !ev.typeChanged && c.type !== 'success') { paint(); return }
    headline = ev.id
    paint({ birth: before === 'empty' ? 'slide' : 'nudge' })
    startRead('headline', READ, () => {
      headline = null
      const n0 = B.conds.get(c.id); if (n0 && n0.type === 'success' && !n0.link) B.conds.delete(c.id)
      paint()
      const n = summary.querySelector(`.ctr[data-type="${c.type}"] .num`)
      if (n && !B.reduced()) { n.classList.add('is-roll'); setTimeout(() => n.classList.remove('is-roll'), 600) }
    })
  })

  // ---------- Interacción ----------
  summary.addEventListener('click', () => setOpen(!open))
  panel.addEventListener('click', (e) => {
    const t = e.target.closest('[data-do]'); if (!t) return
    const li = t.closest('[data-id]'); const id = li && li.dataset.id
    const d = t.dataset.do
    if (d === 'close') { setOpen(false); summary.focus() }
    else if (d === 'act') { if (t.getAttribute('aria-disabled') !== 'true') B.act(id) }
    else if (d === 'origin') { const c = B.conds.get(id); setOpen(false); const el = document.getElementById(c.origin.target); if (el) { if (!el.matches('a,button,input,[tabindex]')) el.tabIndex = -1; el.focus(); el.scrollIntoView({ block: 'nearest' }) } }
    else if (d === 'hide') { B.patch(id, { hidden: true }); if (!vis().length) { open = false; paint(); (mark.hidden ? (saved && saved.isConnected ? saved : B.neighbour(document.getElementById('sim'))) : mark).focus() } }
    else if (d === 'show') B.patch(id, { hidden: false })
    else if (d === 'seen') B.patch(id, { seen: true })
    else if (d === 'seenall') { vis().forEach((c) => { c.seen = true }); paint() }
    else if (d === 'dismiss') B.remove(id, 'dismiss')
    else if (d === 'ack') {
      for (const c of B.list()) { if (c.persistent) c.ack = true; else B.conds.delete(c.id) }
      open = false; auto = false; stopRead('open'); paint()
      if (isle.contains(document.activeElement) || !document.activeElement || document.activeElement === document.body) (shape.hidden ? B.neighbour(document.getElementById('sim')) : summary).focus()
    }
    else if (d === 'link') { e.preventDefault(); setOpen(false) }
  })
  isle.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && open) { e.preventDefault(); e.stopPropagation(); setOpen(false); summary.focus() }
  })
  document.addEventListener('pointerdown', (e) => { if (open && !isle.contains(e.target) && !mark.contains(e.target)) setOpen(false) }, true)
  document.addEventListener('keydown', (e) => {
    if (!B.hotkey(e) || !B.conds.size) return
    e.preventDefault()
    if (isle.contains(document.activeElement)) { setOpen(false); (saved && saved.isConnected ? saved : B.neighbour(document.getElementById('sim'))).focus(); return }
    saved = document.activeElement
    B.list().forEach((c) => { if (C !== 'C') c.hidden = false })
    setOpen(true, { focus: true })
  })
  mark.addEventListener('click', () => {
    saved = mark
    const c = B.conds.get('save'); if (!c) return
    c.hidden = false
    setOpen(true)
    const li = panel.querySelector('[data-id="save"]')
    const target = li && (li.querySelector('[data-do=act]:not([aria-disabled=true])') || li.querySelector('[data-do]'))
    ;(target || summary).focus()
  })

  // ---------- La aplicación de ejemplo ----------
  const wait = (ms) => new Promise((r) => setTimeout(r, ms))
  const fails = document.getElementById('fails')
  const saveReq = () => wait(700).then(() => { if (fails.checked) throw new Error('500'); return { type: 'success', title: 'Factura guardada con el folio F-0042', description: '', details: undefined, action: undefined, link: { label: 'Ver factura', href: '#f-0042' } } })
  function onSave () {
    if (!fails.checked) { B.set('save', { type: 'success', title: 'Factura guardada con el folio F-0042', description: '', action: undefined, link: { label: 'Ver factura', href: '#f-0042' }, origin: { label: 'Ir al formulario', target: 'form' } }); return }
    if (B.conds.has('save') && B.conds.get('save').type === 'error') { B.again('save'); return }
    B.set('save', { type: 'error', title: 'No se pudo guardar la factura', description: 'El servidor no respondió; tus datos siguen en el formulario.', action: { label: 'Reintentar', busyLabel: 'Reintentando…', onClick: saveReq }, origin: { label: 'Ir al formulario', target: 'form' } })
  }
  document.getElementById('form').addEventListener('submit', onSave)
  document.getElementById('s-offline').onclick = () => B.set('offline', { type: 'warning', title: 'Sin conexión', description: 'Los cambios se guardarán al volver.' })
  document.getElementById('s-online').onclick = () => B.resolve('offline', 'Conexión restablecida')
  document.getElementById('s-maint').onclick = () => B.set('maint', { type: 'info', title: 'Mantenimiento esta noche', description: 'De 23:00 a 23:30 no se podrá guardar.', dismissible: true })
  const card = document.getElementById('form-card'); const cardParent = card.parentNode; const cardNext = card.nextSibling
  document.getElementById('s-leave').onclick = () => card.remove()
  document.getElementById('s-back').onclick = () => { if (!card.isConnected) cardParent.insertBefore(card, cardNext) }
  document.getElementById('s-clear').onclick = () => { [...B.conds.keys()].forEach((id) => B.remove(id, 'clear')) }
  const EXPLAIN = {
    A: 'Prueba: Guardar (falla) → la cápsula sale de «No se guardó» y aterriza arriba, replegada. Ábrela; «Replegar» o «Ocultar» (la marca sigue junto al botón). Desmarca el fallo y «Reintentar»: se lee arriba y vuelve a su marca. «Salir del formulario» retira lo que nació ahí.',
    B: 'Prueba: Guardar (falla) → nace del borde y, un instante después, se abre; la línea inferior se vacía y se recoge sola (se detiene con el puntero o el foco dentro). «Entendido» → punto con cuenta; pasa el puntero o enfócalo.',
    C: 'Prueba: Guardar (falla) → la lengüeta baja del borde con el titular y, a los segundos, se recoge en su cifra. Púlsala: «Visto», «Ocultar», «Cerrar». Lo vigente sigue contado.'
  }
  document.getElementById('explain').textContent = EXPLAIN[C]
  window.__S = { B, C, setOpen, get open () { return open }, get headline () { return headline }, READ, paint }
  if (q.get('seed') === '1') B.set('maint', { type: 'info', title: 'Mantenimiento esta noche', description: 'De 23:00 a 23:30 no se podrá guardar.', dismissible: true })
  B.mount(isle)
  paint()
  requestAnimationFrame(() => requestAnimationFrame(() => isle.classList.add('is-ready')))
})()
</script>
</body>
