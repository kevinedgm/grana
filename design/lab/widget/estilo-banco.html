<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widgets · banco de pruebas de estilo (coco)</title>
<!-- Banco de coco: marcado exacto de design/contracts/widget.md y widget-grid.md con el CSS real y el tema por defecto.
     Incluye un motor mínimo (niveles, estados, menú, rejilla con puntero y teclado) que imita lo que hará bruno. No es documentación.
     Los gráficos y el contenido de la aplicación se estilizan aquí con clases bk-*. -->
<link rel="stylesheet" href="../../../packages/vue/src/styles/defaults.css">
<link rel="stylesheet" href="../../../packages/vue/src/components/GWidget/GWidget.css?v=2" id="css-w">
<link rel="stylesheet" href="../../../packages/vue/src/components/GMenu/GMenu.css?v=1">
<link rel="stylesheet" href="../../../packages/vue/src/components/GMetric/GMetric.css?v=1">
<link rel="stylesheet" href="../../../packages/vue/src/components/GProgress/GProgress.css?v=1">
<link rel="stylesheet" href="../../../packages/vue/src/components/GDataList/GDataList.css?v=1">
<link rel="stylesheet" href="../../../packages/vue/src/components/GWidgetGrid/GWidgetGrid.css?v=1">
<style id="theme"></style>
<style>
  body{margin:0;padding:24px;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  h2{font-size:15px;margin:28px 0 10px} .cap{font-size:12px;color:var(--g-color-text-muted);margin:0 0 6px}
  .ctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:10px;font-size:13px}
  .row{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
  .frame{resize:both;overflow:auto;border:1px dashed var(--g-color-border-strong);padding:8px;background:var(--g-color-surface-sunken);min-inline-size:160px;min-block-size:120px;max-inline-size:100%}
  .bk-btn{min-height:28px;padding:0 12px;border:1px solid var(--g-color-border-control);border-radius:8px;background:var(--g-color-surface);color:inherit;font:inherit;font-size:13px;cursor:pointer}
  .bk-btn:focus-visible{outline:var(--g-focus-width) solid var(--g-color-focus);outline-offset:2px}
  .sr{position:absolute;inline-size:1px;block-size:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .log{font:12px ui-monospace,monospace;background:var(--g-color-surface);border:1px solid var(--g-color-border);padding:8px;min-height:40px;max-height:100px;overflow:auto;white-space:pre-wrap}
  .states-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));grid-auto-rows:220px;gap:16px}
  /* contenido de la aplicación (gráficos simulados y diseño interno) */
  .bk-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:12px}
  .bk-2col{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-block-size:0}
  .g-widget--shape-tall .bk-2col{grid-template-columns:1fr}
  .bk-spark{inline-size:100%;block-size:36px} .bk-spark polyline{fill:none;stroke:var(--g-color-text);stroke-width:1.6}
  .bk-bars{display:flex;align-items:flex-end;gap:4px;flex:1;min-block-size:56px}
  .bk-bars i{flex:1;background:var(--g-color-border-strong);border-radius:3px 3px 0 0} .bk-bars i:last-child{background:var(--g-color-text)}
  .g-widget__icon svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .g-widget-grid__grab svg,.g-widget-grid__resize svg{display:none}
  .g-widget__menu svg{display:none}
</style>
</head>
<body>
<button id="theme-btn" type="button" class="bk-btn">Tema de prueba</button>
<h2>1 · Un widget, tres niveles (arrastra la esquina del marco)</h2>
<p class="cap">Nivel actual: <b id="lvl">—</b></p>
<div class="frame" id="frame" style="inline-size:420px;block-size:300px"><div id="w-demo" style="block-size:100%"></div></div>
<h2>2 · Cinco widgets en tres niveles</h2>
<div class="row" id="sizes"></div>
<h2>3 · Estados</h2>
<div class="states-grid" id="states"></div>
<h2>4 · Rejilla</h2>
<div class="ctl"><label>Ancho <input type="range" id="gw" min="320" max="1100" value="1000"><output id="gwo">1000px</output></label>
  <button type="button" class="bk-btn" id="edit" aria-pressed="false">Editar disposición</button><button type="button" class="bk-btn" id="reset">Restablecer</button><span class="cap" id="cols" style="margin:0"></span></div>
<div id="gridframe" style="inline-size:1000px;max-inline-size:100%;border:1px dashed var(--g-color-border-strong);padding:12px;background:var(--g-color-surface-sunken)"><div class="g-widget-grid g-widget-grid--density-default" id="gridwrap"><ul class="g-widget-grid__list" id="grid" role="list" aria-label="Panel" style="--_cols:4"></ul><div class="g-widget-grid__sr" role="status" aria-live="polite" id="live"></div></div></div>
<p class="cap" style="margin-top:8px">Layout:</p><div class="log" id="layout"></div>
<h2>Registro</h2><div class="log" id="log">—</div>
<script>
const log=t=>{const l=document.getElementById('log');l.textContent=t+'\n'+(l.textContent==='—'?'':l.textContent)}
const say=t=>{const l=document.getElementById('live');l.textContent='';setTimeout(()=>{l.textContent=t},30);log('anuncio: '+t)}
const P={chart:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',table:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/>',dots:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',move:'<path d="M5 9h14M5 15h14"/>',size:'<path d="M15 21h6v-6M9 3H3v6M21 3l-7 7M3 21l7-7"/>'}
const svg=n=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${P[n]}</svg>`
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))
/* ---------- Primitivas (marcado) ---------- */
const metric=(o,size)=>`<div class="g-metric g-metric--size-${size||'md'}${o.trend?` g-metric--trend-${o.tone||'neutral'}`:''}"><span class="g-metric__label">${esc(o.label)}</span><span class="g-metric__value">${esc(o.value)}${o.unit?`<span class="g-metric__unit">${esc(o.unit)}</span>`:''}</span>${o.trend?`<span class="g-metric__trend" data-direction="${o.dir||'up'}">${esc(o.trend)}${o.ctx?` <small>${esc(o.ctx)}</small>`:''}</span>`:''}</div>`
const progress=(o)=>`<div class="g-progress g-progress--size-md g-progress--color-brand"><div class="g-progress__row"><span>${esc(o.label)}</span><span>${o.value}%</span></div><div class="g-progress__bar" role="progressbar" aria-valuenow="${o.value}" aria-valuemin="0" aria-valuemax="100" aria-valuetext="${o.value}%" aria-label="${esc(o.label)}"><span class="g-progress__fill" style="--_value:${o.value}%"></span></div></div>`
const dlist=(rows)=>`<ul class="g-data-list">${rows.map((r,i)=>`<li>${r.sw!==false?`<span class="g-data-list__swatch" data-swatch="${i%4}" aria-hidden="true"></span>`:''}<span class="g-data-list__label">${esc(r.label)}</span><span class="g-data-list__value">${esc(r.value)}</span></li>`).join('')}</ul>`
const spark=(pts)=>{const mx=Math.max(...pts),mn=Math.min(...pts);return `<svg class="bk-spark" viewBox="0 0 100 36" preserveAspectRatio="none" role="img" aria-label="Tendencia de los últimos ${pts.length} periodos"><polyline points="${pts.map((v,i)=>`${(i/(pts.length-1)*100).toFixed(1)},${(34-(v-mn)/(mx-mn||1)*30).toFixed(1)}`).join(' ')}"/></svg>`}
const bars=(v)=>`<div class="bk-bars" role="img" aria-label="Ingresos por mes">${v.map(x=>`<i style="height:${x}%"></i>`).join('')}</div>`
/* ---------- Definiciones de widget (contenido de la aplicación, por nivel) ---------- */
const SP=[38,44,41,52,49,60,58,66]
const DEFS={
 revenue:{icon:'chart',eyebrow:'Finanzas',title:'Ingresos',sub:'Últimos 30 días frente al periodo anterior',badge:'Mensual',
  s:()=>metric({label:'Ingresos',value:'$48.2k',trend:'+12%'}),
  m:()=>`${metric({label:'Ingresos',value:'$48.2k',trend:'+12%',ctx:'vs. mes anterior'})}${spark(SP)}`,
  l:(sh)=>`<div class="${sh==='tall'?'':'bk-2col'}"><div style="display:flex;flex-direction:column;gap:10px">${metric({label:'Ingresos',value:'$48.2k',trend:'+12%',ctx:'vs. mes anterior'})}<div class="bk-metrics">${metric({label:'Pedidos',value:'1,204'})}${metric({label:'Ticket medio',value:'$40'})}${metric({label:'Reembolsos',value:'1.8%',trend:'−0.3 pp',dir:'down'})}</div></div>${bars([30,44,38,52,47,60,55,72])}</div>`,
  foot:'Actualizado hace 5 min',link:'Ver detalle'},
 activity:{icon:'pulse',eyebrow:'Equipo',title:'Actividad reciente',sub:'Lo último que pasó hoy',badge:'En vivo',
  s:()=>metric({label:'Eventos hoy',value:'24'}),
  m:()=>dlist([{label:'Ana comentó en «Rediseño»',value:'2 min',sw:false},{label:'Luis cerró un pedido',value:'9 min',sw:false},{label:'Nueva reserva',value:'21 min',sw:false}]),
  l:()=>dlist([{label:'Ana comentó en «Rediseño»',value:'2 min',sw:false},{label:'Luis cerró un pedido',value:'9 min',sw:false},{label:'Nueva reserva de Marta',value:'21 min',sw:false},{label:'Se aprobó el presupuesto',value:'1 h',sw:false},{label:'Carlos subió 3 archivos',value:'2 h',sw:false},{label:'Informe semanal enviado',value:'3 h',sw:false}]),
  foot:'Actualizado hace 1 min',link:'Ver todo'},
 goal:{icon:'target',eyebrow:'Productividad',title:'Meta del trimestre',sub:'Avance frente al objetivo',badge:'Q3',
  s:()=>progress({label:'Avance',value:72}),
  m:()=>`${metric({label:'Avance',value:'72',unit:'%',trend:'+8 pp',ctx:'esta semana'})}${progress({label:'Objetivo',value:72})}`,
  l:()=>`${progress({label:'Ventas',value:72})}${progress({label:'Retención',value:58})}${progress({label:'Nuevos clientes',value:91})}${progress({label:'Soporte',value:40})}`,
  foot:'Cierra el 30 de septiembre',link:'Editar metas'},
 status:{icon:'pulse',eyebrow:'Operaciones',title:'Servicios',sub:'Estado de la plataforma',badge:'2 avisos',
  s:()=>metric({label:'Operativos',value:'5/6'}),
  m:()=>dlist([{label:'API',value:'Operativo'},{label:'Pagos',value:'Degradado'},{label:'Correo',value:'Operativo'}]),
  l:()=>`<div class="bk-2col">${dlist([{label:'API',value:'Operativo'},{label:'Pagos',value:'Degradado'},{label:'Correo',value:'Operativo'},{label:'Búsqueda',value:'Operativo'},{label:'Archivos',value:'Incidente'}])}${metric({label:'Disponibilidad (30 días)',value:'99.94',unit:'%',trend:'−0.02 pp',dir:'down'})}</div>`,
  foot:'Actualizado hace 30 s',link:'Página de estado'},
 orders:{icon:'table',eyebrow:'Operaciones',title:'Pedidos pendientes',sub:'Por atender hoy',badge:'8',
  s:()=>metric({label:'Pendientes',value:'8'}),
  m:()=>dlist([{label:'#1042 · Marta R.',value:'$120',sw:false},{label:'#1043 · Diego P.',value:'$85',sw:false},{label:'#1044 · Sara L.',value:'$210',sw:false}]),
  l:()=>dlist([{label:'#1042 · Marta R. · Envío exprés',value:'$120',sw:false},{label:'#1043 · Diego P. · Recoger',value:'$85',sw:false},{label:'#1044 · Sara L. · Envío',value:'$210',sw:false},{label:'#1045 · Iván T. · Envío',value:'$64',sw:false},{label:'#1046 · Lucía G. · Recoger',value:'$99',sw:false}]),
  foot:'Actualizado hace 3 min',link:'Abrir pedidos'}
}
const EMPTY_TXT={title:'Sin datos todavía',text:'Cuando haya actividad aparecerá aquí.',action:'Configurar'}
/* ---------- Widget ---------- */
let wid=0
class Widget{
  constructor(host,{def,state='populated',id}){this.host=host;this.def=DEFS[def];this.key=def;this.state=state;this.id=id||'w'+(++wid);this.level=null;this.shape=null;this.render();this.ro=new ResizeObserver(()=>this.measure());this.ro.observe(this.host)}
  measure(){const r=this.host.getBoundingClientRect();if(!r.width)return;const lv=r.width<240?'s':r.width<440?'m':'l';const sh=r.width>=r.height*1.9?'wide':r.height>=r.width*1.3&&r.height>=320?'tall':'square';if(lv!==this.level||sh!==this.shape){this.level=lv;this.shape=sh;this.paint()}}
  set(state){this.state=state;this.paint()}
  render(){const d=this.def,id=this.id
    this.host.innerHTML=`<article class="g-widget g-widget--level-m g-widget--shape-square g-widget--state-${this.state} g-widget--density-default" id="${id}" data-level="m" data-shape="square" aria-labelledby="${id}-t">
      <header class="g-widget__head"><span class="g-widget__icon" aria-hidden="true">${svg(d.icon)}</span><div class="g-widget__titles"><span class="g-widget__eyebrow">${esc(d.eyebrow)}</span><h3 class="g-widget__title" id="${id}-t">${esc(d.title)}</h3><p class="g-widget__sub">${esc(d.sub)}</p></div><span class="g-widget__badge g-widget__badge--color-neutral">${esc(d.badge)}</span><button type="button" class="g-widget__menu" aria-haspopup="menu" aria-expanded="false" aria-controls="${id}-menu" aria-label="Acciones de ${esc(d.title)}"></button><div class="g-menu__list" id="${id}-menu" role="menu" popover="manual" aria-label="Acciones de ${esc(d.title)}"></div></header>
      <div class="g-widget__body"></div><footer class="g-widget__foot"></footer></article>`
    this.el=this.host.querySelector('.g-widget');this.body=this.el.querySelector('.g-widget__body');this.foot=this.el.querySelector('.g-widget__foot');this.menuEl=this.el.querySelector('.g-menu__list')
    this.menuBtn=this.el.querySelector('.g-widget__menu')
    this.menuBtn.addEventListener('click',e=>Menu.toggle(e.currentTarget,this))
    this.menuBtn.addEventListener('keydown',e=>{if(['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){e.preventDefault();Menu.open(e.currentTarget,this,e.key==='ArrowUp'?'last':'first')}})
    this.menuEl.addEventListener('keydown',e=>Menu.key(e));this.menuEl.addEventListener('click',e=>{const it=e.target.closest('[role=menuitem]');if(!it||it.getAttribute('aria-disabled')==='true')return;Menu.choose(it.dataset.a)})}
  paint(){const d=this.def,lv=this.level||'m',sh=this.shape||'square',st=this.state,el=this.el
    el.dataset.level=lv;el.dataset.shape=sh;el.className=`g-widget g-widget--level-${lv} g-widget--shape-${sh} g-widget--state-${st} g-widget--density-default${this.grid&&this.grid.edit?' is-editing':''}`;el.toggleAttribute('aria-busy',st==='loading');if(st==='disabled')el.setAttribute('aria-disabled','true');else el.removeAttribute('aria-disabled')
    document.getElementById('lvl')&&this.host.id==='w-demo'&&(document.getElementById('lvl').textContent=`${lv} · ${sh}`)
    let html='',foot=''
    if(st==='loading'){html=`<span class="g-widget__sr" role="status">Cargando ${esc(d.title)}</span><div class="g-widget__skeleton" aria-hidden="true">`+(lv==='s'?'<span class="g-widget__line"></span><span class="g-widget__line"></span>':lv==='m'?'<span class="g-widget__line"></span><span class="g-widget__line"></span><span class="g-widget__block"></span>':'<span class="g-widget__line"></span><span class="g-widget__line"></span><span class="g-widget__line"></span><span class="g-widget__line"></span><span class="g-widget__block"></span>')+'</div>';foot=lv==='s'?'':'<span class="g-widget__line" style="inline-size:40%"></span>'}
    else if(st==='empty'){html=`<div class="g-widget__state"><b>${EMPTY_TXT.title}</b><p style="margin:0">${EMPTY_TXT.text}</p><button type="button" class="bk-btn">${EMPTY_TXT.action}</button></div>`}
    else if(st==='error'){html=`<div class="g-widget__state" role="alert"><b>No se pudieron cargar los datos</b><p style="margin:0">Revisa tu conexión e inténtalo de nuevo.</p><button type="button" class="bk-btn" data-act="retry">Reintentar</button></div>`;foot=lv==='s'?'':`<span>${esc(d.foot)}</span>`}
    else{html=d[lv](sh)+(st==='stale'&&lv!=='s'?'<p class="g-widget__stale">Datos desactualizados · última actualización hace 2 h</p>':'');foot=lv==='s'?'':`<span>${st==='stale'?'Desactualizado':esc(d.foot)}</span><a class="g-widget__link" href="#${this.key}" data-act="drill">${esc(d.link)}</a>`}
    this.body.innerHTML=html;this.body.toggleAttribute('inert',st==='disabled');this.foot.innerHTML=foot;this.el.querySelectorAll('.g-widget__eyebrow,.g-widget__sub,.g-widget__badge').forEach(n=>{n.hidden=lv==='s'});this.foot.hidden=lv==='s'||!foot
    const bd=this.el.querySelector('.g-widget__badge');bd.className='g-widget__badge g-widget__badge--color-'+(st==='error'?'danger':st==='stale'?'warning':'neutral');bd.textContent=st==='stale'?'Desactualizado':st==='disabled'?'Deshabilitado':st==='error'?'Error':d.badge
    this.el.querySelectorAll('[data-act=retry]').forEach(b=>b.addEventListener('click',()=>{log('retry → '+d.title)}))
    this.el.querySelectorAll('[data-act=drill]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();log('drilldown → '+d.title+' (la aplicación abre un diálogo, panel o página)')}))
    if(this.grid)this.grid.decorate(this)
  }
}
/* ---------- Menú de acciones (patrón menu button de APG) ---------- */
const Menu={el:null,btn:null,w:null,
  items(w){const g=w.grid;const list=[{a:'refresh',l:'Actualizar'},{a:'config',l:'Configurar',dis:true}]
    if(g&&g.edit){list.push({sep:1},{a:'before',l:'Mover antes',dis:g.index(w)===0},{a:'after',l:'Mover después',dis:g.index(w)===g.items.length-1},{sep:1},{h:'Tamaño'});for(const [k,v] of Object.entries(PRESETS))list.push({a:'size:'+k,l:v.label+' ('+v.w+' × '+v.h+')'});list.push({sep:1},{a:'remove',l:'Quitar'})}
    return list},
  open(btn,w,at='first'){this.close(false);this.btn=btn;this.w=w;const m=this.el=w.menuEl
    m.innerHTML=this.items(w).map(i=>i.sep?'<div class="g-menu__separator" role="separator"></div>':i.h?`<div class="g-menu__group-title" role="presentation">${i.h}</div>`:`<button type="button" class="g-menu__item" role="menuitem" tabindex="-1" data-a="${i.a}" ${i.dis?'aria-disabled="true"':''}><span class="g-menu__label">${esc(i.l)}</span></button>`).join('')
    m.showPopover();btn.setAttribute('aria-expanded','true');const r=btn.getBoundingClientRect()
    m.style.setProperty('--_x',Math.max(8,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-8))+'px');m.style.setProperty('--_y',Math.min(r.bottom+4,innerHeight-m.offsetHeight-8)+'px');m.style.setProperty('--_max','none')
    if(!this._out){this._out=e=>{if(this.el?.matches(':popover-open')&&!this.el.contains(e.target)&&!this.btn?.contains(e.target))this.close(false)};document.addEventListener('pointerdown',this._out)}
    const its=[...m.querySelectorAll('[role=menuitem]')];(at==='last'?its[its.length-1]:its[0]).focus()},
  toggle(btn,w){this.el?.matches(':popover-open')&&this.btn===btn?this.close(true):this.open(btn,w)},
  close(ret){if(!this.el?.matches(':popover-open'))return;this.el.hidePopover();this.btn?.setAttribute('aria-expanded','false');if(ret)this.btn?.focus()},
  key(e){const its=[...this.el.querySelectorAll('[role=menuitem]')],i=its.indexOf(document.activeElement);const f=n=>its[(n+its.length)%its.length].focus()
    if(e.key==='ArrowDown'){e.preventDefault();f(i+1)}else if(e.key==='ArrowUp'){e.preventDefault();f(i-1)}else if(e.key==='Home'){e.preventDefault();f(0)}else if(e.key==='End'){e.preventDefault();f(its.length-1)}
    else if(e.key==='Escape'){e.preventDefault();e.stopPropagation();this.close(true)}else if(e.key==='Tab'){this.close(false)}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();const it=document.activeElement;if(it.getAttribute('aria-disabled')!=='true')this.choose(it.dataset.a)}
    else if(e.key.length===1){const c=its.find(x=>x.textContent.toLowerCase().startsWith(e.key.toLowerCase()));c?.focus()}},
  choose(a){const w=this.w,g=w.grid,btn=this.btn;this.close(false)
    if(a==='refresh'){w.set('loading');setTimeout(()=>{w.set('populated');say(`${w.def.title} actualizado`)},900);btn?.focus()}
    else if(a==='before'){g.move(w,-1,true);g.focusHandle(w,'menu')}else if(a==='after'){g.move(w,1,true);g.focusHandle(w,'menu')}
    else if(a.startsWith('size:')){g.preset(w,a.slice(5));g.focusHandle(w,'menu')}
    else if(a==='remove'){g.remove(w)}else btn?.focus()}
}
/* ---------- Rejilla ---------- */
const PRESETS={s:{label:'Pequeño',w:1,h:1},m:{label:'Mediano',w:2,h:1},l:{label:'Grande',w:2,h:2},wide:{label:'Ancho',w:4,h:1},tall:{label:'Alto',w:1,h:2}}
const DEFAULT_LAYOUT=[{id:'revenue',w:2,h:2},{id:'goal',w:1,h:1},{id:'status',w:1,h:1},{id:'activity',w:2,h:1},{id:'orders',w:2,h:2}]
class Grid{
  constructor(ul,wrap){this.root=wrap;this.ul=ul;this.wrap=wrap;this.items=structuredClone(DEFAULT_LAYOUT);this.widgets=new Map();this.edit=false;this.cols=4;this.grab=null
    this.ro=new ResizeObserver(()=>this.measure());this.ro.observe(wrap);this.measure();this.render()}
  measure(){const w=this.wrap.clientWidth;const c=w>=960?4:w>=560?2:1;if(c!==this.cols){this.cols=c;this.ul.style.setProperty('--_cols',c)}this.ul.style.setProperty('--_cols',this.cols);document.getElementById('cols').textContent=`${this.cols} columna${this.cols>1?'s':''} (contenedor de ${Math.round(w)}px)`;this.layout()}
  index(w){return this.items.findIndex(i=>i.id===w.id)}
  span(i){return Math.min(i.w,this.cols)}
  render(){ // reconcilia: crea lo que falta y quita lo que sobra, sin recrear (se conserva el foco y el estado)
    const ids=new Set(this.items.map(i=>i.id));[...this.ul.children].forEach(li=>{if(!ids.has(li.dataset.id)){this.widgets.get(li.dataset.id)?.ro.disconnect();li.remove()}})
    this.items.forEach(it=>{if(this.ul.querySelector(`li[data-id="${it.id}"]`))return;const li=document.createElement('li');li.className='g-widget-grid__item';li.dataset.id=it.id;const host=document.createElement('div');host.style.blockSize='100%';li.append(host);this.ul.append(li)
      const w=new Widget(host,{def:it.id,id:it.id});w.grid=this;this.widgets.set(it.id,w)})
    this.layout()}
  commitDom(){const a=document.activeElement;this.items.forEach(it=>{const li=this.ul.querySelector(`li[data-id="${it.id}"]`);if(li)this.ul.append(li)});if(a&&a.isConnected&&a!==document.activeElement)a.focus()} // el orden del DOM sigue al visual (2.4.3)
  layout(){this.items.forEach((it,i)=>{const li=this.ul.querySelector(`li[data-id="${it.id}"]`);if(li){li.style.gridColumn=`span ${this.span(it)}`;li.style.gridRow=`span ${it.h}`;li.style.order=i}});this.widgets.forEach(w=>w.grid&&w.level&&this.refreshCtrl(w));document.getElementById('layout').textContent=JSON.stringify(this.items)}
  decorate(w){const li=this.ul.querySelector(`li[data-id="${w.id}"]`);if(!li)return
    if(!li.querySelector('.g-widget-grid__controls')){const c=document.createElement('div');c.className='g-widget-grid__controls';c.innerHTML=`<button type="button" class="g-widget-grid__grab" aria-roledescription="elemento reordenable"></button>`
      const rz=document.createElement('button');rz.type='button';rz.className='g-widget-grid__resize';rz.innerHTML='';li.append(c,rz)
      const g=c.querySelector('.g-widget-grid__grab');g.addEventListener('keydown',e=>this.grabKey(e,w));g.addEventListener('blur',e=>{if(this.grab&&this.grab.id===w.id&&e.relatedTarget&&!li.contains(e.relatedTarget))this.cancel(w,true)})
      g.addEventListener('pointerdown',e=>this.dragStart(e,w));rz.addEventListener('keydown',e=>this.rzKey(e,w));rz.addEventListener('pointerdown',e=>this.rzStart(e,w))}
    this.refreshCtrl(w)}
  refreshCtrl(w){const li=this.ul.querySelector(`li[data-id="${w.id}"]`);if(!li)return;const g=li.querySelector('.g-widget-grid__grab'),rz=li.querySelector('.g-widget-grid__resize');if(!g)return;const it=this.items[this.index(w)],i=this.index(w),held=Boolean(this.grab&&this.grab.id===w.id)
    g.setAttribute('aria-pressed',String(held));g.setAttribute('aria-label',`Mover ${w.def.title}. Posición ${i+1} de ${this.items.length}`)
    rz.setAttribute('aria-label',`Cambiar el tamaño de ${w.def.title}: ${this.span(it)} ${this.span(it)>1?'columnas':'columna'} por ${it.h} ${it.h>1?'filas':'fila'}`);li.classList.toggle('is-grabbed',held)}
  setEdit(on){this.edit=on;this.root.classList.toggle('is-editing',on);this.widgets.forEach(w=>w.paint())}
  focusHandle(w,from){const b=this.ul.querySelector(`li[data-id="${w.id}"] .${from==='menu'?'g-widget__menu':'g-widget-grid__grab'}`);b?.focus()}
  /* mover */
  move(w,d,announce){const i=this.index(w),j=Math.max(0,Math.min(this.items.length-1,i+d));if(i===j)return false;const [it]=this.items.splice(i,1);this.items.splice(j,0,it);this.layout();if(!this.grab)this.commitDom();if(announce)say(`${w.def.title} movido a la posición ${j+1} de ${this.items.length}`);this.emit('move');return true}
  moveTo(w,j){const i=this.index(w);if(i===j)return;const [it]=this.items.splice(i,1);this.items.splice(j,0,it);this.layout();this.emit('move')}
  grabKey(e,w){const k=e.key,i=this.index(w)
    if(k===' '||k==='Enter'){e.preventDefault();if(!this.grab){this.grab={id:w.id,from:i};this.refreshCtrl(w);say(`${w.def.title} recogido. Posición ${i+1} de ${this.items.length}. Usa las flechas para mover, Espacio para soltar, Escape para cancelar.`)}else{const p=this.index(w);this.grab=null;this.commitDom();this.refreshCtrl(w);this.focusHandle(w,'grab');say(`${w.def.title} soltado en la posición ${p+1} de ${this.items.length}`)}}
    else if(this.grab&&['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].includes(k)){e.preventDefault();const d=(k==='ArrowLeft'||k==='ArrowUp')?-1:1;const moved=this.move(w,d,false);this.refreshCtrl(w);say(moved?`Posición ${this.index(w)+1} de ${this.items.length}`:`Ya está en el ${d<0?'inicio':'final'}`)}
    else if(this.grab&&k==='Escape'){e.preventDefault();e.stopPropagation();this.cancel(w,false)}}
  cancel(w,silent){const from=this.grab.from;this.grab=null;this.moveTo(w,from);this.commitDom();const w2=this.widgets.get(w.id);this.refreshCtrl(w2);if(!silent){this.focusHandle(w2,'grab');say(`Movimiento cancelado. ${w.def.title} vuelve a la posición ${from+1}`)}}
  dragStart(e,w){if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();const li=this.ul.querySelector(`li[data-id="${w.id}"]`);li.classList.add('is-dragging');const h=e.currentTarget;try{h.setPointerCapture(e.pointerId)}catch{};const start=this.index(w)
    const mv=ev=>{const t=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('#grid > li');if(!t||t.dataset.id===w.id)return;const j=this.items.findIndex(x=>x.id===t.dataset.id);this.moveTo(w,j)}
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);this.ul.querySelectorAll('.is-dragging').forEach(x=>x.classList.remove('is-dragging'));this.commitDom();this.widgets.forEach(x=>this.refreshCtrl(x));const end=this.index(w);if(end!==start)say(`${w.def.title} movido a la posición ${end+1} de ${this.items.length}`)}
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)}
  /* redimensionar */
  setSize(w,cw,rh,announce=true){const it=this.items[this.index(w)];cw=Math.max(1,Math.min(this.cols,cw));rh=Math.max(1,Math.min(4,rh));if(it.w===cw&&it.h===rh&&this.span(it)===cw)return false;it.w=cw;it.h=rh;this.layout();w.paint();if(announce)say(`${w.def.title}: ${cw} ${cw>1?'columnas':'columna'} por ${rh} ${rh>1?'filas':'fila'}`);this.emit('resize');return true}
  rzKey(e,w){const it=this.items[this.index(w)],cw=this.span(it);const m={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]}[e.key];if(!m)return;e.preventDefault();this.setSize(w,cw+m[0],it.h+m[1])}
  rzStart(e,w){e.preventDefault();const li=this.ul.querySelector(`li[data-id="${w.id}"]`),r=li.getBoundingClientRect(),it=this.items[this.index(w)];const rtl=getComputedStyle(this.ul).direction==='rtl'
    const colW=(this.ul.clientWidth-(this.cols-1)*16)/this.cols+16,rowH=this.ul.querySelector('li').getBoundingClientRect().height/1+16;const w0=this.span(it),h0=it.h,x0=e.clientX,y0=e.clientY;const h=e.currentTarget;try{h.setPointerCapture(e.pointerId)}catch{}
    const mv=ev=>{const dx=(rtl?-1:1)*(ev.clientX-x0),dy=ev.clientY-y0;this.setSize(w,w0+Math.round(dx/colW),h0+Math.round(dy/rowH),false)}
    const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);const n=this.items[this.index(w)];say(`${w.def.title}: ${this.span(n)} columnas por ${n.h} filas`)}
    h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up)}
  preset(w,k){const p=PRESETS[k];this.setSize(w,p.w,p.h,false);say(`${w.def.title}: tamaño ${p.label.toLowerCase()}, ${this.span(this.items[this.index(w)])} × ${p.h}`)}
  remove(w){const i=this.index(w);this.items.splice(i,1);this.widgets.delete(w.id);this.render();this.widgets.forEach(x=>this.refreshCtrl(x));this.emit('remove');say(`${w.def.title} quitado`);const next=this.items[Math.min(i,this.items.length-1)];if(next)this.focusHandle(this.widgets.get(next.id),'menu')}
  emit(why){log('layout ('+why+'): '+JSON.stringify(this.items))}
}
/* ---------- Páginas de muestra ---------- */
const demo=new Widget(document.getElementById('w-demo'),{def:'revenue',id:'demo'})
;(()=>{const box=document.getElementById('sizes');for(const k of Object.keys(DEFS)){const col=document.createElement('div');col.innerHTML=`<p class="cap">${DEFS[k].title}</p><div class="row" style="flex-wrap:nowrap;align-items:stretch"></div>`;const row=col.querySelector('.row');for(const [wpx,hpx] of [[200,140],[340,220],[540,280]]){const f=document.createElement('div');f.style.cssText=`inline-size:${wpx}px;block-size:${hpx}px;flex:none`;row.append(f);new Widget(f,{def:k})}box.append(col)}
  box.style.flexDirection='column'})()
;(()=>{const box=document.getElementById('states');for(const st of ['loading','populated','empty','error','stale','disabled']){const d=document.createElement('div');d.style.cssText='display:flex;flex-direction:column;gap:4px';d.innerHTML=`<span class="cap">${st}</span><div style="flex:1;min-block-size:0"></div>`;box.append(d);new Widget(d.lastElementChild,{def:st==='error'?'status':'goal',state:st})}})()
const grid=new Grid(document.getElementById('grid'),document.getElementById('gridwrap'))
document.getElementById('gw').addEventListener('input',e=>{const v=e.target.value;document.getElementById('gridframe').style.inlineSize=v+'px';document.getElementById('gwo').textContent=v+'px'})
document.getElementById('edit').addEventListener('click',e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';e.currentTarget.setAttribute('aria-pressed',String(on));e.currentTarget.textContent=on?'Terminar edición':'Editar disposición';grid.setEdit(on)})
document.getElementById('reset').addEventListener('click',()=>{grid.items=structuredClone(DEFAULT_LAYOUT);grid.widgets.forEach(w=>w.ro.disconnect());grid.widgets.clear();grid.ul.innerHTML='';grid.render();say('Disposición restablecida')})

const TH=`:root{--g-color-brand:#8A4B08;--g-color-brand-soft:#F6E4D0;--g-color-brand-text:#8A4B08;--g-color-on-brand:#FFFFFF;--g-color-on-brand-soft:#5A3005;--g-color-accent:#0F766E;--g-color-focus:#0F766E;--g-color-bg:#FFF8EC;--g-color-surface:#FFFDF7;--g-color-surface-sunken:#F3E7D3;--g-color-text:#3B2A1A;--g-color-text-muted:#5F4A35;--g-color-text-subtle:#735C44;--g-color-border:#DCC9AC;--g-color-border-strong:#B39B78;--g-color-border-control:#8A7250;--g-radius-sm:2px;--g-radius-md:4px;--g-radius-lg:6px;--g-border-width:2px;--g-focus-width:3px;--g-space-1:5px;--g-font-ui:Georgia,serif}`
let tOn=false;document.getElementById('theme-btn').onclick=()=>{tOn=!tOn;document.getElementById('theme').textContent=tOn?TH:''}
