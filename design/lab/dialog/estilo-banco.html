<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDialog · banco de pruebas de estilo (coco)</title>
<!-- Banco de coco: marcado exacto de design/contracts/dialog.md con el CSS real y el tema por defecto. No es documentación. -->
<link rel="stylesheet" href="../../../packages/vue/src/styles/defaults.css" id="css-d">
<link rel="stylesheet" href="../../../packages/vue/src/components/GBtn/GBtn.css" id="css-b">
<link rel="stylesheet" href="../../../packages/vue/src/components/GDialog/GDialog.css" id="css-g">
<style id="theme"></style>
<style>
  body{margin:0;padding:24px;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  .row{display:flex;flex-wrap:wrap;gap:8px} h1{font-size:20px;margin:0 0 12px}
  label.f{display:grid;gap:4px;font-size:14px;margin-block-end:12px} input.f{min-block-size:36px;border:1px solid var(--g-color-border-control);border-radius:var(--g-radius-sm);padding:0 10px;font:inherit;background:var(--g-color-surface);color:inherit}
</style>
</head>
<body>
<h1>GDialog · banco de estilo</h1>
<div class="row" id="openers"></div>
<div id="host"></div>
<script>
const btn=(t,o={})=>`<button class="g-btn g-btn--variant-${o.v||'outline'} g-btn--color-${o.c||'brand'} g-btn--size-md g-btn--density-default" type="${o.type||'button'}" ${o.attr||''}><span class="g-btn__label">${t}</span></button>`
const close='<button class="g-dialog__close" type="button" aria-label="Cerrar" data-close></button>'
const dlg=(id,cls,inner,attrs='')=>`<dialog class="g-dialog ${cls}" id="d-${id}" aria-labelledby="d-${id}-title" ${attrs}>${inner}</dialog>`
const head=(id,t,desc,o={})=>`<div class="g-dialog__header">${o.icon?'<span class="g-dialog__icon" aria-hidden="true">!</span>':''}<div class="g-dialog__titles"><h2 class="g-dialog__title" id="d-${id}-title">${t}</h2>${desc?`<p class="g-dialog__description" id="d-${id}-desc">${desc}</p>`:''}</div>${o.noclose?'':close}</div>`
const D=[
 ['simple','Simple','g-dialog--size-sm g-dialog--mobile-sheet',head('simple','Aviso','Un diálogo simple, sin superficie inset.')+`<div class="g-dialog__body"><p>El contenido vive directamente en la carcasa.</p></div><div class="g-dialog__footer">${btn('Entendido',{v:'solid',attr:'data-close'})}</div>`],
 ['inset','Con inset','g-dialog--size-md g-dialog--inset g-dialog--mobile-sheet',head('inset','Resumen','El contenido está alojado en la superficie inset.')+'<div class="g-dialog__inset"><div class="g-dialog__body"><p>Esta superficie queda a poca distancia del borde y comparte su centro de curvatura.</p><p>Puede contener texto, listas, resúmenes o controles.</p></div></div>'],
 ['foot','Con pie','g-dialog--size-md g-dialog--inset g-dialog--mobile-sheet',head('foot','Guardar cambios','')+`<div class="g-dialog__inset"><div class="g-dialog__body"><p>El pie pertenece a la inset y lleva las acciones.</p></div><div class="g-dialog__footer">${btn('Cancelar',{attr:'data-close'})}${btn('Guardar',{v:'solid',attr:'data-close'})}</div></div>`],
 ['sections','Secciones','g-dialog--size-md g-dialog--inset g-dialog--mobile-sheet',head('sections','Preferencias','Varias secciones en una sola inset, separadas por línea.')+`<div class="g-dialog__inset"><div class="g-dialog__body"><section class="g-dialog__section"><h3 style="margin:0 0 8px;font-size:14px">General</h3>Nombre y visibilidad.</section><section class="g-dialog__section"><h3 style="margin:0 0 8px;font-size:14px">Avisos</h3><div class="g-dialog__well">Una superficie secundaria agrupa solo lo que lo necesita.</div></section><section class="g-dialog__section"><h3 style="margin:0 0 8px;font-size:14px">Zona de riesgo</h3>Acciones que no se pueden deshacer.</section></div><div class="g-dialog__footer">${btn('Cancelar',{attr:'data-close'})}${btn('Aplicar',{v:'solid',attr:'data-close'})}</div></div>`],
 ['scroll','Scroll','g-dialog--size-md g-dialog--inset g-dialog--mobile-sheet',head('scroll','Términos y condiciones','')+`<div class="g-dialog__inset" data-inset><div class="g-dialog__body is-scrollable" tabindex="0" role="region" aria-labelledby="d-scroll-title" data-scroll>__LOREM__</div><div class="g-dialog__footer">${btn('Rechazar',{attr:'data-close'})}${btn('Aceptar',{v:'solid',attr:'data-close'})}</div></div>`],
 ['confirm','Confirmación','g-dialog--size-sm g-dialog--inset g-dialog--alert g-dialog--mobile-sheet',head('confirm','¿Eliminar el proyecto?','Se borrarán sus 24 archivos. Esta acción no se puede deshacer.',{icon:1,noclose:1})+`<div class="g-dialog__inset"><div class="g-dialog__body"></div><div class="g-dialog__footer">${btn('Cancelar',{attr:'data-close autofocus'})}${btn('Eliminar',{v:'solid',c:'danger',attr:'data-close'})}</div></div>`,'role="alertdialog" aria-describedby="d-confirm-desc"'],
 ['form','Formulario','g-dialog--size-md g-dialog--inset g-dialog--mobile-sheet',head('form','Nuevo contacto','Los campos marcados con * son obligatorios.')+`<div class="g-dialog__inset"><div class="g-dialog__body"><form id="f1" method="dialog"><label class="f">Nombre *<input class="f" name="n" required></label><label class="f">Correo *<input class="f" name="e" type="email" required></label></form></div><div class="g-dialog__footer">${btn('Cancelar',{attr:'data-close'})}${btn('Crear',{v:'solid',type:'submit',attr:'form="f1"'})}</div></div>`],
 ['full','Pantalla completa','g-dialog--size-md g-dialog--inset g-dialog--fullscreen g-dialog--mobile-sheet',head('full','Editor','')+`<div class="g-dialog__inset"><div class="g-dialog__body"><p>Ocupa todo el visor y conserva las dos superficies.</p></div><div class="g-dialog__footer">${btn('Cancelar',{attr:'data-close'})}${btn('Listo',{v:'solid',attr:'data-close'})}</div></div>`],
 ['loading','Cargando','g-dialog--size-md g-dialog--inset g-dialog--mobile-sheet is-loading',head('loading','Guardando…','')+`<div class="g-dialog__inset"><div class="g-dialog__body"><p>La acción está en curso.</p></div><div class="g-dialog__footer">${btn('Cancelar',{attr:'data-close'})}</div></div>`,'aria-busy="true"'],
 ['lg','Grande + compacto','g-dialog--size-lg g-dialog--density-compact g-dialog--inset g-dialog--mobile-full-width',head('lg','Detalle','Tamaño lg, densidad compact, móvil ancho completo.')+`<div class="g-dialog__inset"><div class="g-dialog__body"><p>Contenido.</p></div><div class="g-dialog__footer">${btn('Cerrar',{attr:'data-close'})}</div></div>`],
 ['fs','Móvil pantalla completa','g-dialog--size-md g-dialog--inset g-dialog--mobile-fullscreen',head('fs','Móvil · pantalla completa','')+`<div class="g-dialog__inset"><div class="g-dialog__body"><p>En ≤520px ocupa todo el visor.</p></div><div class="g-dialog__footer">${btn('Listo',{v:'solid',attr:'data-close'})}</div></div>`],
]
document.getElementById('host').innerHTML=D.map(([id,l,c,i,a])=>dlg(id,c,i,a||'')).join('').replace('__LOREM__',`<p>Cláusula 1. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 2. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 3. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 4. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 5. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 6. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 7. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 8. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 9. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 10. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 11. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p><p>Cláusula 12. Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris.</p>`)
document.getElementById('openers').innerHTML=D.map(([id,l])=>btn(l,{attr:`data-open="${id}"`})).join('')+btn('Tema de prueba',{v:'solid',c:'accent',attr:'id="theme-btn"'})
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){const d=document.getElementById('d-'+o.dataset.open);d.showModal();sync(d)}
 const c=e.target.closest('[data-close]');if(c)c.closest('dialog').close(); const dl=e.target; if(dl.tagName==='DIALOG'&&dl.getAttribute('role')!=='alertdialog')dl.close()})
function sync(d){const b=d.querySelector('[data-scroll]');if(!b)return;const i=b.closest('.g-dialog__inset');const f=()=>i.classList.toggle('is-scrolled',b.scrollTop+b.clientHeight<b.scrollHeight-1);b.onscroll=f;f()}
const T=`:root{--g-color-brand:#7A1F5C;--g-color-brand-strong:#5E184A;--g-color-on-brand:#fff;--g-color-accent:#0F766E;--g-color-focus:#0F766E;--g-color-bg:#FFF6E5;--g-color-surface:#FFFBF2;--g-color-surface-sunken:#F1DDB6;--g-color-text:#3B2A1A;--g-color-text-muted:#6B4E33;--g-color-border:#D8BE8A;--g-color-border-strong:#B99A62;--g-color-border-control:#8A6A30;--g-radius-xl:28px;--g-radius-md:0px;--g-radius-sm:0px;--g-border-width:2px;--g-focus-width:3px;--g-space-1:5px;--g-space-2:10px;--g-space-3:15px;--g-space-4:20px;--g-space-5:25px;--g-space-6:30px;--g-space-8:40px;--g-space-12:60px;--g-font-ui:Georgia,serif;--g-surface-backdrop:rgb(59 42 26 / .45)}`
document.getElementById('theme-btn').addEventListener('click',()=>{const s=document.getElementById('theme');s.textContent=s.textContent?'':T})
</script>
</body></html>
