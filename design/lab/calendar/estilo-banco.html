<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GCalendar · banco de pruebas de estilo (coco)</title>
  <!-- Banco de coco: marcado exacto de design/contracts/calendar.md con el CSS real y el tema por defecto.
       Las posiciones llegan como variables dinámicas SIN unidad (minutos), como las emitirá el .vue.
       Sirve para verificar el CSS antes de que exista GCalendar.vue. No es documentación. -->
  <!-- Se cargan con un parámetro anti-caché: el banco es una herramienta de desarrollo y no debe mostrar CSS viejo -->
  <script>['styles/defaults.css', 'components/GCalendar/GCalendar.css'].forEach((f) => document.write(`<link rel="stylesheet" href="../../../packages/vue/src/${f}?v=${Date.now()}">`))</script>
  <style>
    body { margin: 0; padding: 16px; background: var(--g-color-bg); color: var(--g-color-text); font-family: var(--g-font-ui); }
    h2 { font-size: 14px; margin: 24px 0 8px; } .frame { max-width: 100%; margin-bottom: 8px; overflow: auto; resize: horizontal; border: 1px dashed #999; }
  </style>
</head>
<body>
<div id="app"></div>
<script>
const NOW = 10 * 60 + 10, START = 7 * 60, END = 22 * 60, MIN = END - START, GRID = 30
const RES = [{ id: 'a', t: 'Recurso A', s: 'Sala 1' }, { id: 'b', t: 'Recurso B', s: 'Sala 2' }, { id: 'c', t: 'Recurso C', s: 'Taller' }, { id: 'd', t: 'Recurso D', s: 'Vehículo' }]
const H = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`
const EV = [
  { r: 'a', s: 540, e: 600, t: 'Reunión de equipo', c: 'accent' }, { r: 'a', s: 555 + 0, e: 660, t: 'Revisión', c: 'success', st: 'tentative' }, { r: 'a', s: 570, e: 675, t: 'Llamada', c: 'info' }, { r: 'a', s: 585, e: 690, t: 'Enfoque' },
  { r: 'a', s: 763, e: 792, t: 'Cita corta', c: 'danger' }, { r: 'a', s: 543, e: 548, t: 'Trámite (5 min)', c: 'warning' }, { r: 'a', s: 577, e: null, t: 'Turno activo', c: 'brand', st: 'active' },
  { r: 'b', s: 570, e: 600, t: 'Inspección', c: 'neutral' }, { r: 'b', s: 660, e: 780, t: 'Mantenimiento', c: 'warning' }, { r: 'd', s: 540, e: 720, t: 'Ruta 12', c: 'accent' }
]
const BLK = [{ r: 'a', s: 840, e: 900, why: 'Descanso' }, { r: 'c', s: 600, e: 780, why: 'Mantenimiento' }]
const AV = { a: [[420, 540], [1080, 1320], [840, 900]], b: [[420, 540], [1080, 1320]], c: [[420, 600], [960, 1320]], d: [[420, 480], [1020, 1320]] }
const lanes = (segs, minMin) => { segs.sort((a, b) => a.s - b.s || b.e - a.e); let cl = [], ce = -1, le = []; const close = () => { cl.forEach((x) => (x.lanes = le.length)); cl = []; le = []; ce = -1 }; for (const x of segs) { if (cl.length && x.s >= ce) close(); const v = Math.max(x.e, x.s + minMin); let l = le.findIndex((q) => q <= x.s); if (l < 0) { l = le.length; le.push(0) } le[l] = v; x.lane = l; cl.push(x); ce = Math.max(ce, v) } close(); return segs }
const evLi = (x, r, opts = {}) => `<li style="--_start:${x.s - START};--_dur:${x.e - x.s};--_lane:${x.lane};--_lanes:${x.lanes}"><button class="g-calendar__event${opts.sm ? ' g-calendar__event--sm' : ''}${x.st === 'active' ? ' g-calendar__event--open' : ''}${x.sel ? ' is-selected' : ''}${x.conf ? ' is-conflict' : ''}" type="button" ${x.c ? `data-color="${x.c}"` : ''} ${x.st ? `data-status="${x.st}"` : ''} aria-label="${x.t}, ${H(x.s)} a ${H(x.e)}, ${r}"><span class="g-calendar__event-title">${x.t}</span><span class="g-calendar__event-time">${x.open ? H(x.s) + ' – ahora' : H(x.s) + '–' + H(x.e)}</span></button>${x.st === 'active' ? '' : '<span class="g-calendar__handle" aria-hidden="true"></span>'}</li>`
const colHTML = (rid, opts = {}) => {
  const av = (AV[rid] || []).map(([a, b]) => `<div style="--_start:${a - START};--_dur:${b - a}"></div>`).join('')
  const segs = EV.filter((e) => e.r === rid).map((e) => ({ ...e, open: e.e == null, e: e.e == null ? Math.max(NOW, e.s + 30) : e.e })); lanes(segs, 24)
  const blk = BLK.filter((b) => b.r === rid).map((b) => `<li class="g-calendar__block" style="--_start:${b.s - START};--_dur:${b.e - b.s}"><span aria-hidden="true">${b.why}</span><span class="g-calendar__sr">No disponible, ${H(b.s)} a ${H(b.e)}, ${b.why}</span></li>`).join('')
  return `<div class="g-calendar__col${opts.today ? ' is-today' : ''}" data-resource="${rid}"><div class="g-calendar__availability" aria-hidden="true">${av}</div><ul class="g-calendar__events" aria-label="${rid}">${blk}${segs.map((x) => evLi({ ...x, sel: opts.sel === x.t, conf: opts.conf === x.t }, 'Recurso ' + rid.toUpperCase(), { sm: x.e - x.s < 30 })).join('')}</ul>${opts.today ? `<div class="g-calendar__now" aria-hidden="true" style="--_start:${NOW - START}"><span>ahora 10:10</span></div>` : ''}${opts.ghost ? `<div class="g-calendar__ghost${opts.ghost.conf ? ' is-conflict' : ''}" style="top:calc(${opts.ghost.s - START} * var(--_ppm));height:calc(${opts.ghost.d} * var(--_ppm));inset-inline:2px">${H(opts.ghost.s)}</div>` : ''}</div>`
}
const axis = () => `<div class="g-calendar__axis" aria-hidden="true" style="--_minutes:${MIN}">${[...Array(END / 60 - START / 60 + 1)].map((_, i) => `<span style="--_start:${i * 60}">${String(START / 60 + i).padStart(2, '0')}:00</span>`).join('')}</div>`
const toolbar = (view, title) => `<div class="g-calendar__toolbar" role="toolbar" aria-label="Navegación"><button class="g-calendar__prev" type="button" aria-label="Anterior">‹</button><button class="g-calendar__today" type="button">Hoy</button><button class="g-calendar__next" type="button" aria-label="Siguiente">›</button><h2 class="g-calendar__title">${title}</h2><div class="g-calendar__views" role="group" aria-label="Vista">${['day', 'week', 'month', 'timeline'].map((v) => `<button type="button" aria-pressed="${v === view}">${{ day: 'Día', week: 'Semana', month: 'Mes', timeline: 'Timeline' }[v]}</button>`).join('')}</div></div>`
const root = (view, inner, o = {}) => `<div class="g-calendar g-calendar--view-${view} g-calendar--density-${o.dens || 'comfortable'} g-calendar--mode-${o.mode || 'desktop'}${o.cls || ''}" role="region" aria-label="Calendario" ${o.busy ? 'aria-busy="true"' : ''} style="--_grid:${GRID}">${toolbar(view, o.title || 'martes, 29 de septiembre de 2026')}<div class="g-calendar__status" role="status">${o.status || ''}</div><div class="g-calendar__viewport">${inner}</div><div class="g-calendar__live" aria-live="polite"></div></div>`
const dayView = (rids, o = {}) => `<div class="g-calendar__grid" style="--_cols:${rids.length};--_minutes:${MIN}"><div></div>${rids.map((r) => `<div class="g-calendar__head is-today" aria-current="date"><span class="g-calendar__head-title">${RES.find((x) => x.id === r).t}</span>mar 29</div>`).join('')}<div class="g-calendar__allday"><div>Día completo</div>${rids.map(() => '<div></div>').join('')}</div>${axis()}${rids.map((r) => colHTML(r, { today: true, ...(r === 'a' ? o : {}) })).join('')}</div>`
const weekView = () => { const days = ['lun 28', 'mar 29', 'mié 30', 'jue 1', 'vie 2', 'sáb 3', 'dom 4']; return `<div class="g-calendar__grid" style="--_cols:7;--_minutes:${MIN}"><div></div>${days.map((d, i) => `<div class="g-calendar__head${i === 1 ? ' is-today' : ''}"${i === 1 ? ' aria-current="date"' : ''}><span class="g-calendar__head-title">${d}</span>Recurso A</div>`).join('')}<div class="g-calendar__allday"><div>Día completo</div>${days.map((d, i) => `<div>${i === 1 ? '<button class="g-calendar__event" type="button" data-color="neutral" style="block-size:auto"><span class="g-calendar__event-title">Feriado</span></button>' : ''}</div>`).join('')}</div>${axis()}${days.map((d, i) => i === 1 ? colHTML('a', { today: true }) : `<div class="g-calendar__col"><div class="g-calendar__availability" aria-hidden="true">${i > 4 ? `<div style="--_start:0;--_dur:${MIN}"></div>` : ''}</div><ul class="g-calendar__events">${i === 0 ? evLi({ s: 540, e: 630, t: 'Planeación', lane: 0, lanes: 1, c: 'accent' }, 'Recurso A') : ''}</ul></div>`).join('')}</div>` }
const timelineView = (rids) => `<div class="g-calendar__timeline" style="--_minutes:${MIN}"><div class="g-calendar__axis" aria-hidden="true"><div></div>${[...Array(16)].map((_, i) => `<span style="--_start:${i * 60}">${String(7 + i).padStart(2, '0')}:00</span>`).join('')}</div><ul class="g-calendar__rows" style="margin:0;padding:0;list-style:none;position:relative">${rids.map((r) => { const segs = EV.filter((e) => e.r === r).map((e) => ({ ...e, open: e.e == null, e: e.e == null ? Math.max(NOW, e.s + 30) : e.e })); lanes(segs, 45); const n = Math.max(1, ...segs.map((s) => s.lane + 1)); return `<li class="g-calendar__row"><div class="g-calendar__label"><span class="g-calendar__label-title">${RES.find((x) => x.id === r).t}</span><span class="g-calendar__label-sub">${RES.find((x) => x.id === r).s}</span></div><div class="g-calendar__track" style="--_lanes:${n}"><div class="g-calendar__availability" aria-hidden="true">${(AV[r] || []).map(([a, b]) => `<div style="--_start:${a - START};--_dur:${b - a}"></div>`).join('')}</div><ul class="g-calendar__events">${BLK.filter((b) => b.r === r).map((b) => `<li class="g-calendar__block" style="--_start:${b.s - START};--_dur:${b.e - b.s}"><span aria-hidden="true">${b.why}</span><span class="g-calendar__sr">No disponible</span></li>`).join('')}${segs.map((x) => evLi(x, RES.find((q) => q.id === r).t, { sm: true }).replace('--_lane:', '--_lane:').replace(/--_lanes:\d+/, '--_lanes:1')).join('')}</ul></div></li>` }).join('')}<div class="g-calendar__now" aria-hidden="true" style="--_start:${NOW - START}"></div></ul></div>`
const monthView = () => { const days = []; for (let i = 0; i < 42; i++) { const d = new Date(Date.UTC(2026, 7, 31 + i)); days.push({ n: d.getUTCDate(), out: d.getUTCMonth() !== 8, today: d.getUTCMonth() === 8 && d.getUTCDate() === 29, ev: [0, 3, 5, 1, 4, 0][i % 6] }) } return `<table class="g-calendar__month" aria-label="Mes"><thead><tr>${['lun', 'mar', 'mié', 'jue', 'vie', 'sáb', 'dom'].map((x) => `<th scope="col">${x}</th>`).join('')}</tr></thead><tbody>${[...Array(6)].map((_, w) => `<tr>${days.slice(w * 7, w * 7 + 7).map((d) => `<td class="${d.out ? 'is-outside ' : ''}${d.today ? 'is-today' : ''}" ${d.today ? 'aria-current="date"' : ''}><button class="g-calendar__day" type="button" aria-label="${d.n}, ${d.ev} eventos">${d.n}</button><span class="g-calendar__dots" aria-hidden="true">${d.ev ? '● ' + d.ev : ''}</span><ul class="g-calendar__events">${[...Array(Math.min(d.ev, 3))].map((_, k) => `<li><button class="g-calendar__event" type="button" data-color="${['accent', 'success', 'warning'][k]}"><span class="g-calendar__event-time">0${9 + k}:00</span><span class="g-calendar__event-title">Evento ${d.n}.${k + 1}</span></button></li>`).join('')}${d.ev > 3 ? `<li><button class="g-calendar__more" type="button">+${d.ev - 3} más</button></li>` : ''}</ul></td>`).join('')}</tr>`).join('')}</tbody></table>` }
const phoneRes = () => `<ul class="g-calendar__resources">${[['Recurso A', 'Ocupado · evento activo'], ['Recurso B', 'Ocupado hasta 10:30'], ['Recurso C', 'Bloqueado'], ['Recurso D', 'Disponible · próximo evento 11:00']].map(([a, b]) => `<li><button class="g-calendar__resource" type="button"><span>${a}</span><span>${b}</span></button></li>`).join('')}</ul>`
const phoneWeek = () => `<div class="g-calendar__strip" role="group" aria-label="Días">${['L 28', 'M 29', 'X 30', 'J 1', 'V 2', 'S 3', 'D 4'].map((d, i) => `<button type="button" aria-pressed="${i === 1}">${d}</button>`).join('')}</div><ul class="g-calendar__agenda">${EV.filter((e) => e.r === 'a').slice(0, 4).map((e) => `<li><button class="g-calendar__event" type="button" data-color="${e.c || 'neutral'}"><span class="g-calendar__event-title">${e.t}</span><span class="g-calendar__event-time">${H(e.s)}–${e.e ? H(e.e) : 'ahora'}</span></button></li>`).join('')}</ul>`
const frame = (w, html, cap) => `<p style="font-size:12px;margin:12px 0 4px">${cap}</p><div class="frame" style="width:${w}px">${html}</div>`
document.getElementById('app').innerHTML =
  frame(1100, root('day', dayView(['a', 'b', 'c']), { status: '' }), 'Día · 3 recursos (columnas)') +
  frame(1100, root('day', dayView(['a'], { sel: 'Llamada' }), { title: 'Día · recurso A (Llamada seleccionada; Revisión tentativa; Turno activo abierto)' }), 'Día · 1 recurso') +
  frame(1100, root('week', weekView(), { title: 'lun 28 – dom 4 · 2026' }), 'Semana') +
  frame(1100, root('month', monthView(), { title: 'septiembre de 2026', status: 'Mes con varios recursos: los eventos se mezclan.' }), 'Mes') +
  frame(1100, root('timeline', timelineView(['a', 'b', 'c', 'd'])), 'Timeline · 4 recursos') +
  frame(360, root('day', phoneRes(), { mode: 'phone' }), 'Teléfono · lista de recursos') +
  frame(360, root('week', phoneWeek(), { mode: 'phone', title: 'lun 28 – dom 4 · 2026' }), 'Teléfono · semana (tira + agenda)') +
  frame(360, root('month', monthView(), { mode: 'phone', title: 'septiembre de 2026' }), 'Teléfono · mes (compacto)') +
  frame(1100, root('week', `<div class="g-calendar__skeleton" aria-busy="true"><i></i><i></i><i></i><i></i></div>`, { cls: ' is-loading', busy: true }), 'Cargando (conserva la barra)') +
  frame(1100, root('week', '', { cls: ' is-error', status: 'No fue posible cargar los eventos.' }), 'Error')
</script>
</body>
</html>
