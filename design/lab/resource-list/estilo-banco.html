<title>GResourceList · banco de estilo (coco)</title>
<!-- Banco de coco para GResourceList (forma C · «La frase», #709 a #725). El .vue aún no existe: XResourceList (estilo-banco.js)
     pinta el marcado EXACTO de design/contracts/resource-list.md («Anatomía» y «Clases y datos») con los componentes REALES
     de packages/vue/dist (GPageHeader, GTable, GMenu, GTag, GInput, GBtn, GIcon, GEmpty) y el CSS real del block
     (packages/blocks/src/components.css → layer(grana.blocks)). Solo hace lo que el estilo necesita: is-narrow
     (< space × 150, medido en su raíz), facetas plegadas en estrecho, frase con un GMenu de radios por hueco, la palabra
     nueva re-creada por su texto, total / masivas / par armado en el toolbar. No es la implementación de bruno.
     Las enmiendas de la v1 que aún no tienen JS (#717 recuento a cero, #718 motivo y par de GMenu, #725 fila de búsqueda
     de GMenu y pista de la pila de GFab) se pintan con marcado ESTÁTICO de sus clases (?view=menu, ?view=fab) o se
     simulan sobre el DOM real (is-empty en g-table__count); está dicho en cada caso.
     Requiere dist/ (npm run build). Desde la raíz: python3 -m http.server 4209 → /design/lab/resource-list/estilo-banco.html
     Parámetros: ?view=block|base|menu|fab  ?state=rest|selected|armed|empty|filtered|forbidden  ?tabs=1  ?dark=1
       ?theme=<generated/*.css>  ?rtl=1  ?coarse=1 (solo marca; el táctil real lo da el contexto de Playwright)
     Verificación: GRANA_PW_PORT=4209 node design/lab/resource-list/estilo-verificar.mjs -->

</style>
