<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBadge · banco de pruebas de estilo (coco)</title>
<!-- Banco de coco: marcado exacto de design/contracts/badge.md con el CSS real y el tema por defecto. No es documentación. -->
<link rel="stylesheet" href="../../../packages/vue/src/styles/defaults.css">
<link rel="stylesheet" href="../../../packages/vue/src/components/GBadge/GBadge.css?v=1" id="css-b">
<style id="theme"></style>
<style>
  body{margin:0;padding:24px;background:var(--g-color-bg);color:var(--g-color-text);font-family:var(--g-font-ui)}
  h2{font-size:15px;margin:24px 0 8px}.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
  .bg{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;padding:14px;border-radius:12px}
  .bg--dark{background:#000}.bg--white{background:#fff}.bg--photo{background:radial-gradient(circle at 20% 30%,#e4572e 0,transparent 40%),radial-gradient(circle at 80% 20%,#17bebb 0,transparent 45%),radial-gradient(circle at 60% 90%,#ffc914 0,transparent 45%),#2e282a}
  .bg--stripes{background:repeating-linear-gradient(45deg,#000 0 8px,#fff 8px 16px)}
  .avatar{display:inline-grid;place-content:center;width:40px;height:40px;border-radius:50%;background:var(--g-color-surface-sunken);border:1px solid var(--g-color-border-control);font-weight:700}
  .iconbtn{display:inline-grid;place-content:center;width:44px;height:44px;border-radius:8px;background:var(--g-color-surface);border:1px solid var(--g-color-border-control);cursor:pointer}
  .frame{border:1px solid var(--g-color-border);padding:12px;resize:horizontal;overflow:auto;max-width:100%}
</style>
</head>
<body>
<button id="theme-btn" type="button">Tema de prueba</button> <label><input type="checkbox" id="nt"> Simular transparencia reducida</label>
<div id="app"></div>
<script>
const COLORS=['brand','accent','neutral','success','warning','danger','info'],VARS=['solid','soft','outline','glass']
const P={bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',check:'<path d="M20 6 9 17l-5-5"/>',mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-10 7L2 7"/>'}
const ico=n=>`<span class="g-badge__icon" aria-hidden="true"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg></span>`
const cls=(o,kind)=>['g-badge',`g-badge--variant-${o.v||'soft'}`,`g-badge--color-${o.c||'neutral'}`,`g-badge--size-${o.s||'md'}`,`g-badge--kind-${kind}`].join(' ')
const sr=t=>t?`<span class="g-badge__sr">${t}</span>`:''
const text=(t,o={})=>`<span class="${cls(o,'text')}">${o.shape?`<span class="g-badge__shape g-badge__shape--${o.shape}" aria-hidden="true"></span>`:''}${o.icon?ico(o.icon):''}<span class="g-badge__text">${t}</span></span>`
const iconOnly=(i,l,o={})=>`<span class="${cls(o,'icon')}">${ico(i)}${sr(l)}</span>`
const figure=(sh,l,o={})=>`<span class="${cls(o,'figure')}"><span class="g-badge__shape g-badge__shape--${sh}" aria-hidden="true"></span>${sr(l)}</span>`
const count=(n,l,o={})=>`<span class="${cls(o,'count')}"><span class="g-badge__text" aria-hidden="true">${n>(o.max||99)?(o.max||99)+'+':n}</span>${sr(l)}</span>`
const anchor=(t,b,p='top-end')=>`<span class="g-badge-anchor g-badge-anchor--${p}">${t}${b}</span>`
const sec=(t,h)=>`<h2>${t}</h2><div class="row">${h}</div>`
const html=[
 sec('Texto: 4 variantes × 7 colores (md)',VARS.map(v=>`<div class="bg bg--photo" style="padding:8px">${COLORS.map(c=>text(c,{v,c})).join('')}</div>`).join('')),
 sec('Tamaños',['sm','md','lg'].map(s=>text('Activo',{s,v:'soft',shape:'circle'})+count(12,'12',{s,v:'solid',c:'danger'})+iconOnly('bell','n',{s,v:'soft'})+figure('triangle','Error',{s,v:'solid',c:'danger'})).join('')),
 sec('Figuras (solid, soft, outline) con color',['circle','square','diamond','triangle'].flatMap(sh=>['solid','soft','outline'].map(v=>figure(sh,sh,{v,c:'success'}))).join('')),
 sec('Texto + figura / icono',['circle','square','diamond','triangle'].map(sh=>text('Estado',{v:'soft',c:'warning',shape:sh})).join('')+text('Verificado',{v:'soft',c:'success',icon:'check'})+text('Nuevo',{v:'solid',c:'accent',icon:'mail'})),
 sec('Contador',[0,1,12,99,100,1000].map(n=>n===0?'':count(n,String(n),{v:'solid',c:'danger'})).join('')),
 `<h2>Liquid glass sobre distintos fondos (× 7 colores)</h2>`+['dark','photo','stripes','white'].map(b=>`<div class="bg bg--${b}" data-bg="${b}" style="margin-bottom:8px">${COLORS.map(c=>text(c,{v:'glass',c})+figure('circle',c,{v:'glass',c})+iconOnly('bell',c,{v:'glass',c})+count(12,c,{v:'glass',c})).join('')}${anchor('<span class="avatar" aria-label="Ana">A</span>',count(3,'3',{s:'sm',v:'glass'}))}</div>`).join(''),
 sec('Anclada (cuatro esquinas)',['top-end','top-start','bottom-end','bottom-start'].map(p=>anchor('<span class="avatar" aria-label="x">A</span>',count(3,'3',{s:'sm',v:'solid',c:'danger'}),p)).join('')+anchor('<button class="iconbtn" id="bt" type="button" aria-label="Bandeja"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">'+P.mail+'</svg></button>',count(120,'120',{s:'sm',v:'solid',c:'danger'}))),
 `<h2>RTL</h2><div class="row" dir="rtl">${anchor('<span class="avatar" aria-label="x">أ</span>',count(3,'3',{s:'sm',v:'solid',c:'danger'}))}${text('نشط',{v:'soft',c:'success',shape:'circle'})}</div>`,
 `<h2>Texto largo (160px)</h2><div class="frame" style="width:160px">${text('Un texto de insignia demasiado largo para caber',{v:'soft'})}</div>`
].join('')
document.getElementById('app').innerHTML=html
const T=`:root{--g-color-brand:#7A1F5C;--g-color-brand-soft:#F6E4EE;--g-color-brand-text:#7A1F5C;--g-color-on-brand-soft:#5E184A;--g-color-accent:#0F766E;--g-color-accent-soft:#DDF3F0;--g-color-accent-text:#0F766E;--g-color-on-accent-soft:#0B4F4A;--g-color-neutral-soft:#EFE3CB;--g-color-bg:#FFF6E5;--g-color-surface:#FFFBF2;--g-color-surface-sunken:#F1DDB6;--g-color-text:#3B2A1A;--g-color-text-muted:#6B4E33;--g-color-border:#D8BE8A;--g-color-border-control:#8A6A30;--g-border-width:2px;--g-space-1:5px;--g-space-2:10px;--g-space-3:15px;--g-font-ui:Georgia,serif;--g-glass-tint:#FFF6E5;--g-glass-opacity:.72}`
document.getElementById('theme-btn').addEventListener('click',()=>{const s=document.getElementById('theme');s.textContent=s.textContent?'':T})
document.getElementById('nt').addEventListener('change',e=>{let s=document.getElementById('nt-style');if(!s){s=document.createElement('style');s.id='nt-style';document.head.appendChild(s)}s.textContent=e.target.checked?`.g-badge--variant-glass{--_bg:var(--_soft) !important;--_border:var(--g-color-border) !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;box-shadow:none !important}.g-badge--variant-glass::before{display:none}`:''})
</script>
</body></html>
